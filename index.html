<style>
/* =====================================================================
   英会話台本トレーナー スタイル
   - 英文と日本語でフォントを分ける（英文が日本語フォントだと読みにくく、
     音読の質に直接響くため。SPEC §12）
   - 色はすべて変数にしておき、テーマ切り替えは :root の属性だけで行う
   ===================================================================== */

:root {
  --fs: 1;

  --font-ja: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --font-en: -apple-system, "Segoe UI", Roboto, sans-serif;

  --bg:      #faf9f7;
  --panel:   #ffffff;
  --panel2:  #f4f2ee;
  --ink:     #1d1c1a;
  --muted:   #6f6a63;
  --line:    #e2ded7;
  --accent:  #2f6f4f;
  --accent-ink: #ffffff;
  --danger:  #a8352b;
  --warn-bg: #fdf3d6;
  --warn-ink:#6d5400;
  --err-bg:  #fbe9e7;
  --err-ink: #8f2a20;
  --chip:    #eeebe5;
  --shadow:  0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
}

/* 端末設定に追従（data-theme="auto" のとき） */
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg:      #17181a;
    --panel:   #212326;
    --panel2:  #2a2d31;
    --ink:     #e9e7e3;
    --muted:   #9a958d;
    --line:    #383c41;
    --accent:  #6fbf92;
    --accent-ink: #10231a;
    --danger:  #e0796d;
    --warn-bg: #3a3218;
    --warn-ink:#e6cf8a;
    --err-bg:  #3b2320;
    --err-ink: #f0a99f;
    --chip:    #32363b;
    --shadow:  0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg:      #17181a;
  --panel:   #212326;
  --panel2:  #2a2d31;
  --ink:     #e9e7e3;
  --muted:   #9a958d;
  --line:    #383c41;
  --accent:  #6fbf92;
  --accent-ink: #10231a;
  --danger:  #e0796d;
  --warn-bg: #3a3218;
  --warn-ink:#e6cf8a;
  --err-bg:  #3b2320;
  --err-ink: #f0a99f;
  --chip:    #32363b;
  --shadow:  0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }

html {
  /* 文字サイズ設定（fontScale）は :root の変数だけで効かせる */
  font-size: calc(16px * var(--fs));
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ja);
  line-height: 1.7;
  font-size: 1rem;
}

/* 英文はここで必ず英字フォントに切り替える */
.en, input.en, textarea.en { font-family: var(--font-en); }

.app { min-height: 100vh; }

/* ---- アプリバー -------------------------------------------------- */
.appbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: .5rem;
  min-height: 3rem;
  padding: .45rem max(.75rem, env(safe-area-inset-left)) .45rem max(.75rem, env(safe-area-inset-right));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line);
}
.appbar__title { font-size: 1rem; font-weight: 700; flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appbar__actions { display: flex; gap: .35rem; flex: 0 0 auto; }

.view {
  max-width: 44rem; margin: 0 auto;
  padding: .85rem max(.75rem, env(safe-area-inset-left)) 5rem max(.75rem, env(safe-area-inset-right));
}

/* ---- 汎用パーツ ---------------------------------------------------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: .7rem;
  padding: .85rem;
  margin: 0 0 .75rem;
  box-shadow: var(--shadow);
}
.card--flat { box-shadow: none; }
.card__head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .5rem; }
.card__title { font-size: .95rem; font-weight: 700; margin: 0; flex: 1 1 auto; }

.section-title { font-size: .78rem; font-weight: 700; color: var(--muted);
  letter-spacing: .04em; margin: 1.2rem 0 .45rem; }

.muted { color: var(--muted); }
.small { font-size: .8rem; }
.tiny  { font-size: .72rem; }
.mono  { font-variant-numeric: tabular-nums; }
.right { margin-left: auto; }
.row   { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.row--tight { gap: .3rem; }
.stack > * + * { margin-top: .5rem; }
.grow  { flex: 1 1 auto; min-width: 0; }
.hidden { display: none !important; }

/* ボタン */
.btn {
  font: inherit; font-size: .85rem; font-family: var(--font-ja);
  padding: .42rem .8rem; border-radius: .5rem;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  cursor: pointer; line-height: 1.4; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover:not(:disabled) { background: var(--panel2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn--primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--sm { font-size: .75rem; padding: .25rem .5rem; }
.btn--icon { font-size: .8rem; padding: .25rem .45rem; min-width: 1.9rem; }
.btn--block { width: 100%; justify-content: center; }
.btn--wide { display: block; width: 100%; text-align: left; padding: .7rem .8rem; }

/* 入力 */
input[type="text"], input[type="number"], textarea, select {
  font: inherit; font-size: .9rem; font-family: var(--font-ja);
  width: 100%; padding: .45rem .55rem;
  border: 1px solid var(--line); border-radius: .45rem;
  background: var(--panel); color: var(--ink);
}
textarea { resize: vertical; line-height: 1.55; }
input:focus, textarea:focus, select:focus {
  outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px;
}
label.field { display: block; }
label.field > .field__label { display: block; font-size: .72rem; color: var(--muted); margin-bottom: .15rem; }

/* チップ */
.chip {
  display: inline-flex; align-items: center; gap: .25rem;
  font-size: .72rem; padding: .12rem .45rem; border-radius: 1rem;
  background: var(--chip); color: var(--muted); white-space: nowrap;
}
.chip--btn { cursor: pointer; border: none; font-family: var(--font-ja); }
.chip--btn:hover { filter: brightness(.96); }

/* 通知 */
.note-box { border-radius: .5rem; padding: .5rem .65rem; font-size: .8rem; }
.note-box--warn { background: var(--warn-bg); color: var(--warn-ink); }
.note-box--err  { background: var(--err-bg);  color: var(--err-ink); }
.note-box ul { margin: .3rem 0 0; padding-left: 1.1rem; }
.note-box li { margin: .1rem 0; }

/* トースト */
.toast-root { position: fixed; left: 0; right: 0; bottom: 1.2rem; z-index: 60;
  display: flex; flex-direction: column; align-items: center; gap: .4rem; pointer-events: none; }
.toast { background: #22262b; color: #f4f2ee; font-size: .82rem;
  padding: .5rem .9rem; border-radius: 1.2rem; box-shadow: 0 6px 20px rgba(0,0,0,.28);
  max-width: 90vw; }

/* ダイアログ */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.42);
  display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: var(--panel); border-radius: .8rem; padding: 1rem;
  width: min(28rem, 100%); max-height: 84vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.modal__title { font-size: .95rem; font-weight: 700; margin: 0 0 .5rem; }
.modal__body { font-size: .87rem; }
.modal__actions { display: flex; gap: .4rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .9rem; }

/* ---- ホーム -------------------------------------------------------- */
.home-item { display: flex; align-items: center; gap: .6rem; width: 100%;
  padding: .7rem .8rem; border: 1px solid var(--line); background: var(--panel);
  border-radius: .6rem; margin-bottom: .4rem; font: inherit; font-size: .9rem;
  color: var(--ink); text-align: left; cursor: pointer; }
.home-item:hover:not(:disabled) { background: var(--panel2); }
.home-item:disabled { opacity: .5; cursor: default; }
.home-item__icon { font-size: 1rem; flex: 0 0 auto; width: 1.4rem; text-align: center; }
.home-item__body { flex: 1 1 auto; min-width: 0; }
.home-item__sub { font-size: .72rem; color: var(--muted); }

.topic-card { display: block; width: 100%; text-align: left; cursor: pointer;
  font: inherit; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: .6rem;
  padding: .7rem .8rem; margin-bottom: .45rem; }
.topic-card:hover { background: var(--panel2); }
.topic-card__title { font-weight: 700; font-size: .92rem; }
.topic-card__meta { font-size: .74rem; color: var(--muted); margin-top: .15rem; }

.empty { text-align: center; color: var(--muted); font-size: .85rem; padding: 1.6rem .5rem; }

/* ---- トピック詳細 --------------------------------------------------- */
.line-view { display: flex; gap: .55rem; padding: .5rem 0; border-top: 1px solid var(--line); }
.line-view:first-child { border-top: none; }
.line-view__no { flex: 0 0 2.6rem; font-size: .7rem; color: var(--muted); padding-top: .2rem; }
.line-view__en { font-size: .95rem; }
.line-view__ja { font-size: .8rem; color: var(--muted); }
.line-view__mine { color: var(--accent); font-weight: 700; }

.block-head { font-size: .74rem; font-weight: 700; color: var(--muted);
  background: var(--panel2); border-radius: .35rem; padding: .18rem .5rem; margin: .6rem 0 .2rem; }

/* ---- 一覧モード（§4.1）・検索結果の行 -------------------------------
   ネイティブ button の見た目を引きずらないよう、.btn には乗らず
   .topic-card と同じ方式で自己完結させる。 */
.list-row { display: block; width: 100%; text-align: left; cursor: pointer;
  font: inherit; font-size: .9rem; color: var(--ink); background: transparent;
  border: none; border-top: 1px solid var(--line); border-radius: 0;
  padding: .55rem .15rem; }
.list-row:first-child { border-top: none; }
.list-row:hover { background: var(--panel2); }

/* ---- 編集プレビュー ------------------------------------------------- */
.stat-bar { position: sticky; top: 3rem; z-index: 15;
  background: var(--panel2); border: 1px solid var(--line); border-radius: .5rem;
  padding: .4rem .6rem; font-size: .76rem; color: var(--muted);
  margin-bottom: .7rem; display: flex; flex-wrap: wrap; gap: .1rem .8rem; }
.stat-bar b { color: var(--ink); font-variant-numeric: tabular-nums; }

.ed-line { border: 1px solid var(--line); border-radius: .55rem; background: var(--panel);
  padding: .5rem .55rem; margin-bottom: .35rem; }
.ed-line.is-drop { border-color: var(--accent); box-shadow: 0 -3px 0 -1px var(--accent) inset; }
.ed-line__top { display: flex; align-items: center; gap: .35rem; margin-bottom: .35rem; }
.ed-line__no { font-size: .7rem; color: var(--muted); min-width: 1.6rem; }
.ed-line__sp { width: auto; max-width: 9rem; font-size: .78rem; padding: .2rem .35rem; }
.ed-line__tools { display: flex; gap: .2rem; margin-left: auto; flex-wrap: wrap; }
.ed-line textarea { font-size: .88rem; }
.ed-line textarea.ja-in { font-size: .82rem; }
.ed-line__extra { margin-top: .35rem; padding-top: .35rem; border-top: 1px dashed var(--line); }

/* チャンク境界エディタ（§1.8。自動分割は必ず外すのでタップで直せるようにする） */
.chunks { font-family: var(--font-en); font-size: .82rem; line-height: 2.1; }
.chunks__w { padding: .05rem 0; }
.chunks__gap { display: inline-block; width: .85rem; text-align: center; color: var(--line);
  cursor: pointer; border-radius: .2rem; user-select: none; }
.chunks__gap:hover { background: var(--chip); color: var(--muted); }
.chunks__bar { display: inline-block; width: 1rem; text-align: center; color: var(--accent);
  cursor: pointer; font-weight: 700; border-radius: .2rem; user-select: none; }
.chunks__bar:hover { background: var(--chip); }

/* ブロック境界（ドラッグで動かす） */
.blk-div { display: flex; align-items: center; gap: .4rem; margin: .5rem 0 .35rem;
  padding: .25rem .35rem; border-radius: .4rem; background: var(--panel2);
  border: 1px dashed var(--line); }
.blk-div.is-dragging { border-style: solid; border-color: var(--accent); opacity: .85; }
.blk-div__grip { cursor: grab; touch-action: none; user-select: none;
  font-size: .8rem; color: var(--muted); padding: .1rem .35rem; border-radius: .3rem; }
.blk-div__grip:active { cursor: grabbing; }
.blk-div__label { font-size: .76rem; padding: .15rem .4rem; max-width: 12rem; }
.blk-div__no { font-size: .7rem; color: var(--muted); font-weight: 700; }

/* 語彙エディタ */
.word-row { border: 1px solid var(--line); border-radius: .5rem; padding: .45rem .5rem;
  margin-bottom: .35rem; background: var(--panel); }
.word-row__grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: .3rem; align-items: start; }
.word-row__ids { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .3rem; align-items: center; }
@media (max-width: 30rem) {
  .word-row__grid { grid-template-columns: 1fr; }
}

/* 貼り付け画面 */
.paste-area { min-height: 12rem; font-size: .85rem; }
.sample-hint { background: var(--panel2); border-radius: .45rem; padding: .5rem .6rem;
  font-size: .74rem; color: var(--muted); white-space: pre-wrap; }
.sample-hint .en { font-size: .76rem; }

/* 設定 */
.setting-row { display: flex; align-items: center; gap: .6rem; padding: .5rem 0;
  border-top: 1px solid var(--line); }
.setting-row:first-child { border-top: none; }
.setting-row__label { flex: 1 1 auto; font-size: .86rem; }
.setting-row__sub { font-size: .72rem; color: var(--muted); }
.setting-row select, .setting-row input { width: auto; min-width: 6rem; }

window.EST.SAMPLES = [{"id":"tpc_sample_checkin","title":"空港のチェックインカウンター","titleEn":"At the Check-in Counter","level":"B1","tags":["旅行","空港"],"myRole":"S2","speakers":[{"id":"S1","label":"Agent","gender":"female"},{"id":"S2","label":"You","gender":"male"}],"blocks":[],"lines":[{"id":"ln_001","speakerId":"S1","en":"Good morning. May I see your passport, please?","ja":"おはようございます。パスポートを拝見してもよろしいですか？","note":"May I 〜 は Can I 〜 より丁寧。カウンター業務では定番。","skip":false},{"id":"ln_002","speakerId":"S2","en":"Sure, here you go.","ja":"はい、どうぞ。","note":"Here you go. は物を手渡すときの定型。","skip":false},{"id":"ln_003","speakerId":"S1","en":"Thank you. Are you checking any bags today?","ja":"ありがとうございます。本日、お預けの荷物はございますか？","note":"check a bag = 荷物を預ける。","skip":false},{"id":"ln_004","speakerId":"S2","en":"Yes, just this one suitcase.","ja":"はい、このスーツケース一つだけです。","note":"just = only。会話では just のほうが自然で柔らかい。","skip":false},{"id":"ln_005","speakerId":"S1","en":"Could you place it on the scale for me?","ja":"こちらの計りに載せていただけますか？","note":"place = put のフォーマル版。","skip":false},{"id":"ln_006","speakerId":"S2","en":"There you go. Is it under the weight limit?","ja":"はい、載せました。重量制限は超えていませんか？","note":"There you go. は動作を完了したときの「はい、どうぞ」。","skip":false},{"id":"ln_007","speakerId":"S1","en":"It's twenty-two kilos, so you're fine. The limit is twenty-three.","ja":"22キロですので大丈夫です。制限は23キロまでです。","note":"you're fine = 問題ありません。","skip":false},{"id":"ln_008","speakerId":"S2","en":"Great. Could I get an aisle seat if possible?","ja":"よかった。できれば通路側の席をお願いできますか？","note":"aisle seat = 通路側。if possible を添えると角が立たない。","skip":false},{"id":"ln_009","speakerId":"S1","en":"Let me check. I have one available near the front.","ja":"確認いたします。前方に一席空きがございます。","note":"Let me check. は「確認します」の最頻出フレーズ。","skip":false},{"id":"ln_010","speakerId":"S2","en":"That would be perfect. Thank you so much.","ja":"それで完璧です。本当にありがとうございます。","note":"提案を受け入れるときの丁寧な言い方。","skip":false},{"id":"ln_011","speakerId":"S1","en":"Here's your boarding pass. Your gate is B12 and 強い肯定の相づち"},{"id":"w_017","en":"Will do.","ja":"そうします","type":"phrase","lineIds":["ln_017"],"note":"I will do it. の省略。口語で頻出"},{"id":"w_018","en":"restart","ja":"再起動する","type":"word","lineIds":["ln_018"],"note":""},{"id":"w_019","en":"pay by card","ja":"カードで払う","type":"phrase","lineIds":["ln_019"],"note":"現金なら pay in cash。前置詞が違う"},{"id":"w_020","en":"whenever you're ready","ja":"ご準備ができ次第","type":"phrase","lineIds":["ln_020"],"note":"急かさない丁寧な言い方"}],"createdAt":1754179200000,"updatedAt":1754179200000,"schemaVersion":3}];

<script>
/* ---- 00-store.js ---- */
/* =====================================================================
   00-store.js — IndexedDB の薄いラッパ（SPEC §5.8）
   IndexedDB = ブラウザに内蔵されたデータベース。localStorage と違って
   大きなデータや Blob（音声）を入れられるので、保存先はこちらに統一する。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var DB_NAME = 'est-db';
  var DB_VERSION = 3;

  // F1 で実際に使うのは topics / topicProgress / settings の3つだけ。
  // ただし後から version を上げると移行処理を書く羽目になるので、
  // §5.8 の6ストアを最初から全部作っておく。
  var STORES = [
    { name: 'topics',        keyPath: 'id' },
    { name: 'progress',      keyPath: 'key' },
    { name: 'wordProgress',  keyPath: 'key' },
    { name: 'topicProgress', keyPath: 'topicId' },
    { name: 'audio',         keyPath: 'key' },
    { name: 'settings',      keyPath: 'k' }
  ];

  // §5.9 設定はプロフィールごと（"app|tamo"）。台本に属する共有情報は
  // どちらの部屋のものでもないので、"shared" の1件に分けて置く。
  var SETTINGS_PREFIX = 'app';
  var SETTINGS_SHARED_KEY = 'shared';
  var LS_MIRROR_KEY = 'est.settings.mirror'; // 起動直後にテーマを当てるためのミラー

  // §5.7 の既定値
  var DEFAULT_SETTINGS = {
    engine: 'local',
    cloud: { endpoint: '', token: '', voiceMap: {}, model: 'tts-1-hd' },
    ttsRate: 0.95,
    localVoiceEn: null,
    mic: { noiseFloor: null, onsetThreshold: null, calibratedAt: null },
    countRatio: 0.55,
    masteryBase: 1200,
    masteryPerWord: 60,
    inputMode: 'voice',
    dailyGoalLaps: 10,
    theme: 'auto',
    fontScale: 1.0,
    recordOpens: true,         // §4.1 一覧モードで開いた行を復習キューに入れるか
    autoBackups: []            // §6.4 直近3世代（部屋ごとに持つ）
  };

  // 台本に属する共有情報（どちらの部屋からでも同じものを見る）
  var DEFAULT_SHARED = {
    samplesSeeded: false,      // サンプル台本を入れたか
    publishedAt: 0,            // §6.5 最後に取り込んだ配信の publishedAt
    feedTopicIds: []           // 配信由来のトピックid。手元で作った台本と区別するため
  };

  var dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!self.indexedDB) { reject(new Error('この環境では IndexedDB が使えません')); return; }
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function () {
        var db = req.result;
        STORES.forEach(function (s) {
          if (!db.objectStoreNames.contains(s.name)) {
            db.createObjectStore(s.name, { keyPath: s.keyPath });
          }
        });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('別のタブが古いデータベースを開いています')); };
    });
    return dbPromise;
  }

  function run(storeName, mode, fn) {
    return open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(storeName, mode);
        var store = tx.objectStore(storeName);
        var out;
        try { out = fn(store); } catch (e) { reject(e); return; }
        tx.oncomplete = function () { resolve(out && out.__req ? out.__req.result : out); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error || new Error('保存が中断されました')); };
      });
    });
  }

  function wrap(req) { return { __req: req }; }

  function get(storeName, key) {
    return run(storeName, 'readonly', function (s) { return wrap(s.get(key)); });
  }
  function getAll(storeName) {
    return run(storeName, 'readonly', function (s) { return wrap(s.getAll()); })
      .then(function (r) { return r || []; });
  }
  function put(storeName, value) {
    return run(storeName, 'readwrite', function (s) { s.put(value); return value; });
  }
  function bulkPut(storeName, values) {
    return run(storeName, 'readwrite', function (s) {
      (values || []).forEach(function (v) { s.put(v); });
      return (values || []).length;
    });
  }
  function del(storeName, key) {
    return run(storeName, 'readwrite', function (s) { s.delete(key); return true; });
  }
  function clear(storeName) {
    return run(storeName, 'readwrite', function (s) { s.clear(); return true; });
  }

  /* ---- プロフィールつきキー（§5.9） -----------------------------------
     既存のキーの先頭に profileId を足すだけにする。
       progress       "tamo|tpc_xxx|ln_001"
       wordProgress   "mari|tpc_xxx|w_003"
       topicProgress  "tamo|tpc_xxx"
       settings       "app|tamo"
     topics と audio は2人で共有するのでプレフィックスを付けない。
  --------------------------------------------------------------------- */
  function pid() {
    // プロフィール未選択のまま呼ばれたら既定の部屋にしておく。
    // （起動直後に読む設定のためで、選択画面はこの後すぐ出る）
    return (EST.profile && EST.profile.get()) || 'tamo';
  }

  function progressKey(topicId, lineId) { return pid() + '|' + topicId + '|' + lineId; }
  function wordProgressKey(topicId, wordId) { return pid() + '|' + topicId + '|' + wordId; }
  function topicProgressKey(topicId) { return pid() + '|' + topicId; }
  function settingsKey(profileId) { return SETTINGS_PREFIX + '|' + (profileId || pid()); }

  // その行が今の部屋のものか（バックアップの絞り込みに使う）
  function belongsToProfile(key, profileId) {
    return String(key || '').indexOf((profileId || pid()) + '|') === 0;
  }

  /* ---- 一覧モードで開いた記録（§4.1・§5.5） ---------------------------
     Progress レコードが無ければ既定形で新規作成し、openedCount を1増やす。
     カウント・レイテンシ等は F4〜F7 が別途書き込むので、ここでは触らない。
  --------------------------------------------------------------------- */
  function markLineOpened(topicId, lineId) {
    var key = progressKey(topicId, lineId);
    return get('progress', key).then(function (rec) {
      var next = rec || EST.schema.defaultProgress(pid(), topicId, lineId);
      next.openedCount = (next.openedCount || 0) + 1;
      next.lastOpenedAt = Date.now();
      next.updatedAt = Date.now();
      return put('progress', next);
    });
  }

  // ---- 設定 -----------------------------------------------------------
  function withDefaults(defaults, v) {
    var out = JSON.parse(JSON.stringify(defaults));
    if (v && typeof v === 'object') {
      Object.keys(v).forEach(function (k) {
        if (v[k] !== undefined) out[k] = v[k];
      });
    }
    return out;
  }

  function deepDefault(v) { return withDefaults(DEFAULT_SETTINGS, v); }

  function loadSettings(profileId) {
    return get('settings', settingsKey(profileId)).then(function (rec) {
      var s = deepDefault(rec && rec.v);
      mirror(s);
      return s;
    });
  }

  function saveSettings(s, profileId) {
    var v = deepDefault(s);
    mirror(v);
    return put('settings', { k: settingsKey(profileId), v: v }).then(function () { return v; });
  }

  // 共有情報（サンプル投入済みか、配信の publishedAt）
  function loadShared() {
    return get('settings', SETTINGS_SHARED_KEY).then(function (rec) {
      return withDefaults(DEFAULT_SHARED, rec && rec.v);
    });
  }

  function saveShared(v) {
    var out = withDefaults(DEFAULT_SHARED, v);
    return put('settings', { k: SETTINGS_SHARED_KEY, v: out }).then(function () { return out; });
  }

  // テーマと文字サイズだけは起動直後（DBを開く前）に当てたいので
  // localStorage にミラーする。SPEC 上も「設定のミラーのみ可」。
  function mirror(s) {
    try {
      localStorage.setItem(LS_MIRROR_KEY, JSON.stringify({
        theme: s.theme, fontScale: s.fontScale
      }));
    } catch (e) { /* プライベートモード等。失敗しても致命的ではない */ }
  }

  function readMirror() {
    try {
      var raw = localStorage.getItem(LS_MIRROR_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  EST.store = {
    DB_NAME: DB_NAME,
    DB_VERSION: DB_VERSION,
    STORES: STORES.map(function (s) { return s.name; }),
    DEFAULT_SETTINGS: DEFAULT_SETTINGS,
    DEFAULT_SHARED: DEFAULT_SHARED,
    SETTINGS_SHARED_KEY: SETTINGS_SHARED_KEY,
    progressKey: progressKey,
    wordProgressKey: wordProgressKey,
    topicProgressKey: topicProgressKey,
    settingsKey: settingsKey,
    belongsToProfile: belongsToProfile,
    markLineOpened: markLineOpened,
    loadShared: loadShared,
    saveShared: saveShared,
    open: open,
    get: get,
    getAll: getAll,
    put: put,
    bulkPut: bulkPut,
    del: del,
    clear: clear,
    loadSettings: loadSettings,
    saveSettings: saveSettings,
    readMirror: readMirror
  };
})(window.EST = window.EST || {});

<script>
/* ---- 01-schema.js ---- */
/* =====================================================================
   01-schema.js — スキーマ検証・正規化・台本パーサ・自動分割
   SPEC §1.5 / §1.8 / §5.1-5.3 / §6.1 / §6.3
   ===================================================================== */
;(function (EST) {
  'use strict';

  /* ---- 調整用の定数（実機で必ず調整する。SPEC §12） ------------------ */
  var SCHEMA_VERSION      = 3;

  var JA_RATIO_MIN        = 0.15;  // §6.1 日本語文字の比率がこれ以上なら JA 行とみなす
  var SPEAKER_LABEL_MAX   = 6;     // 話者ラベルの種類がこれを超えたら「コロンが多いだけ」
  var SPEAKER_LABEL_LEN   = 24;    // 話者ラベルとして許す最大文字数
  var DELIM_RATIO_MIN     = 0.7;   // 区切り文字を含む行がこの比率以上なら列分割へ切り替え
  var PAIR_PURITY_MIN     = 0.6;   // 英文ブロック／和文ブロック形式と判定する純度

  var BLOCK_AUTO_MIN      = 13;    // §1.5 この行数以上でブロック自動分割
  var BLOCK_AUTO_SIZE     = 5;     // 機械的に5行ずつ

  var CHUNK_MAX_WORDS     = 5;     // §1.8 これを超えたらもう一度割る
  var CHUNK_BREAK_MIN     = 3;     // この点数以上の切れ目で割る

  var WORD_MS             = 400;   // §2.3 内蔵TTS想定の1語あたりの所要
  var LINE_GAP_MS         = 350;   // 行と行のあいだの間
  var DEFAULT_RATE        = 0.95;  // §5.7 ttsRate の既定

  // §5.1 誰の課題か。未指定は "both" として扱う（既存データを壊さないため）
  var AUDIENCES = ['tamo', 'mari', 'both'];
  var AUDIENCE_DEFAULT = 'both';

  /* ---- 語のテーブル（チャンク自動分割用。§1.8） ---------------------- */
  function set(list) { var o = {}; list.forEach(function (w) { o[w] = true; }); return o; }

  var PREP = set(['in','on','at','for','with','about','from','to','of','by','into','onto',
    'over','under','after','before','during','through','across','around','against',
    'between','beyond','near','since','until','till','upon','within','without','off','out']);
  var CONJ = set(['and','but','so','because','if','when','while','although','though',
    'unless','whether','or','nor','yet','as','than','once','whenever']);
  var REL  = set(['who','which','that','whom','whose','where','why']);

  var SEP_MARK = '@@EST_SEP@@';   // 英文/和文ブロックの区切りを退避する内部マーカー

  /* ---- 小道具 -------------------------------------------------------- */
  function pad3(n) { return ('00' + n).slice(-3); }

  function countWords(en) {
    var t = String(en == null ? '' : en).trim();
    if (!t) return 0;
    return t.split(/\s+/).length;
  }

  function jaRatio(s) {
    var t = String(s || '').replace(/\s/g, '');
    if (!t.length) return 0;
    var m = t.match(/[ぁ-ゖァ-ヺー一-鿿々]/g);
    return m ? m.length / t.length : 0;
  }

  // カタカナ→ひらがな（§4.2 横断検索の表記揺れ吸収）。長音符ーはそのまま残す。
  function toHiragana(s) {
    return String(s || '').replace(/[ァ-ヶ]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0x60);
    });
  }

  // 検索用の正規化：カタカナをひらがなに寄せ、英字は小文字化する
  function normalizeForSearch(s) {
    return toHiragana(String(s == null ? '' : s)).toLowerCase();
  }

  // 1行を EN / JA / IGNORE に分類する（§6.1 手順2）
  function classifyLine(s) {
    var t = String(s || '').trim();
    if (!t) return 'IGNORE';
    if (/^[-=_*—]{3,}$/.test(t)) return 'IGNORE';
    if (jaRatio(t) >= JA_RATIO_MIN) return 'JA';
    if (/[A-Za-z]/.test(t)) return 'EN';
    return 'IGNORE';
  }

  // 行頭の「ラベル:」を切り出す（§6.1 手順3）。時刻とURLは除外する。
  function splitLabel(text) {
    var m = /^([^\s:：][^:：]{0,23})[:：][ \t]*(.*)$/.exec(String(text || ''));
    if (!m) return null;
    var label = m[1].trim();
    if (!label) return null;
    if (label.length > SPEAKER_LABEL_LEN) return null;
    if (/^\d{1,2}$/.test(label)) return null;                          // 10:30 のような時刻
    if (/^(https?|ftp|mailto|tel|file|data)$/i.test(label)) return null; // URL
    if (/[.!?。？！]$/.test(label)) return null;                        // 文中のコロン
    return { label: label, rest: m[2].trim() };
  }

  function newTopicId() {
    var d = new Date();
    var ymd = '' + d.getFullYear() + pad3(d.getMonth() + 1).slice(-2) + pad3(d.getDate()).slice(-2);
    var rnd = Math.random().toString(36).slice(2, 6);
    return 'tpc_' + ymd + '_' + rnd;
  }

  /* ---- 台本テキストの正規化（§6.1 手順1） ---------------------------- */
  function normalizeRaw(raw) {
    var t = String(raw == null ? '' : raw);
    t = t.replace(/\r\n?/g, '\n');
    // 全角スペース(U+3000)・ノーブレークスペース(U+00A0)・ゼロ幅スペースを半角に寄せる
    t = t.replace(/[\u3000\u00a0\u200b]/g, ' ');
    t = t.split('\n').map(function (l) { return l.replace(/[ \t]+$/, ''); }).join('\n');
    // 「連続空行2つ以上」は英文ブロックと和文ブロックの区切りの合図なので、
    // 空行を畳み込む前にマーカーへ退避しておく（畳み込むと合図が消えてしまう）
    t = t.replace(/\n[ \t]*\n[ \t]*\n[\s]*/g, '\n' + SEP_MARK + '\n');
    t = t.replace(/^[ \t]*[-=]{3,}[ \t]*$/gm, SEP_MARK);
    return t;
  }

  function toLines(t) {
    return t.split('\n').map(function (l) { return l.trim(); })
            .filter(function (l) { return l.length > 0; });
  }

  /* ---- 台本パーサ（§6.1） -------------------------------------------- */
  // 戻り値: { speakers, lines, warnings, mode }
  function parseScript(raw) {
    var warnings = [];
    var lines = toLines(normalizeRaw(raw));
    if (!lines.length) return { speakers: [], lines: [], warnings: ['台本が空です'], mode: 'empty' };

    var entries = null, mode = '';

    // (a) 英文ブロックのあとに和文ブロックが続く形
    var pair = tryPairMode(lines);
    if (pair) { entries = pair; mode = 'pair'; }

    if (!entries) {
      lines = lines.filter(function (l) { return l !== SEP_MARK; });
      // (b) 区切り文字による列分割（§6.1 手順4）
      var col = tryColumnMode(lines);
      if (col) { entries = col; mode = 'column'; }
    }

    // (c) 英日交互（既定）
    if (!entries) { entries = buildInterleaved(lines, true); mode = 'interleave'; }

    // 話者ラベルの採否（§6.1 手順3）
    var labels = [];
    entries.forEach(function (e) {
      if (e.label && labels.indexOf(e.label) < 0) labels.push(e.label);
    });

    var adopt = labels.length >= 1 && labels.length <= SPEAKER_LABEL_MAX;
    if (labels.length > SPEAKER_LABEL_MAX) {
      // ラベルが多すぎるときは「コロンが多いだけ」とみなし、切り出さずにやり直す
      warnings.push('行頭のコロンが' + labels.length + '種類あったので、話者ラベルとして扱いませんでした');
      if (mode === 'interleave') entries = buildInterleaved(lines, false);
      else entries.forEach(function (e) {
        if (e.label) { e.en = e.label + ': ' + e.en; e.label = null; }
      });
      adopt = false;
    }

    var speakers = resolveSpeakers(entries, adopt);
    if (!adopt) warnings.push('話者が判別できなかったので、A と B に交互に割り当てました');

    var out = entries.filter(function (e) { return e.en && e.en.trim(); })
      .map(function (e, i) {
        return {
          id: 'ln_' + pad3(i + 1),
          speakerId: e.speakerId,
          en: e.en.trim(),
          ja: (e.ja || '').trim(),
          note: '',
          alt: [],
          chunks: splitChunks(e.en),
          skip: false
        };
      });

    var noJa = out.filter(function (l) { return !l.ja; }).length;
    if (noJa) warnings.push('和訳が付いていない行が ' + noJa + ' 件あります（S5 和訳から出す が使えません）');
    if (out.length >= BLOCK_AUTO_MIN) {
      warnings.push(out.length + '行あるので ' + BLOCK_AUTO_SIZE + '行ずつ機械的にブロック分割しました。境界はドラッグで動かせます');
    }

    return { speakers: speakers, lines: out, warnings: warnings, mode: mode };
  }

  // (a) 英文ブロック --- 和文ブロック
  function tryPairMode(lines) {
    var at = lines.indexOf(SEP_MARK);
    if (at <= 0) return null;
    if (lines.lastIndexOf(SEP_MARK) !== at) return null;  // 区切りが複数あるなら別の形式
    var a = lines.slice(0, at).filter(function (l) { return l !== SEP_MARK; });
    var b = lines.slice(at + 1).filter(function (l) { return l !== SEP_MARK; });
    if (!a.length || a.length !== b.length) return null;  // 行数一致が条件（§6.1）

    function purity(arr, kind) {
      var n = 0;
      arr.forEach(function (l) {
        var body = splitLabel(l);
        if (classifyLine(body && body.rest ? body.rest : l) === kind) n++;
      });
      return n / arr.length;
    }
    if (purity(a, 'EN') < PAIR_PURITY_MIN) return null;
    if (purity(b, 'JA') < PAIR_PURITY_MIN) return null;

    return a.map(function (enLine, i) {
      var sp = splitLabel(enLine);
      var label = null, en = enLine;
      if (sp && sp.rest) { label = sp.label; en = sp.rest; }
      var jb = splitLabel(b[i]);
      var ja = (jb && jb.rest) ? jb.rest : b[i];
      return { label: label, en: en, ja: ja };

  // (b) タブ / | / ｜ / / による列分割
  function tryColumnMode(lines) {
    var re = /\t|\||｜/;
    var hit = lines.filter(function (l) { return re.test(l); }).length;
    var useSlash = false;
    if (hit / lines.length < DELIM_RATIO_MIN) {
      // 「/」は英文中にも出るので、タブや縦棒が無いときだけ候補にする
      hit = lines.filter(function (l) { return / \/ |\//.test(l) && jaRatio(l) > 0; }).length;
      if (hit / lines.length < DELIM_RATIO_MIN) return null;
      useSlash = true;

    var splitter = useSlash ? /\s*\/\s*/ : /\s*[\t|｜]\s*/;

    return lines.map(function (l) {
      var parts = l.split(splitter).map(function (p) { return p.trim(); })
                   .filter(function (p) { return p.length > 0; });
      var label = null, en = '', ja = '';
      if (parts.length >= 3 && parts[0].length <= SPEAKER_LABEL_LEN &&
          jaRatio(parts[0]) < JA_RATIO_MIN && !/[.!?]$/.test(parts[0])) {
        label = parts[0]; en = parts[1]; ja = parts.slice(2).join(' ');
      } else if (parts.length >= 2) {
        en = parts[0]; ja = parts.slice(1).join(' ');
      } else {
        en = parts[0] || '';
      }
      var sp = splitLabel(en);
      if (!label && sp && sp.rest) { label = sp.label; en = sp.rest; }
      // 列の並びが逆（和文が先）のときは入れ替える
      if (jaRatio(en) >= JA_RATIO_MIN && jaRatio(ja) < JA_RATIO_MIN) { var t = en; en = ja; ja = t; }
      return { label: label, en: en, ja: ja };
    }).filter(function (e) { return e.en; });
  }

  // (c) 英日交互（§6.1 手順5）
  function buildInterleaved(lines, useLabels) {
    var entries = [];
    var pendingJa = [];   // 英文より先に和文が来た場合の受け皿
    lines.forEach(function (line) {
      if (line === SEP_MARK) return;
      var label = null, text = line;
      if (useLabels) {
        var sp = splitLabel(line);
        if (sp && sp.rest) { label = sp.label; text = sp.rest; }
      }
      var cls = classifyLine(text);
      if (cls === 'JA') {
        if (entries.length) {
          var last = entries[entries.length - 1];
          // JA行が2行続いたら結合する（§6.1 手順5）
          last.ja = last.ja ? (last.ja + text) : text;
        } else {
          pendingJa.push(text);
        }
      } else if (cls === 'EN') {
        // EN行が2行続いたら、前の行は訳なしで確定（新しい entry を積むだけでよい）
        entries.push({ label: label, en: text, ja: pendingJa.join('') });
        pendingJa = [];
      }
    });
    return entries;
  }

  function resolveSpeakers(entries, adopt) {
    var speakers = [], map = {};
    if (adopt) {
      entries.forEach(function (e) {
        if (e.label && !map[e.label]) {
          var id = 'S' + (speakers.length + 1);
          map[e.label] = id;
          speakers.push({ id: id, label: e.label, gender: '' });
        }
      });
      var last = speakers.length ? speakers[0].id : 'S1';
      entries.forEach(function (e) {
        e.speakerId = e.label ? map[e.label] : last;   // ラベルのない行は直前の話者を引き継ぐ
        last = e.speakerId;
      });
    } else {
      speakers = [{ id: 'S1', label: 'A', gender: '' }, { id: 'S2', label: 'B', gender: '' }];
      entries.forEach(function (e, i) { e.speakerId = (i % 2 === 0) ? 'S1' : 'S2'; });
    }
    if (!speakers.length) speakers = [{ id: 'S1', label: 'A', gender: '' }];
    return speakers;
  }

  /* ---- チャンク自動分割（§1.8） -------------------------------------- */
  function bareWord(w) {
    return String(w).replace(/^[^A-Za-z0-9']+/, '').replace(/[^A-Za-z0-9']+$/, '').toLowerCase();
  }

  // tokens[i] の直前で切るべきかの点数。0 なら切らない。
  function breakScore(tokens, i) {
    if (i <= 0 || i >= tokens.length) return 0;
    var prev = tokens[i - 1];
    var cur = bareWord(tokens[i]);
    var s = 0;
    if (/[,;:]$/.test(prev)) s = Math.max(s, 5);                 // カンマの直後がいちばん強い
    if (CONJ[cur] || REL[cur]) s = Math.max(s, 4);               // 接続詞・関係詞の直前
    if (cur === 'to' && i + 1 < tokens.length) s = Math.max(s, 3); // to不定詞の直前
    if (PREP[cur]) s = Math.max(s, 3);                           // 前置詞の直前
    return s;
  }

  function splitChunks(en) {
    var tokens = String(en == null ? '' : en).trim().split(/\s+/).filter(Boolean);
    if (tokens.length <= 1) return tokens.length ? [tokens.join(' ')] : [];

    var cuts = [];
    for (var i = 1; i < tokens.length; i++) {
      if (breakScore(tokens, i) >= CHUNK_BREAK_MIN) cuts.push(i);
    }
    var groups = cutsToGroups(tokens.length, cuts);
    groups = splitLongGroups(tokens, groups);
    groups = absorbSingles(groups);

    return groups.map(function (g) { return tokens.slice(g[0], g[1]).join(' '); });
  }

  function cutsToGroups(len, cuts) {
    var groups = [], start = 0;
    cuts.forEach(function (c) { if (c > start) { groups.push([start, c]); start = c; } });
    groups.push([start, len]);
    return groups;
  }

  // 5語を超えたら、その中の最も強い切れ目でもう一度割る（§1.8）
  function splitLongGroups(tokens, groups) {
    var out = [], guard = 0;
    var queue = groups.slice();
    while (queue.length && guard++ < 200) {
      var g = queue.shift();
      var len = g[1] - g[0];
      if (len <= CHUNK_MAX_WORDS) { out.push(g); continue; }
      var bestAt = -1, bestScore = -1;
      for (var i = g[0] + 1; i < g[1]; i++) {
        var sc = breakScore(tokens, i);
        // 中央に近いほうを優先すると、極端に偏った分割になりにくい
        var center = 1 - Math.abs((i - g[0]) / len - 0.5);
        var total = sc * 10 + center;
        if (sc > 0 && total > bestScore) { bestScore = total; bestAt = i; }
      }
      if (bestAt < 0) bestAt = g[0] + Math.ceil(len / 2);   // 切れ目が無ければ中央で割る
      queue.unshift([bestAt, g[1]]);
      queue.unshift([g[0], bestAt]);
    }
    return out.sort(function (a, b) { return a[0] - b[0]; });
  }

  // 1語だけになったら前のチャンクに吸収する（§1.8）
  function absorbSingles(groups) {
    var out = [];
    groups.forEach(function (g) {
      var len = g[1] - g[0];
      if (len === 1 && out.length) { out[out.length - 1][1] = g[1]; return; }
      out.push([g[0], g[1]]);
    });
    // 先頭が1語のまま残ったら次に吸収させる
    if (out.length >= 2 && out[0][1] - out[0][0] === 1) {
      out[1][0] = out[0][0];
      out.shift();
    }
    return out;
  }

  /* ---- ブロック（§1.5） ---------------------------------------------- */
  // ブロックは「何行目から始まるか」の配列（starts）として扱うほうが編集しやすい。
  function autoBlockStarts(lineCount) {
    if (lineCount < BLOCK_AUTO_MIN) return [];       // 12行以下はブロックを作らない
    var starts = [];
    for (var i = 0; i < lineCount; i += BLOCK_AUTO_SIZE) starts.push(i);
    return starts;
  }

  function blocksToStarts(blocks, lines) {
    if (!blocks || !blocks.length) return [];
    var index = {};
    lines.forEach(function (l, i) { index[l.id] = i; });
    var starts = [];
    blocks.forEach(function (b) {
      var i = index[b && b.from];
      if (typeof i === 'number' && starts.indexOf(i) < 0) starts.push(i);
    });
    starts.sort(function (a, b) { return a - b; });
    if (!starts.length) return [];
    if (starts[0] !== 0) starts.unshift(0);
    return starts;
  }

  function startsToBlocks(starts, lines, labels) {
    if (!starts || starts.length <= 1) return [];
    var out = [];
    starts.forEach(function (s, i) {
      var end = (i + 1 < starts.length ? starts[i + 1] : lines.length) - 1;
      if (s > end) return;
      out.push({
        id: 'b' + (out.length + 1),
        label: (labels && labels[i]) || ('パート' + (out.length + 1)),
        from: lines[s].id,
        to: lines[end].id
      });
    });
    return out;
  }

  /* ---- 検証（§6.3） --------------------------------------------------- */
  // エラーは1個ずつ返さず、全部まとめて返す（直す側が何往復もしないで済むように）
  function validateTopic(t, opts) {
    opts = opts || {};
    var errors = [], warnings = [];
    if (!t || typeof t !== 'object') return { errors: ['台本オブジェクトとして読めません'], warnings: [] };

    if (!String(t.title || '').trim()) errors.push('タイトルを入れてください');

    if (!Array.isArray(t.lines) || !t.lines.length) {
      errors.push('行が1件もありません');
    } else {
      t.lines.forEach(function (l, i) {
        var no = '（' + (i + 1) + '行目）';
        if (!l || !String(l.en || '').trim()) errors.push(no + '英文が空です');
        else if (!/[A-Za-z]/.test(l.en)) errors.push(no + '英文に英字が含まれていません');
        if (l && !String(l.ja || '').trim()) warnings.push(no + '和訳がありません');
      });
      var ids = {};
      t.lines.forEach(function (l, i) {
        if (!l || !l.id) return;
        if (ids[l.id]) errors.push('行IDが重複しています: ' + l.id);
        ids[l.id] = true;
      });
    }

    var sids = {};
    (t.speakers || []).forEach(function (s) {
      if (!s || !s.id) { errors.push('話者IDのない話者があります'); return; }
      if (sids[s.id]) errors.push('話者IDが重複しています: ' + s.id);
      sids[s.id] = true;
    });
    if (!(t.speakers || []).length) errors.push('話者が1人もいません');

    (t.lines || []).forEach(function (l, i) {
      if (l && l.speakerId && !sids[l.speakerId]) {
        errors.push('（' + (i + 1) + '行目）存在しない話者が指定されています: ' + l.speakerId);
      }
    });

    if (!t.myRole) {
      // S5/S6 に必須なので、保存時は通さない（§6.3 手順5）
      (opts.requireMyRole === false ? warnings : errors).push('自分の役（myRole）を選んでください');
    } else if (!sids[t.myRole]) {
      errors.push('自分の役に存在しない話者が指定されています: ' + t.myRole);
    }

    if (!t.audience) {
      // §6.3: 値が入っていなければ myRole と同じように保存を止める。
      // 黙って both になると相手の一覧に流れ込むので、ここは既定値で救わない。
      (opts.requireAudience === false ? warnings : errors).push('誰の台本か（自分用・相手用・両方）を選んでください');
    } else if (AUDIENCES.indexOf(String(t.audience)) < 0) {
      errors.push('誰の台本か（audience）の値が不正です: ' + t.audience);
    }

    (t.words || []).forEach(function (w, i) {
      if (!w || !String(w.en || '').trim()) errors.push('語彙 ' + (i + 1) + ' 件目の英語が空です');
    });

    return { errors: errors, warnings: warnings };
  }

  /* ---- 正規化（§6.3 手順4・6・7） ------------------------------------- */
  function normalizeTopic(input, opts) {
    opts = opts || {};
    var src = input || {};
    var now = Date.now();

    var speakers = (Array.isArray(src.speakers) ? src.speakers : [])
      .filter(function (s) { return s && s.id; })
      .map(function (s) {
        return { id: String(s.id), label: String(s.label || s.id), gender: s.gender || '' };
      });
    if (!speakers.length) speakers = [{ id: 'S1', label: 'A', gender: '' }];

    var speakerIds = speakers.map(function (s) { return s.id; });

    var lines = (Array.isArray(src.lines) ? src.lines : []).map(function (l, i) {
      l = l || {};
      var en = String(l.en == null ? '' : l.en).trim();
      var chunks = Array.isArray(l.chunks) && l.chunks.length ? l.chunks.map(String) : splitChunks(en);
      return {
        id: l.id ? String(l.id) : 'ln_' + pad3(i + 1),         // 手順4: 無ければ自動採番
        speakerId: (l.speakerId && speakerIds.indexOf(String(l.speakerId)) >= 0)
                     ? String(l.speakerId) : speakerIds[i % speakerIds.length],
        en: en,
        ja: String(l.ja == null ? '' : l.ja).trim(),
        note: String(l.note == null ? '' : l.note),
        alt: Array.isArray(l.alt) ? l.alt.map(String) : [],
        chunks: chunks,
        skip: !!l.skip
      };
    });

    // 手順6: blocks 未指定かつ13行以上なら5行ずつ自動分割
    var starts = blocksToStarts(src.blocks, lines);
    var labels = (Array.isArray(src.blocks) ? src.blocks : []).map(function (b) { return b && b.label; });
    if (!starts.length) { starts = autoBlockStarts(lines.length); labels = []; }
    var blocks = startsToBlocks(starts, lines, labels);

    // 手順7: words の自動抽出は F6 の担当。F1 では与えられたものを保持するだけ。
    var lineIdSet = {};
    lines.forEach(function (l) { lineIdSet[l.id] = true; });
    var words = (Array.isArray(src.words) ? src.words : []).map(function (w, i) {
      w = w || {};
      return {
        id: w.id ? String(w.id) : 'w_' + pad3(i + 1),
        en: String(w.en == null ? '' : w.en).trim(),
        ja: String(w.ja == null ? '' : w.ja).trim(),
        type: (w.type === 'word' || w.type === 'phrase') ? w.type
              : (countWords(w.en) > 1 ? 'phrase' : 'word'),
        lineIds: (Array.isArray(w.lineIds) ? w.lineIds : [])
                   .map(String).filter(function (id) { return lineIdSet[id]; }),
        note: String(w.note == null ? '' : w.note)
      };
    });

    var myRole = src.myRole && speakerIds.indexOf(String(src.myRole)) >= 0 ? String(src.myRole) : '';

    return {
      id: src.id ? String(src.id) : (opts.id || newTopicId()),
      title: String(src.title == null ? '' : src.title).trim(),
      titleEn: String(src.titleEn == null ? '' : src.titleEn).trim(),
      level: String(src.level == null ? '' : src.level).trim(),
      tags: (Array.isArray(src.tags) ? src.tags : []).map(String).filter(Boolean),
      // §6.3: "both" への救済は外部JSON（配信・同梱サンプル）専用。
      // opts.rescueAudience を渡した呼び出し元でだけ適用する。
      // 編集画面はこれを渡さないので、未指定・不正な値はそのまま空にして
      // 保存時に myRole と同じくエラーで止める（黙って both になるのを防ぐ）。
      audience: AUDIENCES.indexOf(String(src.audience)) >= 0 ? String(src.audience)
                : (opts.rescueAudience ? AUDIENCE_DEFAULT : ''),
      myRole: myRole,
      speakers: speakers,
      blocks: blocks,
      lines: lines,
      words: words,
      createdAt: Number(src.createdAt) || now,
      updatedAt: now,
      schemaVersion: SCHEMA_VERSION
    };
  }

  /* ---- Progress の既定形（§5.5） -------------------------------------
     一覧モード（§4.1）で行を開いた記録だけを先に持たせる。
     counts/latency/mastered 等の実データは F4〜F7 が書き込む。
  --------------------------------------------------------------------- */
  function defaultProgress(profileId, topicId, lineId) {
    return {
      key: profileId + '|' + topicId + '|' + lineId,
      profileId: profileId,
      topicId: topicId,
      lineId: lineId,
      counts: { total: 0, byStage: {} },
      latency: { history: [], median5: null, best: null },
      stalls: 0,
      openedCount: 0,
      lastOpenedAt: null,
      mastered: false,
      masteredAt: null,
      updatedAt: 0
    };
  }

  /* ---- 見積り（§6.2 の「1周 約◯秒」） -------------------------------- */
  function lapSeconds(lines, rate) {
    rate = Number(rate) || DEFAULT_RATE;
    var ms = 0;
    (lines || []).forEach(function (l) {
      if (!l || l.skip) return;
      ms += countWords(l.en) * WORD_MS / rate + LINE_GAP_MS;
    });
    return Math.round(ms / 1000);
  }

  /* ---- JSON のエラー位置（§6.3 手順1「不正なJSON」だけ出さない） ------ */
  function parseJsonWithPosition(text) {
    try {
      return { ok: true, value: JSON.parse(text) };
    } catch (e) {
      var msg = String(e && e.message || e);
      var m = /position\s+(\d+)/i.exec(msg);
      var where = '';
      if (m) {
        var pos = Number(m[1]);
        var before = text.slice(0, pos);
        var line = before.split('\n').length;
        var col = pos - before.lastIndexOf('\n');
        where = line + '行目 ' + col + '文字目';
      } else {
        var lm = /line\s+(\d+)\s+column\s+(\d+)/i.exec(msg);
        if (lm) where = lm[1] + '行目 ' + lm[2] + '文字目';
      }
      return { ok: false, error: msg, where: where };
    }
  }

  EST.schema = {
    SCHEMA_VERSION: SCHEMA_VERSION,
    AUDIENCES: AUDIENCES,
    AUDIENCE_DEFAULT: AUDIENCE_DEFAULT,
    BLOCK_AUTO_MIN: BLOCK_AUTO_MIN,
    BLOCK_AUTO_SIZE: BLOCK_AUTO_SIZE,
    DEFAULT_RATE: DEFAULT_RATE,

    countWords: countWords,
    jaRatio: jaRatio,
    toHiragana: toHiragana,
    normalizeForSearch: normalizeForSearch,
    classifyLine: classifyLine,
    normalizeRaw: normalizeRaw,
    parseScript: parseScript,

    splitChunks: splitChunks,
    autoBlockStarts: autoBlockStarts,
    blocksToStarts: blocksToStarts,
    startsToBlocks: startsToBlocks,

    validateTopic: validateTopic,
    normalizeTopic: normalizeTopic,
    defaultProgress: defaultProgress,
    lapSeconds: lapSeconds,
    newTopicId: newTopicId,
    pad3: pad3,
    parseJsonWithPosition: parseJsonWithPosition
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 06-profile.js ---- */
/* =====================================================================
   06-profile.js — プロフィール（部屋）: SPEC §5.9
   2人で同じアプリを使う。台本は共有、進捗は完全に分ける。
   ここは「今どちらの部屋か」を持つだけの小さなモジュールにする。
   キーの組み立ては 00-store.js 側で行う。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var LS_KEY = 'est-profile';

  // 権限は §5.9 の表のとおり。2人とも学習者で、タモやんが台本づくりと配信も担う。
  // まりに編集導線を出さないのは役割の上下ではなく、誤操作を防いで画面を単純に保つため。
  var PROFILES = [
    { id: 'tamo', label: 'タモやん', sub: '練習と台本づくり', canEdit: true },
    { id: 'mari', label: 'まり',     sub: '練習',             canEdit: false }
  ];

  var current = null;   // 未選択のあいだは null

  function all() { return PROFILES.slice(); }

  function find(id) {
    var hit = null;
    PROFILES.forEach(function (p) { if (p.id === id) hit = p; });
    return hit;
  }

  // 起動時に localStorage から復元する。IndexedDB に置かないのは、
  // 「どの部屋か」がDBを開くより前に決まっていないとキーを作れないため。
  function restore() {
    try {
      var id = localStorage.getItem(LS_KEY);
      if (find(id)) { current = id; return id; }
    } catch (e) { /* プライベートモード等 */ }
    return null;
  }

  function set(id) {
    if (!find(id)) throw new Error('不明なプロフィールです: ' + id);
    current = id;
    try { localStorage.setItem(LS_KEY, id); } catch (e) {}
    return id;
  }

  function get() { return current; }
  function isChosen() { return !!current; }

  function info() { return find(current) || PROFILES[0]; }
  function label() { return info().label; }

  // 編集系（台本の作成・編集・削除・配信用書き出し）を出してよいか
  function canEdit() { return !!(find(current) && find(current).canEdit); }

  function clear() {
    current = null;
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  }

  /* ---- 台本の振り分け（§5.9） ------------------------------------------
     一覧・検索・復習キューはすべてこの関数を通す。絞り込みのルールを
     1か所に集めておかないと、F2 の検索や F7 の復習キューで食い違う。
  --------------------------------------------------------------------- */
  function canSee(topic) {
    if (!topic) return false;
    var a = topic.audience || 'both';
    return a === 'both' || a === current;
  }

  function visible(topics) {
    return (topics || []).filter(canSee);
  }

  // 相手の部屋（2人固定なので、自分でないほう）
  function other() {
    var me = current;
    var hit = null;
    PROFILES.forEach(function (p) { if (p.id !== me) hit = p; });
    return hit || PROFILES[0];
  }

  // audience の値を、いま見ている人から見た日本語にする
  function audienceLabel(a) {
    if (a === 'both') return '両方';
    if (a === current) return '自分用';
    var o = find(a);
    return (o ? o.label : a) + '用';
  }

  EST.profile = {
    LS_KEY: LS_KEY,
    all: all,
    restore: restore,
    set: set,
    get: get,
    isChosen: isChosen,
    info: info,
    label: label,
    canEdit: canEdit,
    clear: clear,
    canSee: canSee,
    visible: visible,
    other: other,
    audienceLabel: audienceLabel
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 07-backup.js ---- */
/* =====================================================================
   07-backup.js — 全体バックアップと復元（SPEC §6.4 / §5.9）
   個人アプリはデータが飛ぶと二度と使われなくなるので、ここは必ず作る。
   音声キャッシュ（audio）は再生成できるのでバックアップに含めない。

   §5.9 の権限:
     タモやん … 全体（台本＋全員の進捗＋設定）
     まり     … 自分の進捗のみ（台本は含めない）
   ===================================================================== */
;(function (EST) {
  'use strict';

  var BACKUP_KIND = 'est-backup';
  var AUTO_KEEP = 3;   // §6.4 直近3世代

  // audio 以外のストア。topics だけは共有なので扱いを分ける。
  var PROGRESS_STORES = ['progress', 'wordProgress', 'topicProgress'];

  function keyPathOf(name) { return name === 'topicProgress' ? 'topicId' : 'key'; }

  function isFull() { return EST.profile.canEdit(); }

  /* ---- 書き出し -------------------------------------------------------- */
  function exportAll() {
    var full = isFull();
    var me = EST.profile.get();

    var jobs = PROGRESS_STORES.map(function (n) { return EST.store.getAll(n); });
    jobs.push(full ? EST.store.getAll('topics') : Promise.resolve(null));
    jobs.push(EST.store.loadSettings());
    jobs.push(full ? EST.store.loadShared() : Promise.resolve(null));

    return Promise.all(jobs).then(function (res) {
      var data = {
        kind: BACKUP_KIND,
        schemaVersion: EST.schema.SCHEMA_VERSION,
        exportedAt: Date.now(),
        profileId: me,
        scope: full ? 'full' : 'progress'   // 復元側が中身を判断できるように
      };

      PROGRESS_STORES.forEach(function (name, i) {
        var rows = res[i] || [];
        // まりのバックアップには自分の行だけ入れる（相手の進捗は持ち出さない）
        data[name] = full ? rows : rows.filter(function (r) {
          return EST.store.belongsToProfile(r[keyPathOf(name)], me);
        });
      });

      if (full) data.topics = res[PROGRESS_STORES.length] || [];

      var s = JSON.parse(JSON.stringify(res[PROGRESS_STORES.length + 1]));
      delete s.autoBackups;   // 自動バックアップを入れ子にすると際限なく膨らむ
      data.settings = s;

      if (full) data.shared = res[PROGRESS_STORES.length + 2];
      return data;
    });
  }

  function exportAllText() {
    return exportAll().then(function (d) { return JSON.stringify(d, null, 2); });
  }

  /* ---- 復元 ------------------------------------------------------------
     mode: 'overwrite'（消してから入れる） / 'merge'（同キーは updatedAt が新しい方）
  --------------------------------------------------------------------- */
  function importAll(data, mode) {
    if (!data || typeof data !== 'object') return Promise.reject(new Error('バックアップとして読めません'));

    var full = isFull();
    var me = EST.profile.get();
    var chain = Promise.resolve();

    // 台本を書き戻せるのは編集できる部屋だけ（§5.9）
    if (full && Array.isArray(data.topics)) {
      chain = chain.then(function () { return writeStore('topics', data.topics, mode); });
    }

    PROGRESS_STORES.forEach(function (name) {
      var rows = Array.isArray(data[name]) ? data[name] : [];
      if (!full) {
        // 自分の部屋の行だけを書き戻す。相手の進捗には触らない。
        rows = rows.filter(function (r) { return EST.store.belongsToProfile(r[keyPathOf(name)], me); });
      }
      chain = chain.then(function () { return writeStore(name, rows, mode, full ? null : me); });
    });

    if (data.settings) {
      chain = chain.then(function () {
        return EST.store.loadSettings().then(function (cur) {
          var next = JSON.parse(JSON.stringify(data.settings));
          next.autoBackups = cur.autoBackups || [];   // 自動バックアップは今の端末のものを残す
          return EST.store.saveSettings(next);
        });
      });
    }
    if (full && data.shared) {
      chain = chain.then(function () { return EST.store.saveShared(data.shared); });
    }
    return chain;
  }

  // onlyProfile を渡すと、上書きでもその部屋の行だけを消す
  function writeStore(name, rows, mode, onlyProfile) {
    var kp = name === 'topics' ? 'id' : keyPathOf(name);

    if (mode === 'overwrite') {
      if (!onlyProfile) {
        return EST.store.clear(name).then(function () { return EST.store.bulkPut(name, rows); });
      }
      return EST.store.getAll(name).then(function (cur) {
        var chain = Promise.resolve();
        cur.filter(function (r) { return EST.store.belongsToProfile(r[kp], onlyProfile); })
           .forEach(function (r) { chain = chain.then(function () { return EST.store.del(name, r[kp]); }); });
        return chain.then(function () { return EST.store.bulkPut(name, rows); });
      });
    }

    // マージ: 同じキーが両方にあるときは updatedAt が新しい方を採用する
    return EST.store.getAll(name).then(function (cur) {
      var byKey = {};
      cur.forEach(function (r) { byKey[r[kp]] = r; });
      var merged = rows.filter(function (r) {
        var old = byKey[r[kp]];
        return !old || (Number(r.updatedAt) || 0) >= (Number(old.updatedAt) || 0);
      });
      return EST.store.bulkPut(name, merged);
    });
  }

  /* ---- 自動バックアップ（トピック保存のたびに1世代） ------------------- */
  function snapshot(label) {
    return exportAllText().then(function (text) {
      return EST.store.loadSettings().then(function (s) {
        var list = Array.isArray(s.autoBackups) ? s.autoBackups.slice() : [];
        list.unshift({ at: Date.now(), label: label || '', size: text.length, json: text });
        s.autoBackups = list.slice(0, AUTO_KEEP);
        return EST.store.saveSettings(s);
      });
    }).catch(function (e) {
      // バックアップの失敗で保存そのものを止めない
      console.warn('[backup] 自動バックアップに失敗しました', e);
    });
  }

  function listAuto() {
    return EST.store.loadSettings().then(function (s) {
      return (s.autoBackups || []).map(function (b, i) {
        return { index: i, at: b.at, label: b.label, size: b.size };
      });
    });
  }

  function restoreAuto(index, mode) {
    return EST.store.loadSettings().then(function (s) {
      var b = (s.autoBackups || [])[index];
      if (!b) throw new Error('その世代のバックアップがありません');
      return importAll(JSON.parse(b.json), mode || 'overwrite');
    });
  }

  function wipeAll() {
    var chain = Promise.resolve();
    EST.store.STORES.forEach(function (name) {
      chain = chain.then(function () { return EST.store.clear(name); });
    });
    return chain;
  }

  // 自分の部屋の記録だけを消す。台本（共有）には触らない。
  function wipeProfile() {
    var me = EST.profile.get();
    var chain = Promise.resolve();
    PROGRESS_STORES.forEach(function (name) {
      chain = chain.then(function () {
        return EST.store.getAll(name).then(function (rows) {
          var sub = Promise.resolve();
          rows.filter(function (r) { return EST.store.belongsToProfile(r[keyPathOf(name)], me); })
              .forEach(function (r) {
                sub = sub.then(function () { return EST.store.del(name, r[keyPathOf(name)]); });
              });
          return sub;
        });
      });
    });
    return chain.then(function () { return EST.store.del('settings', EST.store.settingsKey(me)); });
  }

  EST.backup = {
    BACKUP_KIND: BACKUP_KIND,
    AUTO_KEEP: AUTO_KEEP,
    exportAll: exportAll,
    exportAllText: exportAllText,
    importAll: importAll,
    snapshot: snapshot,
    listAuto: listAuto,
    restoreAuto: restoreAuto,
    wipeAll: wipeAll,
    wipeProfile: wipeProfile
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 08-ui-kit.js ---- */
/* =====================================================================
   07-ui-kit.js — 画面を組み立てるための最小限の道具
   DOM を組み立てる h()、トースト、ダイアログ、ファイル入出力だけ。
   ここに画面固有のロジックは入れない。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var TOAST_MS = 2200;

  function append(el, children) {
    if (children === null || children === undefined || children === false) return;
    if (Array.isArray(children)) { children.forEach(function (c) { append(el, c); }); return; }
    if (children instanceof Node) { el.appendChild(children); return; }
    el.appendChild(document.createTextNode(String(children)));
  }

  // h('div', {class:'x', onClick:fn}, ['中身'])
  function h(tag, props, children) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class' || k === 'className') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.keys(v).forEach(function (s) { el.style[s] = v[s]; });
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'multiple') el[k] = !!v;
      else el.setAttribute(k, v);
    });
    append(el, children);
    return el;
  }

  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }

  function mount(node, children) { clear(node); append(node, children); return node; }

  function toast(msg) {
    var root = document.getElementById('toast-root');
    if (!root) return;
    var el = h('div', { class: 'toast', text: msg });
    root.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, TOAST_MS);
  }

  /* ---- ダイアログ -----------------------------------------------------
     buttons: [{label, value, kind:'primary'|'danger'|undefined}]
     戻り値は選ばれた value（背景クリックや Esc は null）
  --------------------------------------------------------------------- */
  function dialog(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var root = document.getElementById('modal-root');
      var back = h('div', { class: 'modal-back' });
      var done = false;

      function close(v) {
        if (done) return;
        done = true;
        document.removeEventListener('keydown', onKey);
        if (back.parentNode) back.parentNode.removeChild(back);
        resolve(v);
      }
      function onKey(e) { if (e.key === 'Escape') close(null); }

      var buttons = (opts.buttons || [{ label: 'OK', value: true, kind: 'primary' }]).map(function (b) {
        return h('button', {
          class: 'btn' + (b.kind === 'primary' ? ' btn--primary' : b.kind === 'danger' ? ' btn--danger' : ''),
          text: b.label,
          onClick: function () { close(b.value); }
        });
      });

      var modal = h('div', { class: 'modal' }, [
        opts.title ? h('h2', { class: 'modal__title', text: opts.title }) : null,
        h('div', { class: 'modal__body' }, opts.body || null),
        h('div', { class: 'modal__actions' }, buttons)
      ]);
      modal.addEventListener('click', function (e) { e.stopPropagation(); });
      back.addEventListener('click', function () { if (opts.dismissable !== false) close(null); });
      append(back, modal);
      root.appendChild(back);
      document.addEventListener('keydown', onKey);
      var first = modal.querySelector('input, textarea, select, button');
      if (first) try { first.focus(); } catch (e) {}
    });
  }

  function confirm(title, message, okLabel, kind) {
    return dialog({
      title: title,
      body: h('p', { text: message || '' }),
      buttons: [
        { label: 'やめる', value: false },
        { label: okLabel || 'OK', value: true, kind: kind || 'primary' }
      ]
    }).then(function (v) { return v === true; });
  }

  function alertBox(title, message) {
    var body = Array.isArray(message)
      ? h('ul', {}, message.map(function (m) { return h('li', { text: m }); }))
      : h('p', { text: message || '' });
    return dialog({ title: title, body: body, buttons: [{ label: '閉じる', value: true, kind: 'primary' }] });
  }

  // 3択以上を選ばせる（id重複時の「上書き/別として追加/中止」など）
  function choose(title, message, options) {
    return dialog({
      title: title,
      body: h('p', { text: message || '' }),
      buttons: options
    });
  }

  /* ---- ファイル -------------------------------------------------------- */
  function download(filename, text, mime) {
    var blob = new Blob([text], { type: (mime || 'application/json') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 500);
  }

  function pickFile(accept) {
    return new Promise(function (resolve) {
      var input = h('input', { type: 'file', accept: accept || '.json,application/json', class: 'hidden' });
      document.body.appendChild(input);
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        if (!f) { cleanup(); resolve(null); return; }
        var fr = new FileReader();
        fr.onload = function () { cleanup(); resolve({ name: f.name, text: String(fr.result || '') }); };
        fr.onerror = function () { cleanup(); resolve(null); };
        fr.readAsText(f, 'utf-8');
      });
      function cleanup() { if (input.parentNode) input.parentNode.removeChild(input); }
      input.click();
    });
  }

  /* ---- 表示用の小道具 --------------------------------------------------- */
  function fmtDate(ms) {
    if (!ms) return '—';
    var d = new Date(ms);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function fmtSeconds(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    if (sec < 60) return sec + '秒';
    return Math.floor(sec / 60) + '分' + ('0' + (sec % 60)).slice(-2) + '秒';
  }

  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  EST.ui = {
    h: h,
    clear: clear,
    mount: mount,
    append: append,
    toast: toast,
    dialog: dialog,
    confirm: confirm,
    alert: alertBox,
    choose: choose,
    download: download,
    pickFile: pickFile,
    fmtDate: fmtDate,
    fmtSeconds: fmtSeconds,
    fmtBytes: fmtBytes
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 09-publish.js ---- */
/* =====================================================================
   09-publish.js — 台本の配信と同期（SPEC §6.5）
   タモやんが作った台本を data/scripts.json に置き、
   2人の端末が起動時に取りに行って自動で反映する。

   取れなかったときは何もしない。前回取り込んだ台本が IndexedDB に残って
   いるので練習は続けられる（オフラインでも file:// でも止まらない）。
   ===================================================================== */
;(function (EST) {
  'use strict';

  /* ---- 調整用の定数 ---------------------------------------------------- */
  var FEED_PATH   = 'data/scripts.json';
  var FETCH_MS    = 8000;   // これを超えたら諦める（起動を待たせない）

  // 直近の同期結果。ホームが一度だけ知らせに使う。
  var lastResult = null;

  /* ---- 取得 ------------------------------------------------------------ */
  function fetchFeed() {
    if (typeof fetch !== 'function') return Promise.resolve(null);

    // ?t= を付けるのは GitHub Pages のキャッシュを避けるため（§6.5）
    var url = FEED_PATH + '?t=' + Date.now();
    var opts = { cache: 'no-store' };
    var timer = null;

    if (typeof AbortController === 'function') {
      var ctrl = new AbortController();
      opts.signal = ctrl.signal;
      timer = setTimeout(function () { ctrl.abort(); }, FETCH_MS);
    }

    return fetch(url, opts)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (json) { return json; })
      .catch(function (e) {
        // 失敗はユーザーに見せない。file:// や圏外では当たり前に起きるため。
        console.info('[publish] 配信を取得できませんでした（前回の台本のまま動きます）:',
                     (e && e.message) || e);
        return null;
      })
      .then(function (v) { if (timer) clearTimeout(timer); return v; });
  }

  /* ---- 同期 ------------------------------------------------------------
     戻り値: null（更新なし）または {added, updated, removed, publishedAt}
  --------------------------------------------------------------------- */
  function sync() {
    return fetchFeed().then(function (feed) {
      if (!feed || !Array.isArray(feed.topics)) return null;
      var publishedAt = Number(feed.publishedAt) || 0;

      return EST.store.loadShared().then(function (shared) {
        // publishedAt が進んでいなければ何もしない
        if (publishedAt && publishedAt <= (Number(shared.publishedAt) || 0)) return null;
        return apply(feed, shared, publishedAt);
      });
    }).then(function (r) {
      lastResult = r;
      return r;
    }).catch(function (e) {
      console.warn('[publish] 同期に失敗しました', e);
      return null;
    });
  }

  function apply(feed, shared, publishedAt) {
    // §6.3: 配信JSONは外部データなので、audience 未指定は "both" で救済する。
    // ここで止めてしまうと、値の抜けた1件のせいで配信全体が反映されなくなる。
    var incoming = feed.topics
      .map(function (t) { return EST.schema.normalizeTopic(t, { rescueAudience: true }); })
      .filter(function (t) { return t.lines.length > 0; });

    return EST.store.getAll('topics').then(function (cur) {
      var curIds = {};
      cur.forEach(function (t) { curIds[t.id] = true; });

      var incomingIds = {};
      incoming.forEach(function (t) { incomingIds[t.id] = true; });

      // 件数は自分の部屋に見えるものだけ数える。相手用の台本が増えたことを
      // 知らされても、こちらの行動は何も変わらないため（§5.9）。
      var added = 0, updated = 0;
      incoming.forEach(function (t) {
        if (!EST.profile.canSee(t)) return;
        if (curIds[t.id]) updated++; else added++;
      });

      // 配信から消えたトピックは一覧からも消す（§6.5）。ただし
      // 手元で作っただけでまだ配信していない台本を巻き込まないよう、
      // 前回の配信に入っていたものだけを対象にする。
      var wasFed = Array.isArray(shared.feedTopicIds) ? shared.feedTopicIds : [];
      var removeIds = wasFed.filter(function (id) { return !incomingIds[id] && curIds[id]; });

      // 削除の件数も、自分の部屋に見えていたものだけを数える
      var curById = {};
      cur.forEach(function (t) { curById[t.id] = t; });
      var removedVisible = removeIds.filter(function (id) { return EST.profile.canSee(curById[id]); }).length;

      var chain = EST.store.bulkPut('topics', incoming);
      removeIds.forEach(function (id) {
        // 進捗レコードは消さない。再配信で復活したときに引き継げるようにする（§6.5）
        chain = chain.then(function () { return EST.store.del('topics', id); });
      });

      return chain.then(function () {
        // publishedAt が 0（未公開）のときは同期済み時刻を進めない。
        // ここで Date.now() に繰り上げると、後から来る小さめの publishedAt を
        // 「古い」と誤判定して無視してしまう（sync() の比較が壊れる）。
        if (publishedAt) shared.publishedAt = publishedAt;
        shared.feedTopicIds = Object.keys(incomingIds);
        return EST.store.saveShared(shared);
      }).then(function () {
        return { added: added, updated: updated, removed: removedVisible, publishedAt: publishedAt };
      });
    });
  }

  /* ---- 書き出し（タモやんのみ。§6.5 の更新手順2） ----------------------- */
  function buildFeed() {
    return EST.store.getAll('topics').then(function (topics) {
      topics.sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      return { publishedAt: Date.now(), topics: topics };
    });
  }

  function exportFeedFile() {
    return buildFeed().then(function (feed) {
      EST.ui.download('scripts.json', JSON.stringify(feed, null, 2));
      return feed;
    });
  }

  /* ---- ホームへの通知 ---------------------------------------------------- */
  function takeResult() {
    var r = lastResult;
    lastResult = null;     // 一度だけ出す（毎回出ると邪魔になる）
    return r;
  }

  EST.publish = {
    FEED_PATH: FEED_PATH,
    fetchFeed: fetchFeed,
    sync: sync,
    buildFeed: buildFeed,
    exportFeedFile: exportFeedFile,
    takeResult: takeResult
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 10-ui-home.js ---- */
/* =====================================================================
   10-ui-home.js — ホームとトピック一覧・トピック詳細（SPEC §8）
   F1 の時点では練習・検索・語彙の中身がまだ無いので、
   該当する導線は枠だけ置いて押せない状態にしてある。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var h = null;   // 起動時に EST.ui.h を受け取る（読み込み順に依存しないため）

  function ui() { h = EST.ui.h; return EST.ui; }

  /* ---- ホーム ---------------------------------------------------------- */
  function renderHome(view) {
    var U = ui();
    EST.app.setBar('英会話台本トレーナー', [
      h('span', { class: 'chip', text: EST.profile.label() }),
      h('button', { class: 'btn btn--sm', text: '設定', onClick: function () { location.hash = '#/settings'; } })
    ]);

    var wrap = h('div', {});

    // §6.5 台本が更新されたことを一度だけ知らせる
    var fed = EST.publish.takeResult();
    if (fed && (fed.added || fed.updated || fed.removed)) {
      var parts = [];
      if (fed.added) parts.push('追加' + fed.added + '件');
      if (fed.updated) parts.push('更新' + fed.updated + '件');
      if (fed.removed) parts.push('削除' + fed.removed + '件');
      U.append(wrap, h('div', { class: 'note-box note-box--warn', style: { marginBottom: '.7rem' },
        text: '台本を更新しました（' + parts.join(' / ') + '）' }));
    }

    // まだ使えない導線。押せてしまうと壊れているように見えるので disabled にする。
    function pending(icon, label, phase) {
      return h('button', { class: 'home-item', disabled: true }, [
        h('span', { class: 'home-item__icon', text: icon }),
        h('span', { class: 'home-item__body' }, [
          h('div', { text: label }),
          h('div', { class: 'home-item__sub', text: 'まだ使えません（' + phase + 'で追加）' })
        ])
      ]);
    }

    U.append(wrap, [
      h('button', { class: 'home-item', onClick: function () { location.hash = '#/search'; } }, [
        h('span', { class: 'home-item__icon', text: '🔍' }),
        h('span', { class: 'home-item__body' }, [
          h('div', { text: '検索（全トピック横断）' }),
          h('div', { class: 'home-item__sub', text: '日本語でも英語でも引けます' })
        ])
      ]),
      pending('📅', '今日の練習', 'F5'),
      pending('🔁', '再確認', 'F7'),
      pending('📇', '語彙をまわす', 'F6')
    ]);

    U.append(wrap, h('div', { class: 'section-title', text: 'トピック' }));

    var chipBox = h('div', { class: 'row row--tight', style: { marginBottom: '.45rem' } });
    var listBox = h('div', {});
    U.append(wrap, [chipBox, listBox]);

    // §5.9 まりの部屋では編集系の導線をグレーアウトではなく「出さない」
    if (EST.profile.canEdit()) {
      U.append(wrap, [
        h('button', {
          class: 'btn btn--primary btn--block', text: '＋ 新規トピック',
          onClick: function () { location.hash = '#/import'; }
        })
      ]);
    }

    U.mount(view, wrap);

    EST.store.getAll('topics').then(function (topics) {
      topics.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
      drawList(chipBox, listBox, topics);
    }).catch(function (e) {
      U.mount(listBox, h('div', { class: 'note-box note-box--err', text: '読み込みに失敗しました: ' + e.message }));
    });
  }

  /* ---- 一覧の絞り込み（§5.9） ------------------------------------------
     一覧は自分の部屋の台本だけにする。ただしタモやんは相手用の台本も作るので、
     保存した瞬間に一覧から消えて編集できなくなると困る。逃げ道としてチップを出す。
  --------------------------------------------------------------------- */
  var homeFilter = 'mine';   // 'mine' | 'other' | 'all'

  function drawList(chipBox, listBox, topics) {
    var U = ui();
    var mine = topics.filter(function (t) { return EST.profile.canSee(t); });
    var others = topics.filter(function (t) { return !EST.profile.canSee(t); });

    // 相手用の台本が1件も無いうちはチップ自体を出さない。
    // ホームは練習に入るための画面なので、管理UIを常設しない（§8）。
    var showChips = EST.profile.canEdit() && others.length > 0;
    if (!showChips) homeFilter = 'mine';

    if (!showChips) {
      U.mount(chipBox, []);
    } else {
      var otherLabel = EST.profile.other().label + '用';
      U.mount(chipBox, [
        chip('自分用', 'mine', mine.length, chipBox, listBox, topics),
        chip(otherLabel, 'other', others.length, chipBox, listBox, topics),
        chip('両方', 'all', topics.length, chipBox, listBox, topics)
      ]);
    }

    var shown = homeFilter === 'mine' ? mine : (homeFilter === 'other' ? others : topics);

    if (!shown.length) {
      U.mount(listBox, h('div', { class: 'empty', text: emptyText(topics.length) }));
      return;
    }
    U.mount(listBox, shown.map(topicCard));
  }

  function chip(label, value, count, chipBox, listBox, topics) {
    return h('button', {
      class: 'btn btn--sm' + (homeFilter === value ? ' btn--primary' : ''),
      text: label + ' ' + count,
      onClick: function () {
        homeFilter = value;
        drawList(chipBox, listBox, topics);
      }
    });
  }

  function emptyText(total) {
    if (homeFilter === 'other') return '相手用の台本はありません。';
    if (total) return 'この部屋の台本はまだありません。';
    return EST.profile.canEdit()
      ? 'まだトピックがありません。「＋ 新規トピック」から台本を入れてください。'
      : 'まだ台本が届いていません。しばらくしてから開き直してください。';
  }

  function topicCard(t) {
    var U = ui();
    var sec = EST.schema.lapSeconds(t.lines);
    var meta = [
      t.lines.length + '行',
      (t.blocks && t.blocks.length ? t.blocks.length + 'ブロック' : 'ブロックなし'),
      '語彙' + (t.words ? t.words.length : 0) + '個',
      '1周 約' + U.fmtSeconds(sec)
    ].join(' ・ ');

    // §5.9 自分の部屋に属さない台本をタップしたら、練習ではなく編集を開く。
    // 練習画面に入ると相手用の台本に自分の進捗レコードが付いてしまうため。
    var mine = EST.profile.canSee(t);
    var to = mine ? ('#/topic/' + encodeURIComponent(t.id)) : ('#/edit/' + encodeURIComponent(t.id));

    return h('button', {
      class: 'topic-card',
      onClick: function () { location.hash = to; }
    }, [
      h('div', { class: 'topic-card__title' }, [
        t.title || '(無題)',
        // 誰の台本かは、両方を扱うタモやんの部屋でだけ出す
        EST.profile.canEdit()
          ? h('span', { class: 'chip', style: { marginLeft: '.4rem' }, text: EST.profile.audienceLabel(t.audience) })
          : null
      ]),
      t.titleEn ? h('div', { class: 'topic-card__meta en', text: t.titleEn }) : null,
      h('div', { class: 'topic-card__meta', text: meta }),
      h('div', { class: 'topic-card__meta', text: mine
        ? ('更新 ' + U.fmtDate(t.updatedAt))
        : ('更新 ' + U.fmtDate(t.updatedAt) + ' ・ タップで編集') })
    ]);
  }

  /* ---- トピック詳細 ----------------------------------------------------- */
  function renderTopic(view, id) {
    var U = ui();
    EST.store.get('topics', id).then(function (t) {
      if (!t) {
        EST.app.setBar('トピック', []);
        U.mount(view, h('div', { class: 'empty', text: 'このトピックは見つかりませんでした。' }));
        return;
      }
      // §5.9 自分の部屋の台本でなければ練習画面には入らせない。
      // 編集できる部屋なら編集へ、そうでなければホームへ戻す。
      if (!EST.profile.canSee(t)) {
        location.hash = EST.profile.canEdit() ? ('#/edit/' + encodeURIComponent(t.id)) : '#/';
        return;
      }
      EST.app.setBar(t.title || '(無題)', EST.profile.canEdit() ? [
        h('button', { class: 'btn btn--sm', text: '編集', onClick: function () { location.hash = '#/edit/' + encodeURIComponent(t.id); } })
      ] : []);
      U.mount(view, buildTopicDetail(t, view));
    });
  }

  // §5.9「audienceは後から変えられるようにする」。編集画面を開き直さず、
  // タモやんの部屋にだけこの場で切り替えられるようにする。
  function switchAudience(t, next, view) {
    if (next === t.audience) return;
    var U = ui();
    var updated = JSON.parse(JSON.stringify(t));
    updated.audience = next;
    updated.updatedAt = Date.now();

    EST.store.put('topics', updated)
      .then(function () { return EST.backup.snapshot('audience変更: ' + (updated.title || '')); })
      .then(function () {
        var me = EST.profile.get();
        var msg;
        if (next === 'both') msg = '両方にしました。';
        else if (next === me) msg = '自分用にしました。';
        else msg = EST.profile.audienceLabel(next) + 'にしました。自分の一覧には出ません。';
        U.toast(msg);

        // 変更した瞬間に自分の部屋から見えなくなることがある（§5.9）。
        // 見えなくなった詳細画面に留まっても仕方がないのでホームへ戻す。
        if (EST.profile.canSee(updated)) renderTopic(view, updated.id);
        else location.hash = '#/';
      });
  }

  function audienceSwitchRow(t, view) {
    var me = EST.profile.get();
    var other = EST.profile.other().id;
    return h('div', { class: 'row row--tight', style: { marginTop: '.5rem' } }, [
      h('span', { class: 'tiny muted', text: '誰の台本か' }),
      [me, other, 'both'].map(function (a) {
        return h('button', {
          class: 'btn btn--sm' + (t.audience === a ? ' btn--primary' : ''),
          text: EST.profile.audienceLabel(a),
          onClick: function () { switchAudience(t, a, view); }
        });
      })
    ]);
  }

  function buildTopicDetail(t, view) {
    var U = ui();
    var sec = EST.schema.lapSeconds(t.lines);
    var myLabel = '';
    (t.speakers || []).forEach(function (s) { if (s.id === t.myRole) myLabel = s.label; });

    var head = h('div', { class: 'card' }, [
      t.titleEn ? h('div', { class: 'en', text: t.titleEn }) : null,
      h('div', { class: 'small muted' }, [
        [t.level, (t.tags || []).join(' / ')].filter(Boolean).join(' ・ ')
      ]),
      h('div', { class: 'stat-bar', style: { position: 'static', marginTop: '.5rem', marginBottom: '0' } }, [
        h('span', {}, ['1周 約', h('b', { text: U.fmtSeconds(sec) })]),
        h('span', {}, [h('b', { text: String(t.lines.length) }), '行']),
        h('span', {}, [h('b', { text: String((t.blocks || []).length || 1) }), 'ブロック']),
        h('span', {}, ['語彙 ', h('b', { text: String((t.words || []).length) }), '個']),
        h('span', {}, ['自分の役 ', h('b', { text: myLabel || '未設定' })])
      ]),
      // §5.9 audienceは後から変えられる。タモやんの部屋にのみ表示する。
      EST.profile.canEdit() ? audienceSwitchRow(t, view) : null
    ]);

    // §5.9 まりの部屋には書き出し・削除を出さない
    var canEdit = EST.profile.canEdit();
    var actions = h('div', { class: 'card' }, [
      h('div', { class: 'row row--tight' }, [
        h('button', { class: 'btn btn--primary', text: '続きから', disabled: true }),
        h('button', {
          class: 'btn', text: '一覧を見る',
          onClick: function () { location.hash = '#/list/' + encodeURIComponent(t.id); }
        }),
        canEdit ? h('button', {
          class: 'btn', text: 'JSON書き出し',
          onClick: function () { exportTopic(t); }
        }) : null,
