          if (r.durationMs >= minAcceptMs || minAcceptMs <= 0) return r;
          if (triesLeft > 0) {
            console.warn('[speech] 発話が短すぎます（' + Math.round(r.durationMs) + 'ms / 想定' +
                         Math.round(expectMs) + 'ms）。鳴らし直します。');
            return attempt(triesLeft - 1);
          }
          console.warn('[speech] 鳴らし直しても短いままでした。鳴らなかったものとして扱います。');
          return { durationMs: r.durationMs, rate: r.rate, voiceId: r.voiceId,
                   pitch: r.pitch, spoken: false, tooShort: true };
        });
      }
      return attempt(SHORT_END_RETRY);
    },

    _speakOnce: function (text, opts) {
      return loadVoices().then(function () {
        // §7.2 cancel() の直後に speak() を呼ばない。取り消しの処理が終わる前に
        // 次を投げると、その発話が握り潰されて end だけが即座に返り、
        // 行送りが暴走する。cancel してから間を置く。
        return settleAfterCancel();
      }).then(function () {
        return new Promise(function (resolve) {
          var rate = clampRate(opts.rate != null ? opts.rate : currentRate);
          var pick = resolveVoice(opts);
          var u = new SpeechSynthesisUtterance(text);
          if (pick.voice) { u.voice = pick.voice; u.lang = pick.voice.lang || 'en-US'; }
          else { u.lang = 'en-US'; }
          u.rate = rate;
          u.pitch = pick.pitch;
          u.volume = opts.volume == null ? 1 : opts.volume;

          var t0 = 0, done = false, keepTimer = null, failTimer = null;

          function finish(ok) {
            if (done) return;
            done = true;
            if (keepTimer) clearInterval(keepTimer);
            if (failTimer) clearTimeout(failTimer);
            if (current && current.finish === finish) current = null;
            var ms = t0 ? (Date.now() - t0) : 0;
            // §2.3 実測長は測ったときの rate と一緒に保存する。
            // あとで速度を変えたら 実測Ms × 測定時のrate ÷ 新しいrate で補正できる。
            if (ok && ms > 0 && opts.topicId && opts.lineId) {
              saveDuration(opts.topicId, opts.lineId, ms, rate, pick.id);
            }
            resolve({ durationMs: ms, rate: rate, voiceId: pick.id, pitch: pick.pitch, spoken: !!ok });
          }

          u.onstart = function () {
            t0 = Date.now();
            // §7.2 Chromeは15秒以上の連続発話で止まる。10秒ごとに pause→resume で突く。
            keepTimer = setInterval(function () {
              try {
                if (syn() && syn().speaking) { syn().pause(); syn().resume(); }
              } catch (e) { /* 対応していない端末は放っておく */ }
            }, KEEPALIVE_MS);
          };
          u.onend = function () { finish(true); };
          u.onerror = function () { finish(false); };

          // §7.2 end が来ない端末があるので、想定所要の2倍で打ち切る
          var expect = estimateMs(text, rate);
          failTimer = setTimeout(function () {
            try { syn().cancel(); } catch (e) {}
            finish(t0 > 0);
          }, Math.max(TIMEOUT_MIN_MS, expect * TIMEOUT_FACTOR));

          current = { finish: finish };
          try { syn().speak(u); } catch (e) { finish(false); }
        });
      });
    }
  };

  /* §7.2 cancel() のあと、エンジンが落ち着くのを待ってから speak する。
     iOS Safari は取り消し処理中に speak を受けると発話を握り潰し、
     end だけを即座に返す。speaking が false になるのを待ち、
     それでも下がらなければ上限で諦めて最低限の間隔だけ空ける。 */
  function settleAfterCancel() {
    stopCurrent();
    return new Promise(function (resolve) {
      var startedAt = Date.now();
      (function poll() {
        var quiet = false;
        try { quiet = !(syn() && (syn().speaking || syn().pending)); } catch (e) { quiet = true; }
        var waited = Date.now() - startedAt;
        // 静かになっても、最低 CANCEL_SETTLE_MS は空ける
        if (quiet && waited >= CANCEL_SETTLE_MS) { resolve(); return; }
        if (waited >= CANCEL_WAIT_MAX_MS) { resolve(); return; }
        setTimeout(poll, 40);
      })();
    });
  }

  var engines = { local: localEngine };

  // §7.1 いまのエンジンを返す。未実装のエンジンが指定されていたら黙って内蔵に落とす。
  function engine() {
    return engines[currentEngine] || engines.local;
  }

  /* =====================================================================
     ボイスの読み込みと選択（§7.2）
     ===================================================================== */
  function loadVoices() {
    if (voicesCache && voicesCache.length) return Promise.resolve(voicesCache);
    if (voicesPromise) return voicesPromise;

    voicesPromise = new Promise(function (resolve) {
      if (!localEngine.isAvailable()) { voicesCache = []; resolve([]); return; }

      var tries = 0;
      function attempt() {
        var list = [];
        try { list = syn().getVoices() || []; } catch (e) { list = []; }
        if (list.length) { setVoices(list); resolve(voicesCache); return; }
        // §7.2 getVoices() は初回空配列。200msのリトライを3回。
        if (tries++ >= VOICE_RETRY_MAX) { voicesCache = []; resolve([]); return; }
        setTimeout(attempt, VOICE_RETRY_MS);
      }

      // voiceschanged が遅れて来る端末があるので、来たら取り込み直す
      try {
        syn().addEventListener('voiceschanged', function () {
          var list = [];
          try { list = syn().getVoices() || []; } catch (e) { list = []; }
          if (list.length) setVoices(list);
        });
      } catch (e) {}

      attempt();
    });
    return voicesPromise;
  }

  function setVoices(list) {
    voicesCache = list;
    assignByGender();
  }

  function isEnglish(v) { return /^en(-|_|$)/i.test(v.lang || ''); }

  // §7.2 の優先語を含むものを先に持ってくる
  function englishVoices() {
    var list = (voicesCache || []).filter(isEnglish);
    return list.slice().sort(function (a, b) {
      return prefScore(b) - prefScore(a);
    });
  }

  function prefScore(v) {
    var n = (v.name || '').toLowerCase();
    for (var i = 0; i < PREFERRED.length; i++) {
      if (n.indexOf(PREFERRED[i]) >= 0) return PREFERRED.length - i;
    }
    return 0;
  }

  function voiceId(v) { return v ? (v.voiceURI || v.name) : null; }

  function byId(id) {
    if (!id) return null;
    var hit = null;
    (voicesCache || []).forEach(function (v) { if (!hit && voiceId(v) === id) hit = v; });
    return hit;
  }

  // 名前・voiceURI から男女を推定する。分からなければ ''。
  function guessGender(v) {
    if (!v) return '';
    var s = ((v.name || '') + ' ' + (v.voiceURI || '')).toLowerCase();
    // "female" は "male" を含むので先に見る
    if (s.indexOf('female') >= 0) return 'female';
    if (s.indexOf('male') >= 0) return 'male';
    var i;
    for (i = 0; i < FEMALE_HINTS.length; i++) if (s.indexOf(FEMALE_HINTS[i]) >= 0) return 'female';
    for (i = 0; i < MALE_HINTS.length; i++) if (s.indexOf(MALE_HINTS[i]) >= 0) return 'male';
    return '';
  }

  // §7.2 手順1〜2: 優先順に並べ、gender ごとに1つずつ確保する
  function assignByGender() {
    var list = englishVoices();
    auto = { female: null, male: null, any: list[0] || null };
    list.forEach(function (v) {
      var g = guessGender(v);
      if (g === 'female' && !auto.female) auto.female = v;
      if (g === 'male' && !auto.male) auto.male = v;
    });
  }

  /* 話者に割り当てるボイスとpitchを決める（§7.2）。
     取れなかったときは静かに劣化させ、機能は止めない。 */
  function resolveVoice(opts) {
    opts = opts || {};
    var gender = (opts.gender === 'female' || opts.gender === 'male') ? opts.gender : '';
    var base = byId(manual.def) || auto.any;

    // 呼び出し側が明示したボイスが最優先（設定画面の試聴など）
    if (opts.voiceId) {
      var forced = byId(opts.voiceId);
      if (forced) return { voice: forced, pitch: clampPitch(opts.pitch == null ? 1 : opts.pitch), id: voiceId(forced) };
    }
    // 設定画面で手動指定されていればそれに従う
    if (gender && manual[gender]) {
      var mv = byId(manual[gender]);
      if (mv) return { voice: mv, pitch: 1, id: voiceId(mv) };
    }
    // 性別が分からない話者は既定ボイスのまま
    if (!gender) return { voice: base, pitch: 1, id: voiceId(base) };

    // 手順2: 男女とも確保できている
    if (auto.female && auto.male) {
      var av = auto[gender];
      return { voice: av, pitch: 1, id: voiceId(av) };
    }
    // 手順3: 片方しか取れない → 同じボイスで pitch を ±0.15 ずらして区別する。
    // 英語ボイスが1つも無い端末（voiceは未指定でブラウザ任せ）でも pitch は効くので、
    // ここで諦めずにずらす。手順4の「同じ声で通す」は、
    // 必要な性別のボイスがちょうど取れているときだけ。
    var have = auto.female ? 'female' : (auto.male ? 'male' : '');
    var only = auto.female || auto.male || base;   // null でも構わない
    if (have === gender && only) {
      return { voice: only, pitch: 1, id: voiceId(only) };
    }
    var pitch = 1 + (gender === 'female' ? PITCH_SHIFT : -PITCH_SHIFT);
    return { voice: only, pitch: clampPitch(pitch), id: voiceId(only), degraded: true };
  }

  /* =====================================================================
     実測長の保存（§2.3）
     ===================================================================== */
  function durKey(topicId, lineId) { return DUR_PREFIX + topicId + '|' + lineId; }

  function saveDuration(topicId, lineId, ms, rate, vid) {
    return EST.store.put('audio', {
      key: durKey(topicId, lineId),
      kind: 'duration',
      topicId: topicId,
      lineId: lineId,
      ms: ms,
      rate: rate,          // 測ったときの速度。F4・F5 がこれで補正する
      voiceId: vid,
      at: Date.now()
    }).catch(function (e) {
      // 測れなくても再生自体は成立しているので、黙って諦める
      console.warn('[speech] 実測長を保存できませんでした', e);
    });
  }

  function getDuration(topicId, lineId) {
    return EST.store.get('audio', durKey(topicId, lineId)).then(function (r) {
      return (r && r.kind === 'duration') ? r : null;
    }).catch(function () { return null; });
  }

  // 語数からの概算（§2.3 の代用式）。タイムアウト計算にも使う。
  function estimateMs(text, rate) {
    var words = String(text || '').trim().split(/\s+/).filter(Boolean).length;
    return words * WORD_MS / clampRate(rate || currentRate);
  }

  // §2.3（v3.0）カウント判定に使う expectedMs。実測があれば内蔵TTSでもそれを使う。
  // 実測は測定時のrateと一緒に保存してあるので、いまのrateとの比で補正する。
  // F3では返すところまでだった実測値を、F4（カウント判定）で初めて消費する。
  function expectedMsFor(topicId, lineId, text, rate) {
    var r = clampRate(rate || currentRate);
    return getDuration(topicId, lineId).then(function (rec) {
      if (rec && rec.ms > 0 && rec.rate > 0) return rec.ms * rec.rate / r;
      return estimateMs(text, r);
    });
  }

  /* =====================================================================
     公開インターフェース（§7.1）
     ===================================================================== */
  function isAvailable() { return engine().isAvailable(); }

  function prepare(text, opts) { return engine().prepare(text, opts || {}); }

  function speak(text, opts) {
    opts = opts || {};
    var t = String(text == null ? '' : text).trim();
    if (!t || !isAvailable()) return Promise.resolve({ durationMs: 0, spoken: false });
    return engine().speak(t, opts);
  }

  function stopCurrent() {
    var c = current;
    current = null;
    if (c && c.finish) c.finish(false);
    try { if (syn()) syn().cancel(); } catch (e) {}
  }

  function cancel() { stopCurrent(); }

  function isSpeaking() {
    try { return !!(syn() && (syn().speaking || syn().pending)); } catch (e) { return false; }
  }

  function setRate(r) { currentRate = clampRate(r); }
  function getRate() { return currentRate; }

  // UIが SpeechSynthesisVoice を直接触らないように整えて返す
  function getVoices() {
    return loadVoices().then(function () {
      return englishVoices().map(function (v) {
        return { id: voiceId(v), name: v.name, lang: v.lang, gender: guessGender(v) };
      });
    });
  }

  // 設定を反映する。起動時と設定変更時に呼ぶ。
  function applySettings(s) {
    if (!s) return;
    currentEngine = engines[s.engine] ? s.engine : 'local';
    if (s.ttsRate != null) currentRate = clampRate(s.ttsRate);
    manual.def = s.localVoiceEn || null;
    var g = s.localVoiceByGender || {};
    manual.female = g.female || null;
    manual.male = g.male || null;
  }

  // §7.2 iOS Safari は最初の発話をユーザージェスチャの同期処理内で行う必要がある。
  // 起動後の最初のタップで無音のUtteranceを鳴らして解錠する。
  function unlock() {
    if (unlocked || !isAvailable()) return;
    unlocked = true;
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      syn().speak(u);
    } catch (e) { /* 解錠できなくても以降の再生は試みる */ }
  }

  function clampRate(r) {
    r = Number(r);
    if (!isFinite(r) || r <= 0) return DEFAULT_RATE;
    return Math.min(RATE_MAX, Math.max(RATE_MIN, r));
  }
  function clampPitch(p) {
    p = Number(p);
    if (!isFinite(p)) return 1;
    return Math.min(PITCH_MAX, Math.max(PITCH_MIN, p));
  }

  EST.speech = {
    RATE_STEPS: RATE_STEPS,
    // §7.1 のインターフェース
    prepare: prepare,
    speak: speak,
    cancel: cancel,
    setRate: setRate,
    isAvailable: isAvailable,
    getVoices: getVoices,
    // 補助
    getRate: getRate,
    isSpeaking: isSpeaking,
    applySettings: applySettings,
    unlock: unlock,
    getDuration: getDuration,
    estimateMs: estimateMs,
    expectedMsFor: expectedMsFor,
    resolveVoiceFor: function (gender) { return resolveVoice({ gender: gender }); }
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 03-mic.js ---- */
/* =====================================================================
   03-mic.js — 音量検知エンジン（SPEC §2.1〜§2.8 / §1.8 / §10.3）

   §2.8 UIから完全に独立させる。イベントを発火するだけのモジュールにし、
   UIはそれを購読する。コンソールから単体で動かせる形にする。

     EST.mic.start() / stop()
     EST.mic.calibrate()          // → Promise<{noiseFloor, onsetThreshold}>
     EST.mic.gate(open)           // TTS再生中は閉じる（§2.6）
     EST.mic.markCue()            // レイテンシの t0 を打つ（§2.4）
     EST.mic.cancelLast()         // 「今のはナシ」（§2.4）
     EST.mic.on(event, cb)        // onset / offset / level / rep / stall / timeout

   §2.8 カウント成否の判定（§2.3）はここでは行わない。何回と数えるかは
   ステージ側（F5）の仕事で、EST.mic は起きた事実だけを報告する。
   expectedMs を知っているのはステージ層なので、この線引きを崩すと
   マイクモジュールが台本を知らないと試験できなくなる。
   ===================================================================== */
;(function (EST) {
  'use strict';

  /* ---- 調整用の定数（実機で必ず調整する。SPEC §12） ------------------ */
  var FFT_SIZE            = 2048;   // §2.1
  var SMOOTHING           = 0.3;    // §2.1
  var CALIBRATE_MS        = 1500;   // §2.1 較正にかける時間
  var ONSET_MULTIPLIER    = 3.5;    // §2.1 onsetThreshold = noiseFloor * これ
  var ONSET_FLOOR         = 0.008;  // §2.1 onsetThresholdの下限
  var OFFSET_RATIO        = 0.7;    // §2.1 offsetThreshold = onsetThreshold * これ
  var NOISE_FLOOR_MAX     = 0.05;   // §2.1 これを超えたら較正値として採用しない
  var LOOP_MS             = 20;     // §2.2 解析間隔
  var ONSET_FRAMES        = 3;      // §2.2 onset確定に必要な連続フレーム数
  var OFFSET_FRAMES       = 15;     // §2.2 offset確定に必要な連続フレーム数（=300ms）
  var STALL_MS            = 1500;   // §2.5 詰まりとみなす無音の長さ
  // §2.2 offset から この時間 新しい onset が来なければ「1回」を確定する。
  // STALL_MS と近すぎると詰まった瞬間に回が切れ、離れすぎると次の回の
  // 先頭を前の回に飲み込む。実機で必ず調整する。
  var REP_GAP_MS          = 2500;
  // §2.4 キュー表示から この時間 一度も発話が無ければ「発話なし」で閉じる。
  // 無限に待つと画面が固まったように見える。
  var NO_ONSET_TIMEOUT_MS = 10000;
  var LEVEL_EMIT_MS       = 66;     // §10.3 音量バーの描画間引き（解析20ms・描画66ms）
  // 未較正のまま start() された場合の保守的な既定値。すぐ試せることを優先し、
  // 較正を必須にはしない（コンソールから即試せるようにするため）。
  var UNCALIBRATED_ONSET  = 0.025;

  /* ---- 状態 -------------------------------------------------------------- */
  var audioCtx = null, stream = null, source = null, analyser = null, buf = null;
  var listening = false;     // start()〜stop() の間か
  var gateOpen = true;       // §2.6 TTS再生中などにカウント窓を閉じる
  var loopTimer = null;
  var visHandlerInstalled = false;

  var onsetThreshold = UNCALIBRATED_ONSET;
  var offsetThreshold = UNCALIBRATED_ONSET * OFFSET_RATIO;
  var calibrated = false;

  var voiced = false;        // 現在「発話中」state か（§2.2）
  var onsetStreak = 0, offsetStreak = 0;
  var segmentOnsetAt = 0;
  var lastAboveOffsetAt = 0; // 直近で声が確認できていた時刻（offset確定待ち300msを含めないため）

  var lastLevelEmit = 0;

  /* 進行中の「1回」（§2.2）。markCue() が無くても onset で自動的に開くので、
     コンソールから start() して喋るだけで rep が出る（§2.8）。 */
  var rep = null;            // { cueAt, firstOnsetAt, spokenMs, segments, stalls, lastOffsetAt, stallPending }
  var lastRep = null;        // §2.4 cancelLast() 用

  var listeners = { onset: [], offset: [], level: [], rep: [], stall: [], timeout: [] };

  function on(ev, fn) { if (listeners[ev]) listeners[ev].push(fn); return fn; }
  function off(ev, fn) {
    if (!listeners[ev]) return;
    var i = listeners[ev].indexOf(fn);
    if (i >= 0) listeners[ev].splice(i, 1);
  }
  function emit(ev, payload) {
    (listeners[ev] || []).slice().forEach(function (fn) {
      try { fn(payload); } catch (e) { console.error('[mic] リスナーでエラー', e); }
    });
  }

  /* ---- サポート判定・エラー分類（§2.7） ---------------------------------- */
  function isSupported() {
    return !!(self.navigator && navigator.mediaDevices && navigator.mediaDevices.getUserMedia
              && (self.AudioContext || self.webkitAudioContext));
  }

  function classifyError(e) {
    var name = e && e.name;
    if (!isSupported()) return 'unsupported';
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') return 'denied';
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return 'no-device';
    return 'error';
  }

  /* ---- ストリーム確立（§2.1） --------------------------------------------- */
  function ensureStream() {
    if (stream && audioCtx) return Promise.resolve();
    if (!isSupported()) return Promise.reject({ reason: 'unsupported', message: 'この環境ではマイクが使えません' });

    return navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,   // TTSの回り込みを抑える
        noiseSuppression: true,
        autoGainControl: false    // 自動ゲインだと閾値が動いてしまうので必ずfalse
      }
    }).then(function (s) {
      stream = s;
      audioCtx = new (self.AudioContext || self.webkitAudioContext)();
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = FFT_SIZE;
      analyser.smoothingTimeConstant = SMOOTHING;
      source.connect(analyser);
      buf = new Uint8Array(analyser.fftSize);
    }).catch(function (e) {
      return Promise.reject({ reason: classifyError(e), message: String(e && e.message || e) });
    });
  }

  function computeRms() {
    analyser.getByteTimeDomainData(buf);
    var sum = 0;
    for (var i = 0; i < buf.length; i++) {
      var v = (buf[i] - 128) / 128;
      sum += v * v;
    }
    return Math.sqrt(sum / buf.length);
  }

  /* ---- 較正（§2.1） ------------------------------------------------------- */
  function measureNoiseFloor() {
    return new Promise(function (resolve) {
      var samples = [];
      var startedAt = Date.now();
      var timer = setInterval(function () {
        samples.push(computeRms());
        if (Date.now() - startedAt >= CALIBRATE_MS) {
          clearInterval(timer);
          resolve(samples.length
            ? samples.reduce(function (a, b) { return a + b; }, 0) / samples.length
            : 0);
        }
      }, LOOP_MS);
    });
  }

  function applyNoiseFloor(noiseFloor) {
    var ot = Math.max(noiseFloor * ONSET_MULTIPLIER, ONSET_FLOOR);
    onsetThreshold = ot;
    offsetThreshold = ot * OFFSET_RATIO;
    calibrated = true;
    return ot;
  }

  // §2.1 測った値が異常なら採用しない。noiseFloor が閾値を超えたら
  // うるさい場所にいるか較正中に声が入っている。そのまま採用すると
  // 閾値が上がりすぎて「何を喋っても検知されない」状態になり原因も分からない。
  // 1回だけ自動でやり直し、それでも高ければ既定値を使って警告を返す。
  function calibrate() {
    return ensureStream().then(function () {
      return measureNoiseFloor().then(function (nf1) {
        if (nf1 <= NOISE_FLOOR_MAX) {
          return { noiseFloor: nf1, onsetThreshold: applyNoiseFloor(nf1), retried: false, tooNoisy: false };
        }
        // 1回だけ自動でやり直す
        return measureNoiseFloor().then(function (nf2) {
          if (nf2 <= NOISE_FLOOR_MAX) {
            return { noiseFloor: nf2, onsetThreshold: applyNoiseFloor(nf2), retried: true, tooNoisy: false };
          }
          onsetThreshold = UNCALIBRATED_ONSET;
          offsetThreshold = UNCALIBRATED_ONSET * OFFSET_RATIO;
          calibrated = false;
          return {
            noiseFloor: nf2,
            onsetThreshold: UNCALIBRATED_ONSET,
            retried: true,
            tooNoisy: true,
            message: '静かな場所で較正し直してください'
          };
        });
      });
    }).then(function (result) {
      // うるさすぎて採用しなかった値は保存しない（次回も既定値から始める）
      if (result.tooNoisy) return result;
      return EST.store.loadSettings().then(function (s) {
        s.mic = { noiseFloor: result.noiseFloor, onsetThreshold: result.onsetThreshold, calibratedAt: Date.now() };
        return EST.store.saveSettings(s);
      }).then(function () { return result; });
    });
  }

  // 保存済みの較正値があれば読み込む。無ければ保守的な既定値のまま。
  function loadCalibration() {
    return EST.store.loadSettings().then(function (s) {
      applySettings(s);
      if (!calibrated) {
        console.warn('[mic] 較正されていません。既定値で動作します。EST.mic.calibrate() を推奨します。');
      }
    });
  }

  /* =====================================================================
     「1回」の管理（§2.2 / §2.4 / §2.5）
     ===================================================================== */
  function openRep(cueAt) {
    rep = {
      cueAt: cueAt || null,      // markCue()が無ければnull → latencyMsもnull（§2.8）
      firstOnsetAt: null,
      spokenMs: 0,
      segments: [],
      stalls: [],
      lastOffsetAt: null,
      stallPending: null,
      timedOut: false
    };
  }

  function closeRep() {
    if (!rep) return;
    // 発話中に閉じられたら、その区間をここまでの分だけ算入して閉じる。
    // TTS駆動のステージ（§2.6）は再生終了から短い猶予で閉じるので、
    // 語尾を追いかけている途中で呼ばれることがある。
    if (voiced) {
      var now = Date.now();
      var seg = Math.max(0, now - segmentOnsetAt);
      rep.spokenMs += seg;
      rep.segments.push({ startedAt: segmentOnsetAt, durationMs: seg });
      voiced = false; onsetStreak = 0; offsetStreak = 0;
    }
    var payload = {
      spokenMs: rep.spokenMs,
      latencyMs: (rep.cueAt != null && rep.firstOnsetAt != null) ? (rep.firstOnsetAt - rep.cueAt) : null,
      stalls: rep.stalls.slice(),
      segments: rep.segments.slice()
    };
    lastRep = payload;
    rep = null;
    emit('rep', payload);
  }

  // §2.6 TTSが鳴るステージでは、回の区切りをTTSの終わりが決める。
  // §2.2 の2500msを当てると1行ごとに2.5秒待たされ、シャドーイングが成立しない。
  // ステージ側から明示的に閉じるための入口。進行中の回が無ければ
  // 「発話が無かった1回」として空のrepを出す（S1のように声を出さない
  // ステージでも、回の区切りだけは通知したいため）。
  function closeRepNow() {
    if (!rep) openRep(null);
    closeRep();
  }

  // §2.2/§2.4 無音の経過を見て、詰まり・回の確定・発話なしの打ち切りを判断する。
  // 解析ループから毎フレーム呼ばれる。
  function tickRepTimers(now) {
    if (!rep || voiced) return;

    // §2.4 キューを打ったのに一度も発話が無いまま10秒
    if (rep.firstOnsetAt == null) {
      if (rep.cueAt != null && (now - rep.cueAt) >= NO_ONSET_TIMEOUT_MS) {
        rep.timedOut = true;
        rep = null;
        emit('timeout', { t: now });
      }
      return;
    }

    var since = now - rep.lastOffsetAt;
    // §2.2 2500ms 新しいonsetが来なければ「1回」を確定する
    if (since >= REP_GAP_MS) { closeRep(); return; }

    // §2.5 発話開始後の1.5秒以上の無音は「詰まり」。回は継続する。
    // ただし詰まりは回の内側で起きる出来事なので、無音が続いたまま
    // REP_GAP_MS に達した場合（＝その回が終わっただけ）は詰まりにしない。
    // ここで先に emit すると、単発の発話でも必ず詰まり1件が付いてしまう。
    // よって確定は「無音が STALL_MS を超えたあと、再び発話が始まったとき」に行う。
    if (!rep.stallPending && since >= STALL_MS) {
      rep.stallPending = { t: now, elapsedMs: now - rep.firstOnsetAt };
    }
  }

  /* ---- 発話検知ループ（§2.2） ---------------------------------------------- */
  function loopTick() {
    if (!listening || !gateOpen) return;
    var rms = computeRms();
    var now = Date.now();

    if (now - lastLevelEmit >= LEVEL_EMIT_MS) {
      lastLevelEmit = now;
      emit('level', { rms: rms });
    }

    if (!voiced) {
      onsetStreak = rms > onsetThreshold ? onsetStreak + 1 : 0;
      if (onsetStreak >= ONSET_FRAMES) {
        voiced = true;
        onsetStreak = 0; offsetStreak = 0;
        segmentOnsetAt = now;
        lastAboveOffsetAt = now;
        // §2.8 markCue()が呼ばれていなくても回を開く。latencyMsはnullになる。
        if (!rep) openRep(null);
        if (rep.firstOnsetAt == null) rep.firstOnsetAt = now;
        // 直前の無音が STALL_MS を超えていて、かつ再び喋り始めた。
        // ここで初めて「回の内側の詰まり」として確定する（§2.5）。
        if (rep.stallPending) {
          rep.stalls.push(rep.stallPending);
          emit('stall', rep.stallPending);
          rep.stallPending = null;
        }
        emit('onset', { t: now });
      }
    } else {
      if (rms < offsetThreshold) {
        offsetStreak++;
      } else {
        offsetStreak = 0;
        lastAboveOffsetAt = now;   // まだ声が続いている
      }
      if (offsetStreak >= OFFSET_FRAMES) {
        voiced = false;
        onsetStreak = 0; offsetStreak = 0;
        // durationMsは実際に声があった長さにする。offset確定に使った
        // 300ms（OFFSET_FRAMES分の無音）を含めると実長より長く出てしまうため、
        // 最後に声が確認できた時刻までで区切る。
        var durationMs = lastAboveOffsetAt - segmentOnsetAt;
        if (rep) {
          rep.spokenMs += durationMs;
          rep.segments.push({ startedAt: segmentOnsetAt, durationMs: durationMs });
          rep.lastOffsetAt = lastAboveOffsetAt;
        }
        emit('offset', { t: now, durationMs: durationMs });
      }
    }

    tickRepTimers(now);
  }

  /* ---- バックグラウンドで解析を止める（§10.3） ----------------------------- */
  function installVisibilityHandling() {
    if (visHandlerInstalled) return;
    visHandlerInstalled = true;
    document.addEventListener('visibilitychange', function () {
      if (!listening) return;
      if (document.hidden) {
        if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
      } else if (!loopTimer) {
        loopTimer = setInterval(loopTick, LOOP_MS);
      }
    });
  }

  /* ---- start/stop --------------------------------------------------------- */
  function start() {
    if (listening) return Promise.resolve(true);
    return ensureStream()
      .then(loadCalibration)
      .then(function () {
        listening = true;
        gateOpen = true;
        voiced = false; onsetStreak = 0; offsetStreak = 0;
        rep = null; lastRep = null;
        installVisibilityHandling();
        if (!document.hidden) loopTimer = setInterval(loopTick, LOOP_MS);
        return true;
      });
  }

  // stop() は「聞き終わった」の意味にする。リスナーも解除する。
  // 画面をまたいで購読が残ると、次の画面には存在しないDOM要素を
  // 触ろうとするコールバックが残り続けるため。
  // 引き続き聞きたい呼び出し側は、次に start() したあと改めて on() する。
  function stop() {
    listening = false;
    voiced = false; onsetStreak = 0; offsetStreak = 0;
    rep = null;
    if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
    Object.keys(listeners).forEach(function (k) { listeners[k] = []; });
  }

  function isListening() { return listening; }

  /* ---- 公開API（§2.8） ----------------------------------------------------- */
  // §2.6 TTS再生中はカウント窓を閉じる。gate(false)で閉、gate(true)で開。
  function gate(open) {
    gateOpen = (open !== false);
    if (!gateOpen) {
      // 閉じている間の音は無かったことにする。開いた瞬間に
      // 直前のTTSの残響でonsetが立たないよう、検知state もリセットする。
      voiced = false; onsetStreak = 0; offsetStreak = 0;
    }
  }
  function isGateOpen() { return gateOpen; }

  // §2.4 レイテンシの t0 を打つ。進行中の回があれば先に確定させる。
  function markCue() {
    if (rep) closeRep();
    openRep(Date.now());
    return rep.cueAt;
  }

  // §2.4「今のはナシ」。直前に確定した1回の記録を取り消す。
  // 進行中の回があるならそちらを破棄する。
  function cancelLast() {
    if (rep) { rep = null; return true; }
    if (lastRep) { lastRep = null; return true; }
    return false;
  }
  function getLastRep() { return lastRep; }

  function applySettings(s) {
    if (!s) return;
    var m = s.mic || {};
    if (m.onsetThreshold) {
      onsetThreshold = m.onsetThreshold;
      offsetThreshold = onsetThreshold * OFFSET_RATIO;
      calibrated = true;
    }
  }

  function isCalibrated() { return calibrated; }
  function getThresholds() { return { onsetThreshold: onsetThreshold, offsetThreshold: offsetThreshold }; }

  /* ---- 計測値の加工（判定ではない。§2.4 / §1.8） --------------------------- */
  // §2.4 直近5回の中央値。平均だと咳や物音の外れ値に引っ張られるため。
  function medianOfLastN(history, n) {
    n = n || 5;
    var arr = (history || []).slice(-n).slice().sort(function (a, b) { return a - b; });
    if (!arr.length) return null;
    var mid = Math.floor(arr.length / 2);
    return (arr.length % 2) ? arr[mid] : (arr[mid - 1] + arr[mid]) / 2;
  }

  // §1.8 詰まりが文のどのあたりで起きたかを、経過時間とチャンクの累積想定時間
  // （語数比で按分）から推定する。厳密ではなく前半/中盤/後半程度の粒度。
  function estimateStallPosition(chunks, elapsedMs, expectedMs) {
    chunks = (chunks || []).map(String).filter(function (c) { return c.trim(); });
    if (!chunks.length || !expectedMs || expectedMs <= 0 || elapsedMs == null) return null;

    var wordCounts = chunks.map(function (c) { return Math.max(1, c.trim().split(/\s+/).length); });
    var totalWords = wordCounts.reduce(function (a, b) { return a + b; }, 0);

    var acc = 0, idx = chunks.length - 1;
    for (var i = 0; i < chunks.length; i++) {
      acc += (wordCounts[i] / totalWords) * expectedMs;
      if (elapsedMs <= acc) { idx = i; break; }
    }
    var frac = (idx + 0.5) / chunks.length;
    if (frac < 1 / 3) return 'front';
    if (frac < 2 / 3) return 'mid';
    return 'back';
  }

  EST.mic = {
    // §2.8 のインターフェース
    start: start,
    stop: stop,
    calibrate: calibrate,
    gate: gate,
    markCue: markCue,
    closeRep: closeRepNow,
    cancelLast: cancelLast,
    on: on,
    off: off,
    // 状態の参照
    isListening: isListening,
    isSupported: isSupported,
    isCalibrated: isCalibrated,
    isGateOpen: isGateOpen,
    getThresholds: getThresholds,
    getLastRep: getLastRep,
    applySettings: applySettings,
    // 計測値の加工（カウント成否の判定はF5。§2.8）
    medianOfLastN: medianOfLastN,
    estimateStallPosition: estimateStallPosition,
    // 定数（実機調整で参照する）
    STALL_MS: STALL_MS,
    REP_GAP_MS: REP_GAP_MS,
    NO_ONSET_TIMEOUT_MS: NO_ONSET_TIMEOUT_MS,
    NOISE_FLOOR_MAX: NOISE_FLOOR_MAX
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 04-stage.js ---- */
/* =====================================================================
   04-stage.js — ステージ進行とカウント判定（SPEC §1.1 / §1.2 / §1.5 / §2.3）

   EST.mic と同じ理由でUIから独立させる。カウント判定と進級判定を
   コンソールから単体で試せるようにしておくと、実機で閾値を触るときに
   練習画面を経由せずに済む。

   §2.8 カウント成否の判定はここ（ステージ層）の仕事。expectedMs を
   知っているのもここ。EST.mic は起きた事実だけを報告する。
   ===================================================================== */
;(function (EST) {
  'use strict';

  /* ---- 調整用の定数（実機で必ず調整する。SPEC §12） ------------------ */
  var COUNT_RATIO_DEFAULT = 0.55;   // §2.3 spokenMs/expectedMs がこれ以上で成立
  // §1.2 各ステージの最低回数
  var MIN_REPS = { S1: 3, S2: 10, S3: 15, S4: 15 };
  // §1.2 S2・S4 は「カウント成立が3回連続」、S3 は「各係数で3回連続」
  var STREAK_NEEDED = 3;
  // §1.2 S3 の目標時間の係数。各係数で3回連続成功したら次の段階へ。
  var S3_TIME_FACTORS = [1.3, 1.15, 1.0, 0.9];
  // §2.6 TTSが鳴るステージで、再生終了から回を閉じるまでの猶予
  var TTS_CLOSE_DELAY_MS = 800;
  // §1.4 で使う定着閾値の係数（F7で使う。ここでは持つだけ）
  var MASTERY_BASE_MS = 1200;
  var MASTERY_PER_WORD_MS = 60;

  var STAGES = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'];
  var STAGE_LABELS = {
    S1: 'S1 聞いてなぞる',
    S2: 'S2 重ねて読む',
    S3: 'S3 見て読む',
    S4: 'S4 影を追う',
    S5: 'S5 和訳から出す',
    S6: 'S6 相手に返す'
  };
  // F5 の対象。S5・S6 は F7。
  var IMPLEMENTED = { S1: true, S2: true, S3: true, S4: true };

  // §2.6 ステージごとのTTS・マイクの扱い
  var STAGE_MODE = {
    S1: { tts: true,  mic: false, showEn: true,  showJa: true,  timeBar: false },
    S2: { tts: true,  mic: true,  showEn: true,  showJa: false, timeBar: false },
    S3: { tts: false, mic: true,  showEn: true,  showJa: false, timeBar: true },
    S4: { tts: true,  mic: true,  showEn: false, showJa: false, timeBar: false }
  };

  function stageLabel(st) { return STAGE_LABELS[st] || st; }
  function stageMode(st) { return STAGE_MODE[st] || STAGE_MODE.S3; }
  function minReps(st) { return MIN_REPS[st] || 0; }

  /* ---- カウント判定（§2.3） ----------------------------------------------
     ここが F4 から移ってきた部分。EST.mic は spokenMs を出すだけで、
     何回と数えるかは知らない。 */
  function judgeCount(spokenMs, expectedMs, ratio) {
    if (!expectedMs || expectedMs <= 0) return false;
    var r = (ratio == null) ? COUNT_RATIO_DEFAULT : ratio;
    return (spokenMs / expectedMs) >= r;
  }

  /* ---- TopicProgress（§5.6） ---------------------------------------------
     stage と、進級判定に必要な連続成功カウント・S3の係数段階を持つ。
     アプリを閉じても失われないよう保存する。 */
  function defaultTopicProgress(profileId, topicId) {
    return {
      topicId: EST.store.topicProgressKey(topicId),
      profileId: profileId,
      realTopicId: topicId,
      stage: 'S1',
      blockIndex: 0,          // §1.5 ブロックごとにステージが独立して進む
      streak: 0,              // 連続でカウント成立した回数
      s3FactorIndex: 0,       // §1.2 S3 の係数段階
      s3Streak: 0,            // 現在の係数での連続成功数
      stageReps: {},          // ステージごとの実施回数（S1は再生回数）
      laps: { total: 0, byStage: {} },
      sessions: [],
      updatedAt: 0
    };
  }

  function loadTopicProgress(topicId) {
    var key = EST.store.topicProgressKey(topicId);
    return EST.store.get('topicProgress', key).then(function (rec) {
      if (rec) return rec;
      return defaultTopicProgress(EST.profile.get(), topicId);
    });
  }

  function saveTopicProgress(tp) {
    tp.updatedAt = Date.now();
    return EST.store.put('topicProgress', tp);
  }

  /* ---- 進級判定（§1.2） ---------------------------------------------------
     最低回数と達成条件の両方を満たすと進める。進級は強制しない。 */
  function canAdvance(tp) {
    var st = tp.stage;
    var reps = (tp.stageReps && tp.stageReps[st]) || 0;
    if (reps < minReps(st)) return false;

    if (st === 'S1') return true;                       // 3回聞けば進める
    if (st === 'S2' || st === 'S4') return tp.streak >= STREAK_NEEDED;
    if (st === 'S3') {
      // 0.9（最後の係数）で3回連続できたら進級条件を満たす
      return tp.s3FactorIndex >= S3_TIME_FACTORS.length - 1 && tp.s3Streak >= STREAK_NEEDED;
    }
    return false;
  }

  function nextStage(st) {
    var i = STAGES.indexOf(st);
    return (i >= 0 && i < STAGES.length - 1) ? STAGES[i + 1] : null;
  }

  function advance(tp) {
    var nx = nextStage(tp.stage);
    if (!nx) return tp;
    tp.stage = nx;
    tp.streak = 0;
    tp.s3FactorIndex = 0;
    tp.s3Streak = 0;
    return tp;
  }

  function currentS3Factor(tp) {
    return S3_TIME_FACTORS[Math.min(tp.s3FactorIndex, S3_TIME_FACTORS.length - 1)];
  }

  /* ---- 1回ぶんの結果を記録する ---------------------------------------------
     result: { ok, spokenMs, latencyMs, stalls, withinTime }
     ok は §2.3 の判定結果。withinTime は S3 の目標時間内に読めたか。 */
  function recordRep(tp, lineId, topicId, result) {
    var st = tp.stage;
    tp.stageReps = tp.stageReps || {};
    tp.stageReps[st] = (tp.stageReps[st] || 0) + 1;

    if (st === 'S2' || st === 'S4') {
      tp.streak = result.ok ? (tp.streak + 1) : 0;
    } else if (st === 'S3') {
      // §1.2 目標時間内に詰まりなく読み切るのを3回連続
      var good = result.ok && result.withinTime && !(result.stalls && result.stalls.length);
      if (good) {
        tp.s3Streak++;
        if (tp.s3Streak >= STREAK_NEEDED && tp.s3FactorIndex < S3_TIME_FACTORS.length - 1) {
          tp.s3FactorIndex++;
          tp.s3Streak = 0;   // 次の係数で改めて3回連続を数える
        }
      } else {
        tp.s3Streak = 0;
      }
      tp.streak = good ? (tp.streak + 1) : 0;
    } else if (st === 'S1') {
      tp.streak = tp.stageReps.S1;   // S1は聞くだけなので実施回数がそのまま
    }
    return tp;
  }

  /* ---- Progress（§5.5）の更新 ---------------------------------------------
     行ごとの累計回数・レイテンシ・詰まりを記録する。 */
  function recordLineProgress(topicId, lineId, stage, result) {
    var key = EST.store.progressKey(topicId, lineId);
    return EST.store.get('progress', key).then(function (rec) {
      var p = rec || EST.schema.defaultProgress(EST.profile.get(), topicId, lineId);
      p.counts = p.counts || { total: 0, byStage: {} };
      if (result.ok) {
        p.counts.total = (p.counts.total || 0) + 1;
        p.counts.byStage[stage] = (p.counts.byStage[stage] || 0) + 1;
      }
      if (result.latencyMs != null) {
        p.latency = p.latency || { history: [], median5: null, best: null };
        p.latency.history = (p.latency.history || []).concat([result.latencyMs]).slice(-20);
        p.latency.median5 = EST.mic.medianOfLastN(p.latency.history, 5);
        p.latency.best = p.latency.history.reduce(function (a, b) { return Math.min(a, b); }, Infinity);
      }
      if (result.stalls && result.stalls.length) {
        p.stalls = (p.stalls || 0) + result.stalls.length;
      }
      p.updatedAt = Date.now();
      return EST.store.put('progress', p).then(function () { return p; });
    });
  }

  // 「今のはナシ」（§2.4）。直前の1回ぶんを巻き戻す。
  function undoLineProgress(topicId, lineId, stage, result) {
    var key = EST.store.progressKey(topicId, lineId);
    return EST.store.get('progress', key).then(function (p) {
      if (!p) return null;
      if (result.ok) {
        p.counts.total = Math.max(0, (p.counts.total || 0) - 1);
        p.counts.byStage[stage] = Math.max(0, (p.counts.byStage[stage] || 0) - 1);
      }
      if (result.latencyMs != null && p.latency && p.latency.history.length) {
        p.latency.history = p.latency.history.slice(0, -1);
        p.latency.median5 = EST.mic.medianOfLastN(p.latency.history, 5);
        p.latency.best = p.latency.history.length
          ? p.latency.history.reduce(function (a, b) { return Math.min(a, b); }, Infinity) : null;
      }
      if (result.stalls && result.stalls.length) {
        p.stalls = Math.max(0, (p.stalls || 0) - result.stalls.length);
      }
      p.updatedAt = Date.now();
      return EST.store.put('progress', p).then(function () { return p; });
    });
  }

  /* ---- ブロック（§1.5） ---------------------------------------------------
     13行以上のときだけUIにブロックの概念が出る。12行以下は
     1トピック＝1ブロック扱いで、ブロックという言葉を出さない。 */
  function blocksOf(topic) {
    var blocks = topic.blocks || [];
    if (!blocks.length) return [{ id: 'all', label: '', from: null, to: null }];
    return blocks;
  }

      if (l.id === b.to) toIdx = i;

    if (fromIdx < 0) fromIdx = 0;
    if (toIdx < 0) toIdx = all.length - 1;

  }

    STAGES: STAGES,
    STAGE_LABELS: STAGE_LABELS,
    IMPLEMENTED: IMPLEMENTED,
    S3_TIME_FACTORS: S3_TIME_FACTORS,
    STREAK_NEEDED: STREAK_NEEDED,
    COUNT_RATIO_DEFAULT: COUNT_RATIO_DEFAULT,
    TTS_CLOSE_DELAY_MS: TTS_CLOSE_DELAY_MS,
    MASTERY_BASE_MS: MASTERY_BASE_MS,
    MASTERY_PER_WORD_MS: MASTERY_PER_WORD_MS,

    stageLabel: stageLabel,
    stageMode: stageMode,
    minReps: minReps,
    judgeCount: judgeCount,

    defaultTopicProgress: defaultTopicProgress,
    loadTopicProgress: loadTopicProgress,
    saveTopicProgress: saveTopicProgress,

    canAdvance: canAdvance,
    nextStage: nextStage,
    advance: advance,
    currentS3Factor: currentS3Factor,
    recordRep: recordRep,
    recordLineProgress: recordLineProgress,
    undoLineProgress: undoLineProgress,

    blocksOf: blocksOf,
    usesBlocks: usesBlocks,
    linesOfBlock: linesOfBlock

<script>
/* ---- 06-profile.js ---- */
/* =====================================================================
   06-profile.js — プロフィール（部屋）: SPEC §5.9
   2人で同じアプリを使う。台本は共有、進捗は完全に分ける。
   ここは「今どちらの部屋か」を持つだけの小さなモジュールにする。
   キーの組み立ては 00-store.js 側で行う。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var LS_KEY = 'est-profile';

  // 権限は §5.9 の表のとおり。2人とも学習者で、タモやんが台本づくりと配信も担う。
  // まりに編集導線を出さないのは役割の上下ではなく、誤操作を防いで画面を単純に保つため。
  var PROFILES = [
    { id: 'tamo', label: 'タモやん', sub: '練習と台本づくり', canEdit: true },
    { id: 'mari', label: 'まり',     sub: '練習',             canEdit: false }
  ];

  var current = null;   // 未選択のあいだは null

  function all() { return PROFILES.slice(); }

  function find(id) {
    var hit = null;
    PROFILES.forEach(function (p) { if (p.id === id) hit = p; });
    return hit;
  }

  // 起動時に localStorage から復元する。IndexedDB に置かないのは、
  // 「どの部屋か」がDBを開くより前に決まっていないとキーを作れないため。
  function restore() {
    try {
      var id = localStorage.getItem(LS_KEY);
      if (find(id)) { current = id; return id; }
    } catch (e) { /* プライベートモード等 */ }
    return null;
  }

  function set(id) {
    if (!find(id)) throw new Error('不明なプロフィールです: ' + id);
    current = id;
    try { localStorage.setItem(LS_KEY, id); } catch (e) {}
    return id;
  }

  function get() { return current; }
  function isChosen() { return !!current; }

  function info() { return find(current) || PROFILES[0]; }
  function label() { return info().label; }

  // 編集系（台本の作成・編集・削除・配信用書き出し）を出してよいか
  function canEdit() { return !!(find(current) && find(current).canEdit); }

    current = null;

     一覧・検索・復習キューはすべてこの関数を通す。絞り込みのルールを
     1か所に集めておかないと、F2 の検索や F7 の復習キューで食い違う。
  --------------------------------------------------------------------- */
  function canSee(topic) {
    if (!topic) return false;
    var a = topic.audience || 'both';
    return a === 'both' || a === current;
  }

  function visible(topics) {
    return (topics || []).filter(canSee);
  }

  // 相手の部屋（2人固定なので、自分でないほう）
  function other() {
    var me = current;
    var hit = null;
    PROFILES.forEach(function (p) { if (p.id !== me) hit = p; });
    return hit || PROFILES[0];
  }

  // audience の値を、いま見ている人から見た日本語にする
  function audienceLabel(a) {
    if (a === 'both') return '両方';
    if (a === current) return '自分用';
    var o = find(a);
    return (o ? o.label : a) + '用';
  }

  EST.profile = {
    LS_KEY: LS_KEY,
    all: all,
    restore: restore,
    set: set,
    get: get,
    isChosen: isChosen,
    info: info,
    label: label,
    canEdit: canEdit,
    clear: clear,
    canSee: canSee,
    visible: visible,
    other: other,
    audienceLabel: audienceLabel
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 07-backup.js ---- */
/* =====================================================================
   07-backup.js — 全体バックアップと復元（SPEC §6.4 / §5.9）
   個人アプリはデータが飛ぶと二度と使われなくなるので、ここは必ず作る。
   audio ストアはバックアップに含めない（§5.8）。外部TTSの音声キャッシュも、
   お手本音声の実測長（dur|...）も、端末とボイスに依存し、消えても
   再生し直せば作り直せるため。

   §5.9 の権限:
     タモやん … 全体（台本＋全員の進捗＋設定）
     まり     … 自分の進捗のみ（台本は含めない）
   ===================================================================== */
;(function (EST) {
  'use strict';

  var BACKUP_KIND = 'est-backup';
  var AUTO_KEEP = 3;   // §6.4 直近3世代

  // プロフィールごとに分かれるストア。topics は共有、audio は対象外（§5.8）。
  var PROGRESS_STORES = ['progress', 'wordProgress', 'topicProgress'];

  function keyPathOf(name) { return name === 'topicProgress' ? 'topicId' : 'key'; }

  function isFull() { return EST.profile.canEdit(); }

  /* ---- 書き出し -------------------------------------------------------- */
  function exportAll() {
    var full = isFull();
    var me = EST.profile.get();

    var jobs = PROGRESS_STORES.map(function (n) { return EST.store.getAll(n); });
    jobs.push(full ? EST.store.getAll('topics') : Promise.resolve(null));
    jobs.push(EST.store.loadSettings());
    jobs.push(full ? EST.store.loadShared() : Promise.resolve(null));

    return Promise.all(jobs).then(function (res) {
      var data = {
        kind: BACKUP_KIND,
        schemaVersion: EST.schema.SCHEMA_VERSION,
        exportedAt: Date.now(),
        profileId: me,
        scope: full ? 'full' : 'progress'   // 復元側が中身を判断できるように
      };

      PROGRESS_STORES.forEach(function (name, i) {
        var rows = res[i] || [];
        // まりのバックアップには自分の行だけ入れる（相手の進捗は持ち出さない）
        data[name] = full ? rows : rows.filter(function (r) {
          return EST.store.belongsToProfile(r[keyPathOf(name)], me);
        });
      });

      if (full) data.topics = res[PROGRESS_STORES.length] || [];

      var s = JSON.parse(JSON.stringify(res[PROGRESS_STORES.length + 1]));
      delete s.autoBackups;   // 自動バックアップを入れ子にすると際限なく膨らむ
      data.settings = s;

      if (full) data.shared = res[PROGRESS_STORES.length + 2];
      return data;
    });
  }

  function exportAllText() {
    return exportAll().then(function (d) { return JSON.stringify(d, null, 2); });
  }

  /* ---- 復元 ------------------------------------------------------------
     mode: 'overwrite'（消してから入れる） / 'merge'（同キーは updatedAt が新しい方）
  --------------------------------------------------------------------- */
  function importAll(data, mode) {
    if (!data || typeof data !== 'object') return Promise.reject(new Error('バックアップとして読めません'));

    var full = isFull();
    var me = EST.profile.get();
    var chain = Promise.resolve();

    // 台本を書き戻せるのは編集できる部屋だけ（§5.9）
    if (full && Array.isArray(data.topics)) {
      chain = chain.then(function () { return writeStore('topics', data.topics, mode); });
    }

    PROGRESS_STORES.forEach(function (name) {
      var rows = Array.isArray(data[name]) ? data[name] : [];
      if (!full) {
        // 自分の部屋の行だけを書き戻す。相手の進捗には触らない。
        rows = rows.filter(function (r) { return EST.store.belongsToProfile(r[keyPathOf(name)], me); });
      }
      chain = chain.then(function () { return writeStore(name, rows, mode, full ? null : me); });
    });

    if (data.settings) {
      chain = chain.then(function () {
        return EST.store.loadSettings().then(function (cur) {
          var next = JSON.parse(JSON.stringify(data.settings));
          next.autoBackups = cur.autoBackups || [];   // 自動バックアップは今の端末のものを残す
          return EST.store.saveSettings(next);
        });
      });
    }
    if (full && data.shared) {
      chain = chain.then(function () { return EST.store.saveShared(data.shared); });
    }

  }

  // onlyProfile を渡すと、上書きでもその部屋の行だけを消す
  function writeStore(name, rows, mode, onlyProfile) {
    var kp = name === 'topics' ? 'id' : keyPathOf(name);

    if (mode === 'overwrite') {
      if (!onlyProfile) {
        return EST.store.clear(name).then(function () { return EST.store.bulkPut(name, rows); });
      }
      return EST.store.getAll(name).then(function (cur) {
        var chain = Promise.resolve();
        cur.filter(function (r) { return EST.store.belongsToProfile(r[kp], onlyProfile); })
           .forEach(function (r) { chain = chain.then(function () { return EST.store.del(name, r[kp]); }); });
        return chain.then(function () { return EST.store.bulkPut(name, rows); });
      });
    }

    // マージ: 同じキーが両方にあるときは updatedAt が新しい方を採用する
    return EST.store.getAll(name).then(function (cur) {
      var byKey = {};
      cur.forEach(function (r) { byKey[r[kp]] = r; });
      var merged = rows.filter(function (r) {
        var old = byKey[r[kp]];
        return !old || (Number(r.updatedAt) || 0) >= (Number(old.updatedAt) || 0);
      });
      return EST.store.bulkPut(name, merged);

  }

  /* ---- 自動バックアップ（トピック保存のたびに1世代） ------------------- */
  function snapshot(label) {
    return exportAllText().then(function (text) {
      return EST.store.loadSettings().then(function (s) {
        var list = Array.isArray(s.autoBackups) ? s.autoBackups.slice() : [];
        list.unshift({ at: Date.now(), label: label || '', size: text.length, json: text });
        s.autoBackups = list.slice(0, AUTO_KEEP);
        return EST.store.saveSettings(s);
      });
    }).catch(function (e) {
      // バックアップの失敗で保存そのものを止めない
      console.warn('[backup] 自動バックアップに失敗しました', e);

  }

  function listAuto() {
    return EST.store.loadSettings().then(function (s) {
      return (s.autoBackups || []).map(function (b, i) {

  }

  function restoreAuto(index, mode) {

      return importAll(JSON.parse(b.json), mode || 'overwrite');
    });
  }

  function wipeAll() {
    var chain = Promise.resolve();
    EST.store.STORES.forEach(function (name) {
      chain = chain.then(function () { return EST.store.clear(name); });
    });
    return chain;
  }

  // 自分の部屋の記録だけを消す。台本（共有）には触らない。
  function wipeProfile() {
    var me = EST.profile.get();
    var chain = Promise.resolve();
    PROGRESS_STORES.forEach(function (name) {
      chain = chain.then(function () {
        return EST.store.getAll(name).then(function (rows) {
          var sub = Promise.resolve();
          rows.filter(function (r) { return EST.store.belongsToProfile(r[keyPathOf(name)], me); })
              .forEach(function (r) {
                sub = sub.then(function () { return EST.store.del(name, r[keyPathOf(name)]); });
              });
          return sub;
        });
      });
    });
    return chain.then(function () { return EST.store.del('settings', EST.store.settingsKey(me)); });
  }

  EST.backup = {
    BACKUP_KIND: BACKUP_KIND,
    AUTO_KEEP: AUTO_KEEP,
    exportAll: exportAll,
    exportAllText: exportAllText,
    importAll: importAll,
    snapshot: snapshot,
    listAuto: listAuto,
    restoreAuto: restoreAuto,
    wipeAll: wipeAll,
    wipeProfile: wipeProfile
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 08-ui-kit.js ---- */
/* =====================================================================
   07-ui-kit.js — 画面を組み立てるための最小限の道具
   DOM を組み立てる h()、トースト、ダイアログ、ファイル入出力だけ。
   ここに画面固有のロジックは入れない。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var TOAST_MS = 2200;

  function append(el, children) {
    if (children === null || children === undefined || children === false) return;
    if (Array.isArray(children)) { children.forEach(function (c) { append(el, c); }); return; }
    if (children instanceof Node) { el.appendChild(children); return; }
    el.appendChild(document.createTextNode(String(children)));
  }

  // h('div', {class:'x', onClick:fn}, ['中身'])
  function h(tag, props, children) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class' || k === 'className') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.keys(v).forEach(function (s) { el.style[s] = v[s]; });
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'multiple') el[k] = !!v;
      else el.setAttribute(k, v);
    });
    append(el, children);
    return el;
  }

  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }

    if (!root) return;
    var el = h('div', { class: 'toast', text: msg });

    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, TOAST_MS);
  }

     buttons: [{label, value, kind:'primary'|'danger'|undefined}]
     戻り値は選ばれた value（背景クリックや Esc は null）
  --------------------------------------------------------------------- */
  function dialog(opts) {

        return h('button', {
          class: 'btn' + (b.kind === 'primary' ? ' btn--primary' : b.kind === 'danger' ? ' btn--danger' : ''),
          text: b.label,
          onClick: function () { close(b.value); }
        });
      });

      var modal = h('div', { class: 'modal' }, [
        opts.title ? h('h2', { class: 'modal__title', text: opts.title }) : null,
        h('div', { class: 'modal__body' }, opts.body || null),
        h('div', { class: 'modal__actions' }, buttons)
      ]);
      modal.addEventListener('click', function (e) { e.stopPropagation(); });
      back.addEventListener('click', function () { if (opts.dismissable !== false) close(null); });
      append(back, modal);
      root.appendChild(back);
      document.addEventListener('keydown', onKey);
      var first = modal.querySelector('input, textarea, select, button');
      if (first) try { first.focus(); } catch (e) {}
    });
  }

  function confirm(title, message, okLabel, kind) {
    return dialog({
      title: title,
      body: h('p', { text: message || '' }),
      buttons: [
        { label: 'やめる', value: false },
        { label: okLabel || 'OK', value: true, kind: kind || 'primary' }
      ]
    }).then(function (v) { return v === true; });
  }

  function alertBox(title, message) {
    var body = Array.isArray(message)
      ? h('ul', {}, message.map(function (m) { return h('li', { text: m }); }))
      : h('p', { text: message || '' });
    return dialog({ title: title, body: body, buttons: [{ label: '閉じる', value: true, kind: 'primary' }] });
  }

  // 3択以上を選ばせる（id重複時の「上書き/別として追加/中止」など）
  function choose(title, message, options) {
    return dialog({
      title: title,
      body: h('p', { text: message || '' }),
      buttons: options
    });
  }

  /* ---- ファイル -------------------------------------------------------- */
  function download(filename, text, mime) {
    var blob = new Blob([text], { type: (mime || 'application/json') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 500);
  }

  function pickFile(accept) {
    return new Promise(function (resolve) {
      var input = h('input', { type: 'file', accept: accept || '.json,application/json', class: 'hidden' });
      document.body.appendChild(input);
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        if (!f) { cleanup(); resolve(null); return; }
        var fr = new FileReader();
        fr.onload = function () { cleanup(); resolve({ name: f.name, text: String(fr.result || '') }); };
        fr.onerror = function () { cleanup(); resolve(null); };
        fr.readAsText(f, 'utf-8');
