  // §5.9 タモやんの編集画面には audience の選択を必ず置く
  function audienceButtons() {
    var t = state.topic;
    var me = EST.profile.get();
    var other = EST.profile.other().id;
    return [me, other, 'both'].map(function (a) {
      return h('button', {
        class: 'btn btn--sm' + (t.audience === a ? ' btn--primary' : ''),
        text: EST.profile.audienceLabel(a),
        onClick: function () {
          t.audience = a;
          var box = document.getElementById('audience-box');
          if (box) ui().mount(box, audienceButtons());
        }
      });
    });
  }

  function myRoleButtons() {
    var t = state.topic;
    return t.speakers.map(function (s) {
      return h('button', {
        class: 'btn btn--sm' + (t.myRole === s.id ? ' btn--primary' : ''),
        text: s.label || s.id,
        onClick: function () {
          t.myRole = s.id;
          var box = document.getElementById('myrole-box');
          if (box) ui().mount(box, myRoleButtons());
        }
      });
    });
  }

  function refreshMyRole() {
    var box = document.getElementById('myrole-box');
    if (box) ui().mount(box, myRoleButtons());
  }

  /* ---- 話者（ラベルの一括リネーム） ------------------------------------ */
  function renderSpeakers() {
    var U = ui();
    var t = state.topic;
    var used = {};
    t.lines.forEach(function (l) { used[l.speakerId] = (used[l.speakerId] || 0) + 1; });

    U.mount(elSpeakers, t.speakers.map(function (s, i) {
      return h('div', { class: 'row row--tight', style: { marginBottom: '.3rem' } }, [
        h('input', {
          type: 'text', value: s.label, class: 'grow', style: { maxWidth: '10rem' },
          onInput: function (e) {
            s.label = e.target.value;          // 参照は id なので、ここを変えれば全行に効く
            refreshSpeakerOptions();
            refreshMyRole();
          }
        }),
        h('select', {
          style: { width: 'auto' },
          onChange: function (e) { s.gender = e.target.value; }
        }, [
          h('option', { value: '', selected: !s.gender }, '性別なし'),
          h('option', { value: 'female', selected: s.gender === 'female' }, '女性'),
          h('option', { value: 'male', selected: s.gender === 'male' }, '男性')
        ]),
        h('span', { class: 'chip', text: (used[s.id] || 0) + '行' }),
        h('button', {
          class: 'btn btn--sm btn--danger', text: '削除',
          disabled: (used[s.id] || 0) > 0 || t.speakers.length <= 1,
          onClick: function () {
            t.speakers.splice(i, 1);
            if (t.myRole === s.id) t.myRole = '';
            renderSpeakers(); refreshMyRole(); renderLines();
          }
        })
      ]);
    }));
  }

  function addSpeaker() {
    var t = state.topic;
    var n = 1;
    var ids = {};
    t.speakers.forEach(function (s) { ids[s.id] = true; });
    while (ids['S' + n]) n++;
    t.speakers.push({ id: 'S' + n, label: 'S' + n, gender: '' });
    renderSpeakers(); refreshMyRole(); renderLines();
  }

  function refreshSpeakerOptions() {
    var t = state.topic;
    rowEls.forEach(function (row) {
      if (!row || !row.__spSel) return;
      Array.prototype.forEach.call(row.__spSel.options, function (op) {
        t.speakers.forEach(function (s) { if (s.id === op.value) op.textContent = s.label || s.id; });
      });
    });
  }

  /* ---- 行 -------------------------------------------------------------- */
  function renderLines() {
    var U = ui();
    var t = state.topic;
    var y = window.scrollY;
    rowEls = [];

    var startIndexOf = {};
    state.starts.forEach(function (x, i) { startIndexOf[x] = i; });

    var frag = [];
    t.lines.forEach(function (l, i) {
      var bi = startIndexOf[i];
      if (bi !== undefined) frag.push(bi === 0 ? blockHead(0) : blockDivider(bi));
      var row = lineRow(l, i);
      rowEls[i] = row;
      frag.push(row);
    });

    U.mount(elLines, frag);
    window.scrollTo(0, y);
  }

  function blockLabelInput(bi) {
    return h('input', {
      type: 'text', class: 'blk-div__label',
      value: state.blockLabels[bi] || '',
      placeholder: 'パート' + (bi + 1),
      onInput: function (e) { state.blockLabels[bi] = e.target.value; }
    });
  }

  function blockHead(bi) {
    return h('div', { class: 'blk-div', style: { borderStyle: 'solid' } }, [
      h('span', { class: 'blk-div__no', text: 'ブロック1' }),
      blockLabelInput(bi),
      h('span', { class: 'tiny muted right', text: '先頭の境界は動かせません' })
    ]);
  }

  function blockDivider(bi) {
    var el = h('div', { class: 'blk-div' }, [
      h('span', {
        class: 'blk-div__grip', text: '⣿ ドラッグ',
        onPointerdown: function (e) { startDrag(bi, e, el); }
      }),
      h('span', { class: 'blk-div__no', text: 'ブロック' + (bi + 1) }),
      blockLabelInput(bi),
      h('div', { class: 'row row--tight right' }, [
        h('button', { class: 'btn btn--icon', text: '▲', onClick: function () { moveBoundary(bi, state.starts[bi] - 1); } }),
        h('button', { class: 'btn btn--icon', text: '▼', onClick: function () { moveBoundary(bi, state.starts[bi] + 1); } }),
        h('button', {
          class: 'btn btn--icon btn--danger', text: '×',
          disabled: state.starts.length <= 2 && state.topic.lines.length >= EST.schema.BLOCK_AUTO_MIN,
          onClick: function () { removeBoundary(bi); }
        })
      ])
    ]);
    return el;
  }

  function lineRow(l, i) {
    var t = state.topic;
    var spSel = h('select', {
      class: 'ed-line__sp',
      onChange: function (e) { l.speakerId = e.target.value; }
    }, t.speakers.map(function (s) {
      return h('option', { value: s.id, selected: s.id === l.speakerId }, s.label || s.id);
    }));

    var enTa = h('textarea', {
      class: 'en', rows: 2, value: l.en, placeholder: '英文',
      onInput: function (e) {
        l.en = e.target.value;
        l.chunks = EST.schema.splitChunks(l.en);   // 英文が変わればチャンクは作り直す
        updateStats();
      }
    });
    var jaTa = h('textarea', {
      class: 'ja-in', rows: 1, value: l.ja, placeholder: '和訳',
      onInput: function (e) { l.ja = e.target.value; }
    });

    var extra = h('div', { class: 'ed-line__extra' + (state.open[l.id] ? '' : ' hidden') });
    buildExtra(extra, l);

    var row = h('div', { class: 'ed-line' }, [
      h('div', { class: 'ed-line__top' }, [
        h('span', { class: 'ed-line__no', text: String(i + 1) }),
        spSel,
        h('div', { class: 'ed-line__tools' }, [
          h('button', { class: 'btn btn--icon', text: '↑', disabled: i === 0, onClick: function () { moveLine(i, -1); } }),
          h('button', { class: 'btn btn--icon', text: '↓', disabled: i === t.lines.length - 1, onClick: function () { moveLine(i, 1); } }),
          h('button', { class: 'btn btn--sm', text: '分割', onClick: function () { splitLine(i); } }),
          h('button', { class: 'btn btn--sm', text: '結合', disabled: i === t.lines.length - 1, onClick: function () { mergeLine(i); } }),
          h('button', {
            class: 'btn btn--sm', text: '詳細',
            onClick: function () {
              state.open[l.id] = !state.open[l.id];
              extra.className = 'ed-line__extra' + (state.open[l.id] ? '' : ' hidden');
              if (state.open[l.id]) buildExtra(extra, l);
            }
          }),
          h('button', { class: 'btn btn--icon btn--danger', text: '✕', disabled: t.lines.length <= 1, onClick: function () { removeLine(i); } })
        ])
      ]),
      enTa, jaTa, extra
    ]);
    row.__enTa = enTa;
    row.__spSel = spSel;
    return row;
  }

  function buildExtra(box, l) {
    var U = ui();
    U.mount(box, [
      h('label', { class: 'field' }, [
        h('span', { class: 'field__label', text: 'メモ（任意）' }),
        h('input', { type: 'text', value: l.note, onInput: function (e) { l.note = e.target.value; } })
      ]),
      h('div', { style: { marginTop: '.4rem' } }, [
        h('span', { class: 'field__label', text: 'チャンク（区切りをタップで動かせます）' }),
        chunkEditor(l)
      ])
    ]);
  }

  /* チャンク境界エディタ（§1.8 自動分割は必ず外すのでタップで直せるようにする） */
  function chunkEditor(l) {
    var box = h('div', { class: 'chunks' });
    draw();
    return box;

    function draw() {
      var chunks = (l.chunks && l.chunks.length) ? l.chunks : EST.schema.splitChunks(l.en);
      var tokens = [], bounds = {};
      chunks.forEach(function (c) {
        var ws = String(c).trim().split(/\s+/).filter(Boolean);
        if (!ws.length) return;
        if (tokens.length) bounds[tokens.length] = true;
        ws.forEach(function (w) { tokens.push(w); });
      });

      var parts = [];
      tokens.forEach(function (w, i) {
        if (i > 0) {
          if (bounds[i]) {
            parts.push(h('span', {
              class: 'chunks__bar', text: '|', title: 'ここの区切りをやめる',
              onClick: function () { delete bounds[i]; commit(tokens, bounds); }
            }));
          } else {
            parts.push(h('span', {
              class: 'chunks__gap', text: '·', title: 'ここで区切る',
              onClick: function () { bounds[i] = true; commit(tokens, bounds); }
            }));
          }
        }
        parts.push(h('span', { class: 'chunks__w', text: w }));
      });
      if (!tokens.length) parts.push(h('span', { class: 'tiny muted', text: '（英文が空です）' }));
      ui().mount(box, parts);
    }

    function commit(tokens, bounds) {
      var out = [], cur = [];
      tokens.forEach(function (w, i) {
        if (i > 0 && bounds[i]) { out.push(cur.join(' ')); cur = []; }
        cur.push(w);
      });
      if (cur.length) out.push(cur.join(' '));
      l.chunks = out;
      draw();
    }
  }

  /* ---- 行の構造操作 ----------------------------------------------------- */
  function nextLineId() {
    var max = 0;
    state.topic.lines.forEach(function (l) {
      var m = /^ln_(\d+)$/.exec(l.id || '');
      if (m) max = Math.max(max, Number(m[1]));
    });
    return 'ln_' + EST.schema.pad3(max + 1);
  }

  function shiftStarts(fn) {
    state.starts = state.starts.map(fn);
    fixStarts();
  }

  function fixStarts() {
    var n = state.topic.lines.length;
    var s = state.starts.filter(function (x) { return x >= 0 && x < n; });
    s = s.filter(function (x, i, a) { return a.indexOf(x) === i; });
    s.sort(function (a, b) { return a - b; });
    if (s.length && s[0] !== 0) s.unshift(0);
    if (s.length === 1) s = [];        // 境界が先頭だけなら「ブロックなし」と同じ
    state.starts = s;
    state.blockLabels.length = s.length;
  }

  function addLine(afterIndex) {
    var t = state.topic;
    var at = Math.min(Math.max(afterIndex + 1, 0), t.lines.length);
    var prev = t.lines[afterIndex];
    var nextSp = t.speakers.length > 1 && prev
      ? (t.speakers[(indexOfSpeaker(prev.speakerId) + 1) % t.speakers.length].id)
      : (t.speakers[0] && t.speakers[0].id);
    t.lines.splice(at, 0, {
      id: nextLineId(), speakerId: nextSp, en: '', ja: '', note: '', alt: [], chunks: [], skip: false
    });
    shiftStarts(function (x) { return x >= at ? x + 1 : x; });
    renderLines(); renderWords(); renderSpeakers(); updateStats();
  }

  function indexOfSpeaker(id) {
    var idx = 0;
    state.topic.speakers.forEach(function (s, i) { if (s.id === id) idx = i; });
    return idx;
  }

  function removeLine(i) {
    var t = state.topic;
    if (t.lines.length <= 1) return;
    t.lines.splice(i, 1);
    shiftStarts(function (x) { return x > i ? x - 1 : x; });
    renderLines(); renderWords(); renderSpeakers(); updateStats();
  }

  function moveLine(i, dir) {
    var t = state.topic;
    var j = i + dir;
    if (j < 0 || j >= t.lines.length) return;
    var tmp = t.lines[i]; t.lines[i] = t.lines[j]; t.lines[j] = tmp;
    renderLines(); updateStats();
  }

  // カーソル位置で割る。カーソルが無ければ文の切れ目、それも無ければ中央。
  function splitPoint(en, pos) {
    if (pos > 0 && pos < en.length) {
      var p = pos;
      while (p > 0 && !/\s/.test(en.charAt(p - 1))) p--;
      if (p > 0 && p < en.length) return p;
    }
    var m = /[.!?]["')\]]?\s+/.exec(en);
    if (m) {
      var at = m.index + m[0].length;
      if (at > 0 && at < en.length) return at;
    }
    var words = en.split(/\s+/);
    if (words.length < 2) return -1;
    return words.slice(0, Math.ceil(words.length / 2)).join(' ').length + 1;
  }

  function splitLine(i) {
    var U = ui();
    var t = state.topic;
    var l = t.lines[i];
    var ta = rowEls[i] && rowEls[i].__enTa;
    var pos = ta ? ta.selectionStart : 0;
    var p = splitPoint(l.en, pos);
    if (p < 0) { U.toast('この行は分割できません'); return; }

    var a = l.en.slice(0, p).trim();
    var b = l.en.slice(p).trim();
    if (!a || !b) { U.toast('この行は分割できません'); return; }

    l.en = a;
    l.chunks = EST.schema.splitChunks(a);
    t.lines.splice(i + 1, 0, {
      id: nextLineId(), speakerId: l.speakerId, en: b, ja: '', note: '',
      alt: [], chunks: EST.schema.splitChunks(b), skip: false
    });
    shiftStarts(function (x) { return x > i ? x + 1 : x; });
    renderLines(); renderWords(); updateStats();
    U.toast('和訳は前の行に残しました');
  }

  function mergeLine(i) {
    var t = state.topic;
    if (i >= t.lines.length - 1) return;
    var a = t.lines[i], b = t.lines[i + 1];
    a.en = (a.en + ' ' + b.en).trim();
    a.ja = [a.ja, b.ja].filter(Boolean).join('');
    a.note = [a.note, b.note].filter(Boolean).join(' / ');
    a.chunks = EST.schema.splitChunks(a.en);
    t.lines.splice(i + 1, 1);
    shiftStarts(function (x) { return x > i + 1 ? x - 1 : x; });
    renderLines(); renderWords(); updateStats();
  }

  /* ---- ブロック境界 ------------------------------------------------------ */
  function addBoundary() {
    var U = ui();
    var t = state.topic;
    if (t.lines.length < 2) { U.toast('行が足りません'); return; }
    var s = state.starts.slice();
    if (!s.length) s = [0];
    // いちばん長いブロックの真ん中に足す
    var bestAt = -1, bestLen = 1;
    s.forEach(function (start, i) {
      var end = (i + 1 < s.length ? s[i + 1] : t.lines.length);
      var len = end - start;
      if (len > bestLen) { bestLen = len; bestAt = start + Math.floor(len / 2); }
    });
    if (bestAt < 1) { U.toast('これ以上分けられません'); return; }
    s.push(bestAt);
    state.starts = s;
    fixStarts();
    renderLines(); updateStats();
  }

  function removeBoundary(bi) {
    if (bi < 1) return;
    state.starts.splice(bi, 1);
    state.blockLabels.splice(bi, 1);
    fixStarts();
    renderLines(); updateStats();
  }

  function moveBoundary(bi, to) {
    var U = ui();
    var n = state.topic.lines.length;
    to = Math.min(Math.max(to, 1), n - 1);
    if (bi < 1 || bi >= state.starts.length) return;
    if (state.starts[bi] === to) return;
    if (state.starts.indexOf(to) >= 0) { U.toast('そこには既に境界があります'); return; }
    var label = state.blockLabels[bi];
    state.starts[bi] = to;
    // 並べ替えたあともラベルが同じブロックに付いてくるように入れ直す
    var pairs = state.starts.map(function (x, i) { return { s: x, l: i === bi ? label : state.blockLabels[i] }; });
    pairs.sort(function (a, b) { return a.s - b.s; });
    state.starts = pairs.map(function (p) { return p.s; });
    state.blockLabels = pairs.map(function (p) { return p.l; });
    fixStarts();
    renderLines(); updateStats();
  }

  function startDrag(bi, ev, divEl) {
    ev.preventDefault();
    var target = state.starts[bi];
    divEl.classList.add('is-dragging');

    function onMove(e) {
      var g = gapFromY(e.clientY);
      if (g === null) return;
      target = g;
      highlight(g);
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      divEl.classList.remove('is-dragging');
      clearHighlight();
      moveBoundary(bi, target);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // 指の位置にいちばん近い「行の上端」を境界候補にする
  function gapFromY(y) {
    var best = null, bestD = Infinity;
    for (var i = 1; i < rowEls.length; i++) {
      if (!rowEls[i]) continue;
      var d = Math.abs(rowEls[i].getBoundingClientRect().top - y);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function highlight(i) {
    clearHighlight();
    if (rowEls[i]) rowEls[i].classList.add('is-drop');
  }
  function clearHighlight() {
    rowEls.forEach(function (r) { if (r) r.classList.remove('is-drop'); });
  }

  /* ---- 語彙 -------------------------------------------------------------- */
  function renderWords() {
    var U = ui();
    var t = state.topic;
    if (!t.words.length) {
      U.mount(elWords, h('div', { class: 'tiny muted', text: 'まだ語彙がありません。' }));
      return;
    }
    U.mount(elWords, t.words.map(function (w, i) { return wordRow(w, i); }));
  }

  function wordRow(w, i) {
    var t = state.topic;

    var idsBox = h('div', { class: 'word-row__ids' });
    drawIds();

    var lineSel = h('select', { style: { maxWidth: '11rem' } },
      t.lines.map(function (l, li) {
        var label = (li + 1) + ': ' + (l.en || '(空)').slice(0, 24);
        return h('option', { value: l.id }, label);
      })
    );

    return h('div', { class: 'word-row' }, [
      h('div', { class: 'word-row__grid' }, [
        h('input', { type: 'text', class: 'en', value: w.en, placeholder: '英語',
          onInput: function (e) { w.en = e.target.value; } }),
        h('input', { type: 'text', value: w.ja, placeholder: '意味',
          onInput: function (e) { w.ja = e.target.value; } }),
        h('div', { class: 'row row--tight' }, [
          h('select', { style: { width: 'auto' }, onChange: function (e) { w.type = e.target.value; } }, [
            h('option', { value: 'word', selected: w.type === 'word' }, '語'),
            h('option', { value: 'phrase', selected: w.type === 'phrase' }, '句')
          ]),
          h('button', {
            class: 'btn btn--icon btn--danger', text: '✕',
            onClick: function () { t.words.splice(i, 1); renderWords(); updateStats(); }
          })
        ])
      ]),
      h('div', { class: 'row row--tight', style: { marginTop: '.3rem' } }, [
        h('span', { class: 'tiny muted', text: '出てくる行' }),
        lineSel,
        h('button', {
          class: 'btn btn--sm', text: '＋',
          onClick: function () {
            var id = lineSel.value;
            if (id && w.lineIds.indexOf(id) < 0) { w.lineIds.push(id); drawIds(); }
          }
        })
      ]),
      idsBox
    ]);

    function drawIds() {
      var chips = w.lineIds.map(function (id) {
        var no = 0;
        t.lines.forEach(function (l, li) { if (l.id === id) no = li + 1; });
        return h('button', {
          class: 'chip chip--btn', title: 'この行との紐づけを外す',
          onClick: function () {
            w.lineIds = w.lineIds.filter(function (x) { return x !== id; });
            drawIds();
          }
        }, [no ? (no + '行目') : id, ' ×']);
      });
      if (!chips.length) chips = [h('span', { class: 'tiny muted', text: '（紐づけなし）' })];
      ui().mount(idsBox, chips);
    }
  }

  function addWord() {
    state.topic.words.push({ id: nextWordId(), en: '', ja: '', type: 'word', lineIds: [], note: '' });
    renderWords();
    updateStats();
  }

  function nextWordId() {
    var max = 0;
    state.topic.words.forEach(function (w) {
      var m = /^w_(\d+)$/.exec(w.id || '');
      if (m) max = Math.max(max, Number(m[1]));
    });
    return 'w_' + EST.schema.pad3(max + 1);
  }

  /* ---- 統計行（§6.2 上部に常時表示） ------------------------------------ */
  function updateStats() {
    var U = ui();
    var t = state.topic;
    var sec = EST.schema.lapSeconds(t.lines);
    var blocks = state.starts.length || 1;
    U.mount(elStats, [
      h('span', {}, ['1周 約', h('b', { text: U.fmtSeconds(sec) })]),
      h('span', {}, [h('b', { text: String(t.lines.length) }), '行']),
      h('span', {}, [h('b', { text: String(blocks) }), 'ブロック']),
      h('span', {}, ['語彙 ', h('b', { text: String(t.words.length) }), '個'])
    ]);
  }

  /* ---- 保存・破棄 -------------------------------------------------------- */
  function save() {
    var U = ui();
    var t = state.topic;
    t.blocks = EST.schema.startsToBlocks(state.starts, t.lines, state.blockLabels);

    // §6.3: audience も myRole と同じく編集画面からの保存では必須にする。
    var v = EST.schema.validateTopic(t, { requireMyRole: true, requireAudience: true });
    if (v.errors.length) { U.alert('保存できません', v.errors); return; }

    var ask = Promise.resolve('save');
    if (state.isNew) {
      ask = EST.store.get('topics', t.id).then(function (exist) {
        if (!exist) return 'save';
        // §6.3 手順3: id重複は「上書き / 別トピックとして追加 / 中止」を選ばせる
        return U.choose('同じIDのトピックがあります',
          '既に「' + (exist.title || '無題') + '」が同じIDで保存されています。',
          [
            { label: '中止', value: 'cancel' },
            { label: '別トピックとして追加', value: 'dup' },
            { label: '上書き', value: 'save', kind: 'danger' }
          ]);
      });
    }

    ask.then(function (mode) {
      if (!mode || mode === 'cancel') return;
      if (mode === 'dup') t.id = EST.schema.newTopicId();
      var norm = EST.schema.normalizeTopic(t);
      return EST.store.put('topics', norm)
        .then(function () { return EST.backup.snapshot('保存: ' + norm.title); })
        .then(function () {
          state = null;
          var msg = v.warnings.length ? '保存しました（注意 ' + v.warnings.length + '件）' : '保存しました';
          // 相手用にした台本は自分の一覧に出ないので、詳細へ飛ばさずホームへ戻す
          if (!EST.profile.canSee(norm)) {
            U.toast(msg + '。' + EST.profile.audienceLabel(norm.audience) + 'なので自分の一覧には出ません');
            location.hash = '#/';
            return;
          }
          U.toast(msg);
          location.hash = '#/topic/' + encodeURIComponent(norm.id);
        });
    }).catch(function (e) {
      U.alert('保存に失敗しました', [String(e && e.message || e)]);
    });
  }

  function discard() {
    ui().confirm('編集を破棄', '編集中の内容は保存されません。', '破棄する', 'danger').then(function (ok) {
      if (!ok) return;
      var wasNew = state.isNew, id = state.topic.id, seen = EST.profile.canSee(state.topic);
      state = null;
      location.hash = (wasNew || !seen) ? '#/' : ('#/topic/' + encodeURIComponent(id));
    });
  }

  EST.uiImport = {
    renderImport: renderImport,
    renderEditor: renderEditor,
    openEditor: openEditor,
    hasDraft: function () { return !!state; }
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 13-ui-settings.js ---- */
/* =====================================================================
   13-ui-settings.js — 設定とバックアップ（SPEC §5.7 / §6.4）
   F1 の時点で意味を持つ設定（テーマ・文字サイズ）と、
   データを守るためのバックアップ操作だけを出す。
   音声・マイクの設定は該当フェーズ（F3・F4）で足す。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var h = null;
  function ui() { h = EST.ui.h; return EST.ui; }

  function render(view) {
    var U = ui();
    // 前回このカードでマイクのテストを起動したままだったら止める
    if (stopActiveMicTest) { stopActiveMicTest(); stopActiveMicTest = null; }
    EST.app.setBar('設定', []);

    var box = h('div', {});
    U.mount(view, box);

    EST.store.loadSettings().then(function (s) {
      U.mount(box, [
        profileCard(),
        displayCard(s),
        speechCard(s),
        micCard(s),
        listModeCard(s),
        EST.profile.canEdit() ? publishCard() : null,
        backupCard(),
        autoBackupCard(),
        EST.profile.canEdit() ? sampleCard() : null,
        infoCard(s),
        dangerCard()
      ]);
    });
  }

  /* ---- プロフィール（部屋）§5.9 ------------------------------------------ */
  function profileCard() {
    var U = ui();
    var cur = EST.profile.get();
    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: '部屋' }),
      h('div', { class: 'small muted', text: '台本は「誰の台本か」で振り分けられ、練習の記録は部屋ごとに完全に分かれます。相手の記録は見えません。' }),
      h('div', { class: 'row', style: { marginTop: '.5rem' } }, EST.profile.all().map(function (p) {
        return h('button', {
          class: 'btn' + (p.id === cur ? ' btn--primary' : ''),
          text: p.label + '（' + p.sub + '）',
          onClick: function () {
            if (p.id === cur) return;
            U.confirm('部屋を切り替える', p.label + 'の部屋に切り替えます。練習の記録は部屋ごとに別々です。', '切り替える')
              .then(function (ok) {
                if (!ok) return;
                EST.profile.set(p.id);
                location.hash = '#/';
                location.reload();   // 設定も進捗も読み直しになるので、まるごと再起動する
              });
          }
        });
      }))
    ]);
  }

  /* ---- 配信（タモやんのみ）§6.5 ------------------------------------------ */
  function publishCard() {
    var U = ui();
    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: '台本の配信' }),
      h('div', { class: 'small muted', text:
        'いまアプリに入っている台本を scripts.json として書き出します。これを data/scripts.json に置いて push すると、次にまりが開いたときに反映されます。' }),
      h('div', { class: 'row', style: { marginTop: '.5rem' } }, [
        h('button', {
          class: 'btn btn--primary', text: '配信用に書き出す',
          onClick: function () {
            EST.publish.exportFeedFile().then(function (feed) {
              U.toast(feed.topics.length + '本を書き出しました');
            });
          }
        }),
        h('button', {
          class: 'btn', text: 'いま配信を取りに行く',
          onClick: function () {
            EST.publish.sync().then(function (r) {
              if (!r) { U.toast('更新はありませんでした'); return; }
              U.toast('台本を更新しました');
              location.hash = '#/';
              EST.app.route();
            });
          }
        })
      ])
    ]);
  }

  /* ---- 表示 -------------------------------------------------------------- */
  function displayCard(s) {
    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: '表示' }),
      h('div', { class: 'setting-row' }, [
        h('div', { class: 'setting-row__label' }, [
          'テーマ',
          h('div', { class: 'setting-row__sub', text: '「端末に合わせる」なら夜は自動で暗くなります' })
        ]),
        h('select', {
          onChange: function (e) {
            s.theme = e.target.value;
            EST.store.saveSettings(s).then(function () { EST.app.applyTheme(s); });
          }
        }, [
          h('option', { value: 'auto', selected: s.theme === 'auto' }, '端末に合わせる'),
          h('option', { value: 'light', selected: s.theme === 'light' }, '明るい'),
          h('option', { value: 'dark', selected: s.theme === 'dark' }, '暗い')
        ])
      ]),
      h('div', { class: 'setting-row' }, [
        h('div', { class: 'setting-row__label' }, [
          '文字サイズ',
          h('div', { class: 'setting-row__sub', text: '音読中に見やすい大きさに合わせてください' })
        ]),
        h('select', {
          onChange: function (e) {
            s.fontScale = Number(e.target.value);
            EST.store.saveSettings(s).then(function () { EST.app.applyTheme(s); });
          }
        }, [0.9, 1.0, 1.1, 1.25, 1.4].map(function (v) {
          return h('option', { value: String(v), selected: Number(s.fontScale) === v }, Math.round(v * 100) + '%');
        }))
      ])
    ]);
  }

  // §7.5 の5段に、いまの値が含まれないときだけそれを足す。
  // 既定は §5.7 で 0.85（5段に含まれる）に直ったが、それ以前の 0.95 のまま
  // 保存されている端末があるので、開いただけで速度が黙って変わらないよう残す。
  function rateOptions(cur) {
    var steps = EST.speech.RATE_STEPS.slice();
    if (steps.indexOf(cur) < 0 && isFinite(cur) && cur > 0) steps.push(cur);
    steps.sort(function (a, b) { return a - b; });
    return steps.map(function (v) {
      return h('option', { value: String(v), selected: cur === v }, v.toFixed(2) + '倍');
    });
  }

  /* ---- 音声 §7.2 / §7.5 --------------------------------------------------- */
  function speechCard(s) {
    var U = ui();
    // 使えない環境では設定ごと出さない（CLAUDE.md: ダイアログを出さず機能を隠す）
    if (!EST.speech.isAvailable()) {
      return h('div', { class: 'card' }, [
        h('h2', { class: 'card__title', text: '音声' }),
        h('div', { class: 'small muted', text: 'この端末では音声読み上げが使えません。' })
      ]);
    }

    var body = h('div', { class: 'small muted', text: 'ボイスを読み込み中…' });

    EST.speech.getVoices().then(function (voices) {
      if (!voices.length) {
        U.mount(body, h('div', { class: 'small muted', text: '英語のボイスが見つかりませんでした。端末に英語の音声を追加すると使えるようになります。' }));
        return;
      }
      s.localVoiceByGender = s.localVoiceByGender || { female: null, male: null };

      // §7.2 話者ごとに声を変える。自動割り当ての結果を見せたうえで、手で選び直せるようにする。
      function voiceRow(label, key, gender) {
        var auto = EST.speech.resolveVoiceFor(gender);
        var autoName = auto && auto.voice ? auto.voice.name : '（なし）';
        var cur = key === 'def' ? (s.localVoiceEn || '') : (s.localVoiceByGender[key] || '');
        var sel = h('select', {
          onChange: function (e) {
            var v = e.target.value || null;
            if (key === 'def') s.localVoiceEn = v;
            else s.localVoiceByGender[key] = v;
            EST.store.saveSettings(s).then(function () { EST.speech.applySettings(s); });
          }
        }, [h('option', { value: '', selected: !cur }, '自動（' + autoName + '）')].concat(
          voices.map(function (v) {
            var g = v.gender === 'female' ? '女性' : (v.gender === 'male' ? '男性' : '不明');
            return h('option', { value: v.id, selected: cur === v.id }, v.name + '（' + g + '）');
          })
        ));
        return h('div', { class: 'setting-row' }, [
          h('div', { class: 'setting-row__label' }, [
            label,
            auto && auto.degraded
              ? h('div', { class: 'setting-row__sub', text: '別々のボイスが取れないので、声の高さをずらして区別しています' })
              : null
          ]),
          h('div', { class: 'row row--tight' }, [
            sel,
            h('button', {
              class: 'btn btn--sm', text: '試聴',
              onClick: function () {
                EST.speech.speak('Good morning. May I see your passport, please?', { gender: gender });
              }
            })
          ])
        ]);
      }

      U.mount(body, [
        voiceRow('女性の話者', 'female', 'female'),
        voiceRow('男性の話者', 'male', 'male'),
        voiceRow('性別の指定がない話者', 'def', '')
      ]);
    });

    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: '音声' }),
      h('div', { class: 'setting-row' }, [
        h('div', { class: 'setting-row__label' }, [
          '読み上げの速さ',
          h('div', { class: 'setting-row__sub', text: 'シャドーイングで速くしたいときに使います' })
        ]),
        h('select', {
          onChange: function (e) {
            s.ttsRate = Number(e.target.value);
            EST.store.saveSettings(s).then(function () { EST.speech.applySettings(s); });
          }
        }, rateOptions(Number(s.ttsRate)))
      ]),
      body
    ]);
  }

  /* ---- マイク §2.1〜§2.5 ---------------------------------------------------
     練習画面（F5）の「常時置く再較正ボタン」ではなく、実機で単体確認する
     ための診断パネル。較正・音量バー・onset/offsetのログを見られる。 */
  var stopActiveMicTest = null;   // 設定画面を離れるときに確実に止めるため

  // マイクが使えない理由をユーザーに伝える。「許可が必要」は一度拒否すると
  // JS側からは二度とネイティブの許可ダイアログを出せない（iOS/ブラウザ共通の
  // 仕様）ので、2.2秒で消えるトーストではなく消えずに残るダイアログで
  // 手動での直し方まで示す。
  function explainMicError(err) {
    var U = ui();
    var reason = err && err.reason;
    if (reason === 'denied') {
      U.alert('マイクを使うには', [
        'このサイトのマイクが「許可しない」になっています。',
        'iPhone: 設定 → Safari → マイク で確認・変更できます。',
        'または、Safariでこのページを開いた状態でアドレスバーの「ⓘ」→「Webサイトの設定」からも変更できます。',
        '変更したら、このページを開き直してください。'
      ]);
    } else if (reason === 'no-device') {
      U.alert('マイクが見つかりません', ['マイクが接続された端末で開いてください。']);
    } else if (reason === 'unsupported') {
      U.alert('この端末では使えません', ['この端末・ブラウザはマイクの機能に対応していません。']);
    } else {
      U.alert('マイクを使えませんでした', [String(err && err.message || err || '不明なエラーです')]);
    }
  }

  function micCard(s) {
    var U = ui();
    if (!EST.mic.isSupported()) {
      return h('div', { class: 'card' }, [
        h('h2', { class: 'card__title', text: 'マイク' }),
        h('div', { class: 'small muted', text: 'この端末ではマイクが使えません。' })
      ]);
    }

    var statusBox = h('div', { class: 'small muted', text: '確認中…' });
    var meterFill = h('div', { class: 'mic-meter__fill' });
    var logBox = h('div', { class: 'mic-log' });
    var logLines = [];
    var testing = false;
    var testBtn;

    function refreshStatus() {
      EST.store.loadSettings().then(function (cur) {
        var m = cur.mic || {};
        U.mount(statusBox, m.calibratedAt
          ? h('span', { text: '最終較正: ' + U.fmtDate(m.calibratedAt) })
          : h('span', { text: '未較正（既定値で動作しています）' }));
      });
    }
    refreshStatus();

    function pushLog(line) {
      logLines.unshift(line);
      logLines = logLines.slice(0, 10);
      U.mount(logBox, logLines.map(function (l) { return h('div', { class: 'tiny muted', text: l }); }));
    }

    var onLevel, onOnset, onOffset, onRep, onStall, onTimeout;

    function stopTest() {
      if (!testing) return;
      // stop() が全リスナーを解除するが、off しておくほうが意図が明確
      EST.mic.off('level', onLevel);
      EST.mic.off('onset', onOnset);
      EST.mic.off('offset', onOffset);
      EST.mic.off('rep', onRep);
      EST.mic.off('stall', onStall);
      EST.mic.off('timeout', onTimeout);
      EST.mic.stop();
      testing = false;
      stopActiveMicTest = null;
      testBtn.textContent = '発話を試す';
      meterFill.style.width = '0%';
    }

    function startTest() {
      EST.mic.start().then(function () {
        testing = true;
        stopActiveMicTest = stopTest;
        testBtn.textContent = '停止';
        onLevel = EST.mic.on('level', function (e) {
          meterFill.style.width = Math.min(100, Math.round(e.rms * 300)) + '%';
        });
        onOnset = EST.mic.on('onset', function () { pushLog('onset'); });
        onOffset = EST.mic.on('offset', function (e) { pushLog('offset durationMs=' + e.durationMs); });
        // §2.2 「1回」が確定したときのイベント。markCue()を打っていなければ
        // latencyMs は null になる（§2.8）。
        onRep = EST.mic.on('rep', function (e) {
          pushLog('rep spokenMs=' + e.spokenMs
            + ' latencyMs=' + (e.latencyMs == null ? '-' : e.latencyMs)
            + ' 区間' + e.segments.length + ' 詰まり' + e.stalls.length);
        });
        onStall = EST.mic.on('stall', function (e) { pushLog('stall elapsedMs=' + e.elapsedMs); });
        onTimeout = EST.mic.on('timeout', function () { pushLog('timeout（発話なし）'); });
      }).catch(function (err) { explainMicError(err); });
    }

    testBtn = h('button', {
      class: 'btn btn--sm', text: '発話を試す',
      onClick: function () { testing ? stopTest() : startTest(); }
    });

    var ratioInput = h('input', {
      type: 'number', step: '0.05', min: '0.1', max: '1',
      value: String(s.countRatio || EST.stage.COUNT_RATIO_DEFAULT), style: { width: '5rem' },
      onChange: function (e) {
        var v = Number(e.target.value);
        if (!isFinite(v) || v <= 0 || v > 1) {
          e.target.value = String(s.countRatio || EST.stage.COUNT_RATIO_DEFAULT);
          return;
        }
        s.countRatio = v;
        EST.store.saveSettings(s);
      }
    });

    // §2.4 レイテンシを測るには t0 が要る。試験中に手で打てるようにしておく。
    var cueBtn = h('button', {
      class: 'btn btn--sm', text: 'キューを打つ',
      onClick: function () {
        if (!testing) { U.toast('先に「発話を試す」を押してください'); return; }
        EST.mic.markCue();
        pushLog('markCue');
      }
    });

    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: 'マイク' }),
      statusBox,
      h('div', { class: 'row row--tight', style: { marginTop: '.5rem' } }, [
        h('button', {
          class: 'btn btn--sm', text: '較正する',
          onClick: function () {
            // ボタンを押した直後に間を置かずマイクを要求する。確認ダイアログを
            // 挟んで許可が下りてから較正を始める形にすると、iOSでは
            // ユーザー操作からの猶予が切れて許可ダイアログが機能しないことが
            // あるため、静かにしてくださいの案内はトースト（非ブロッキング）にする。
            U.toast('1.5秒間、静かにしてください…');
            EST.mic.calibrate().then(function (r) {
              refreshStatus();
              U.toast('較正しました');
            }).catch(function (err) { explainMicError(err); });
          }
        }),
        testBtn,
        cueBtn
      ]),
      h('div', { class: 'mic-meter', style: { marginTop: '.5rem' } }, [meterFill]),
      logBox,
      h('div', { class: 'tiny muted', style: { marginTop: '.4rem' },
        text: 'キューを打たずに喋っても「1回」は確定します（そのとき latencyMs は空欄）。' }),
      // §2.3 / §11 F5 カウント成立の比率。§1.2 の進級条件もこの1つだけを使う。
      h('div', { class: 'setting-row' }, [
        h('div', { class: 'setting-row__label' }, [
          'カウント成立の比率',
          h('div', { class: 'setting-row__sub',
            text: '発話が想定の何割あれば1回と数えるか（既定0.55）。進級条件もこの値を使います' })
        ]),
        ratioInput
      ])
    ]);
  }

  /* ---- 一覧モード §4.1 ---------------------------------------------------- */
  function listModeCard(s) {
    var U = ui();
    var row = h('div', { class: 'row row--tight' });
    function draw() {
      U.mount(row, [
        h('button', {
          class: 'btn btn--sm' + (s.recordOpens ? ' btn--primary' : ''),
          text: 'ON',
          onClick: function () { s.recordOpens = true; EST.store.saveSettings(s).then(draw); }
        }),
        h('button', {
          class: 'btn btn--sm' + (!s.recordOpens ? ' btn--primary' : ''),
          text: 'OFF',
          onClick: function () { s.recordOpens = false; EST.store.saveSettings(s).then(draw); }
        })
      ]);
    }
    draw();
    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: '一覧モード' }),
      h('div', { class: 'setting-row' }, [
        h('div', { class: 'setting-row__label' }, [
          '開いた行を復習に回す',
          h('div', { class: 'setting-row__sub', text: '一覧モードでタップして開いた行を「思い出せなかった」として記録します' })
        ]),
        row
      ])
    ]);
  }

  /* ---- バックアップ ------------------------------------------------------- */
  function backupCard() {
    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: 'バックアップ' }),
      // §5.9 まりは自分の進捗だけ。台本は配信で届くのでバックアップに含めない。
      h('div', { class: 'small muted', text: EST.profile.canEdit()
        ? '全トピックと進捗と設定を1つのJSONにまとめます。音声キャッシュは再生成できるので含めません。'
        : 'あなたの練習の記録と設定をJSONにまとめます。台本は配信で届くので含めません。' }),
      h('div', { class: 'row', style: { marginTop: '.5rem' } }, [
        h('button', { class: 'btn btn--primary', text: '書き出す', onClick: doExport }),
        h('button', { class: 'btn', text: 'ファイルから復元', onClick: doImport })
      ])
    ]);
  }

  function doExport() {
    var U = ui();
    EST.backup.exportAllText().then(function (text) {
      var d = new Date();
      var p = function (n) { return ('0' + n).slice(-2); };
      var name = 'est-backup-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
      U.download(name, text);
      U.toast('書き出しました');
    });
  }

  function doImport() {
    var U = ui();
    U.pickFile('.json,application/json').then(function (f) {
      if (!f) return;
      var r = EST.schema.parseJsonWithPosition(f.text);
      if (!r.ok) {
        U.alert('JSONとして読めませんでした', [r.error, r.where ? ('位置: ' + r.where) : '']);
        return;
      }
      var data = r.value;
      if (!data || data.kind !== EST.backup.BACKUP_KIND) {
        U.alert('復元できません', ['このファイルはこのアプリのバックアップではないようです。']);
        return;
      }
      // まりのバックアップには topics が入っていない（§5.9）
      var summary = Array.isArray(data.topics)
        ? ('トピック ' + data.topics.length + '件')
        : ('練習の記録 ' + ((data.progress || []).length + (data.topicProgress || []).length) + '件');
      U.choose('復元のしかた',
        summary + '。上書きすると今のデータは消えます。',
        [
          { label: '中止', value: null },
          { label: 'マージ（同じidは新しい方）', value: 'merge' },
          { label: '上書き', value: 'overwrite', kind: 'danger' }
        ]
      ).then(function (mode) {
        if (!mode) return;
        return EST.backup.importAll(data, mode).then(function () {
          U.toast('復元しました');
          location.hash = '#/';
          location.reload();
        });
      }).catch(function (e) {
        U.alert('復元に失敗しました', [String(e && e.message || e)]);
      });
    });
  }

  function autoBackupCard() {
    var U = ui();
    var box = h('div', { class: 'small muted', text: '読み込み中…' });
    EST.backup.listAuto().then(function (list) {
      if (!list.length) {
        U.mount(box, h('div', { class: 'small muted', text: 'まだありません。トピックを保存すると自動で作られます。' }));
        return;
      }
      U.mount(box, list.map(function (b) {
        return h('div', { class: 'setting-row' }, [
          h('div', { class: 'setting-row__label' }, [
            U.fmtDate(b.at),
            h('div', { class: 'setting-row__sub', text: (b.label || '') + '　' + U.fmtBytes(b.size || 0) })
          ]),
          h('button', {
            class: 'btn btn--sm', text: 'ここへ戻す',
            onClick: function () {
              U.confirm('自動バックアップから戻す', U.fmtDate(b.at) + ' の状態に戻します。今のデータは上書きされます。', '戻す', 'danger')
                .then(function (ok) {
                  if (!ok) return;
                  return EST.backup.restoreAuto(b.index, 'overwrite').then(function () {
                    U.toast('戻しました');
                    location.reload();
                  });
                });
            }
          })
        ]);
      }));
    });

    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: '自動バックアップ（直近' + EST.backup.AUTO_KEEP + '世代）' }),
      box
    ]);
  }

  /* ---- サンプル ----------------------------------------------------------- */
  function sampleCard() {
    var U = ui();
    var n = (EST.SAMPLES || []).length;
    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: 'サンプル台本' }),
      h('div', { class: 'small muted', text: n
        ? ('短い台本と長い台本の ' + n + '本を入れ直します。同じIDのものは上書きされます。')
        : 'このビルドにはサンプルが含まれていません。' }),
      h('button', {
        class: 'btn', style: { marginTop: '.5rem' }, text: 'サンプルを入れ直す', disabled: !n,
        onClick: function () {
          EST.app.seedSamples(true).then(function (cnt) {
            U.toast(cnt + '本を入れ直しました');
          });
        }
      })
    ]);
  }

  /* ---- 情報 --------------------------------------------------------------- */
  function infoCard(s) {
    var U = ui();
    var box = h('div', { class: 'small muted', text: '集計中…' });
    Promise.all([
      EST.store.getAll('topics'),
      EST.store.getAll('progress'),
      EST.store.getAll('topicProgress')
    ]).then(function (r) {
      var rows = [
        '部屋 ' + EST.profile.label() + '（' + EST.profile.get() + '）',
        'トピック ' + r[0].length + '件',
        '行の進捗 ' + r[1].length + '件',
        'トピックの進捗 ' + r[2].length + '件',
        'データベース ' + EST.store.DB_NAME + ' v' + EST.store.DB_VERSION
      ];
      // §10.1 file:// ではマイクとService Workerが使えない。F4以降で効いてくるので今から出しておく。
      if (location.protocol === 'file:') {
        rows.push('※ file:// で開いています。マイク自動カウントを使うにはWeb配信（HTTPS）が必要です。');
      }
      U.mount(box, rows.map(function (t) { return h('div', { text: t }); }));
    });

    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: '情報' }),
      box,
      h('div', { class: 'tiny muted', style: { marginTop: '.4rem' },
        text: '音声・マイク・練習の設定は F3〜F5 で追加されます。' })
    ]);
  }

  /* ---- 危険な操作 ---------------------------------------------------------- */
  function dangerCard() {
    var U = ui();
    // §5.9 まりは共有の台本を消せない。自分の記録だけを消す。
    var full = EST.profile.canEdit();
    var label = full ? '全データを削除' : 'わたしの記録を削除';
    var detail = full
      ? 'トピック・進捗・設定・自動バックアップをすべて消します。'
      : 'あなたの練習の記録と設定だけを消します。台本は残ります。';
    return h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: 'データを消す' }),
      h('div', { class: 'small muted', text: '先にバックアップを書き出しておいてください。元に戻せません。' }),
      h('button', {
        class: 'btn btn--danger', style: { marginTop: '.5rem' }, text: label,
        onClick: function () {
          U.confirm(label, detail, '削除する', 'danger')
            .then(function (ok) {
              if (!ok) return;
              return (full ? EST.backup.wipeAll() : EST.backup.wipeProfile()).then(function () {
                U.toast('削除しました');
                location.hash = '#/';
                location.reload();
              });
            });
        }
      })
    ]);
  }

  EST.uiSettings = { render: render };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 14-ui-list.js ---- */
/* =====================================================================
   14-ui-list.js — 一覧モード（SPEC §4.1）
   和訳だけを縦に並べ、タップすると英文が下に開く。「思い出せなかった」を
   1行ずつ開いたときだけ記録する（§5.5）。音声再生（🔊）はF3の内蔵TTSが
   入ってから追加する。ここでは開閉とテキスト書き出しだけを扱う。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var h = null;
  function ui() { h = EST.ui.h; return EST.ui; }

  // 画面ごとの一時状態。ページを離れたらリセットしてよい。
  var view = {
    topic: null,
    settings: null,
    direction: 'ja',      // 'ja' = 和文が主表示 / 'en' = 英文が主表示
    tab: 'lines',         // 'lines' | 'words'
    openLines: {},
    openWords: {}
  };

  var linesBox = null, tabsBox = null, controlsBox = null;

  function renderList(root, id) {
    var U = ui();
    EST.store.get('topics', id).then(function (t) {
      if (!t) {
        EST.app.setBar('一覧', []);
        U.mount(root, h('div', { class: 'empty', text: 'このトピックは見つかりませんでした。' }));
        return;
      }
      // §5.9 自分の部屋の台本でなければ一覧モードにも入らせない（トピック詳細と同じ扱い）
      if (!EST.profile.canSee(t)) {
        location.hash = EST.profile.canEdit() ? ('#/edit/' + encodeURIComponent(t.id)) : '#/';
        return;
      }

      view = { topic: t, settings: null, direction: 'ja', tab: t.lines.length ? 'lines' : 'words', openLines: {}, openWords: {} };

      EST.app.setBar(t.title || '(無題)', [
        h('button', { class: 'btn btn--sm', text: 'トピックへ', onClick: function () { location.hash = '#/topic/' + encodeURIComponent(t.id); } })
      ]);

      build(root);

      EST.store.loadSettings().then(function (s) {
        view.settings = s;
      });
    });
  }

  function build(root) {
    var U = ui();
    var t = view.topic;

    controlsBox = h('div', { class: 'row row--tight', style: { marginBottom: '.5rem' } });
    tabsBox = h('div', { class: 'row row--tight', style: { marginBottom: '.6rem' } });
    linesBox = h('div', {});

    U.mount(root, [
      h('div', { class: 'card' }, [
        controlsBox,
        tabsBox,
        linesBox
      ]),
      h('div', { class: 'card' }, [
        h('h2', { class: 'card__title', text: '書き出し' }),
        h('div', { class: 'row row--tight' }, [
          h('button', { class: 'btn btn--sm', text: 'テキストで書き出す', onClick: function () { exportAs('text'); } }),
          h('button', { class: 'btn btn--sm', text: 'Markdownで書き出す', onClick: function () { exportAs('md'); } })
        ]),
        h('div', { class: 'tiny muted', style: { marginTop: '.3rem' }, text: '語彙一覧の書き出しはF6で追加します。' })
      ])
    ]);

    if (!t.lines.length) view.tab = 'words';
    drawControls();
    drawTabs();
    drawLines();
  }

  /* ---- 上部の操作（反転トグル・全部開く） -------------------------------- */
  function drawControls() {
    var U = ui();
    var allOpen = isAllOpenInActiveTab();
    U.mount(controlsBox, [
      h('button', {
        class: 'btn btn--sm', text: view.direction === 'ja' ? '和→英 ⇄' : '英→和 ⇄',
        onClick: function () { view.direction = view.direction === 'ja' ? 'en' : 'ja'; drawLines(); }
      }),
      h('button', {
        class: 'btn btn--sm', text: allOpen ? '全部閉じる' : '全部開く',
        onClick: toggleAll
      })
    ]);
  }

  function activeItems() {
    return view.tab === 'lines' ? visibleLines() : (view.topic.words || []);
  }
  function activeOpenSet() {
    return view.tab === 'lines' ? view.openLines : view.openWords;
  }
  function itemKey(item) { return view.tab === 'lines' ? item.id : item.id; }

  function isAllOpenInActiveTab() {
    var items = activeItems();
    if (!items.length) return false;
    var set = activeOpenSet();
    return items.every(function (it) { return !!set[itemKey(it)]; });
  }

  // 「全部開く」は一括で目を通す操作なので、§5.5 の openedCount は増やさない
  function toggleAll() {
    var items = activeItems();
    var set = activeOpenSet();
    var makeOpen = !isAllOpenInActiveTab();
    items.forEach(function (it) { set[itemKey(it)] = makeOpen; });
    drawControls();
    drawLines();
  }

  /* ---- タブ（文 / 語彙） -------------------------------------------------- */
  function drawTabs() {
    var U = ui();
    var t = view.topic;
    U.mount(tabsBox, [
      h('button', {
        class: 'btn btn--sm' + (view.tab === 'lines' ? ' btn--primary' : ''),
        text: '文 ' + visibleLines().length,
        onClick: function () { view.tab = 'lines'; drawControls(); drawLines(); }
      }),
      h('button', {
        class: 'btn btn--sm' + (view.tab === 'words' ? ' btn--primary' : ''),
        text: '語彙 ' + (t.words ? t.words.length : 0),
        onClick: function () { view.tab = 'words'; drawControls(); drawLines(); }
      })
    ]);
  }

  // ト書き等（skip:true）は音読対象ではないので一覧モードにも出さない
  function visibleLines() {
    return (view.topic.lines || []).filter(function (l) { return !l.skip; });
  }

  /* ---- 行の表示 ------------------------------------------------------------ */
  function drawLines() {
    var U = ui();
    if (view.tab === 'lines') {
      var lines = visibleLines();
      if (!lines.length) { U.mount(linesBox, h('div', { class: 'empty', text: '表示できる行がありません。' })); return; }
      U.mount(linesBox, lines.map(function (l, i) { return lineRow(l, i); }));
    } else {
      var words = view.topic.words || [];
      if (!words.length) { U.mount(linesBox, h('div', { class: 'empty', text: 'このトピックには語彙がありません。' })); return; }
      U.mount(linesBox, words.map(function (w) { return wordRow(w); }));
    }
  }

  function lineRow(l, i) {
    var U = ui();
    var open = !!view.openLines[l.id];
    var primaryIsEn = view.direction === 'en';
    var primary = primaryIsEn ? l.en : l.ja;
    var secondary = primaryIsEn ? l.ja : l.en;

    // 行そのものはdivにして、中に「開くボタン」と「🔊」を並べる。
    // button の入れ子はHTMLとして不正なので、行自体をbuttonにはできない。
    return h('div', { class: 'list-row' }, [
      h('button', {
        class: 'list-row__main',
        onClick: function () { toggleLine(l); }
      }, [
        h('div', { class: 'row row--tight' }, [
          h('span', { class: 'tiny muted', text: String(i + 1) }),
          h('span', { class: primaryIsEn ? 'en' : '', text: primary || '（空）' })
        ]),
        open ? h('div', { class: 'tiny muted', style: { marginTop: '.15rem', paddingLeft: '1.2rem' } }, [
          '→ ', h('span', { class: primaryIsEn ? '' : 'en', text: secondary || '（空）' })
        ]) : null
      ]),
      // §4.1 スピーカーは開かなくても音だけ聞ける（音で思い出せるか試せる）。
      // したがって openedCount は増やさない。
      speakButton(l.en, speakerGender(l.speakerId), l.id)
    ]);
  }

  // 使えない環境ではボタン自体を出さない（CLAUDE.md: 機能を隠すか静かにフォールバック）
  function speakButton(text, gender, key) {
    if (!EST.speech.isAvailable() || !String(text || '').trim()) return null;
    return h('button', {
      class: 'speak-btn', title: '英文を聞く', 'aria-label': '英文を聞く',
      onClick: function (e) {
        e.stopPropagation();
        EST.speech.speak(text, { gender: gender, topicId: view.topic.id, lineId: key });
      }
    }, '🔊');
  }

  function speakerGender(speakerId) {
    var g = '';
    (view.topic.speakers || []).forEach(function (s) { if (s.id === speakerId) g = s.gender || ''; });
    return g;
  }

  function wordRow(w) {
    var open = !!view.openWords[w.id];
    var primaryIsEn = view.direction === 'en';
    var primary = primaryIsEn ? w.en : w.ja;
    var secondary = primaryIsEn ? w.ja : w.en;

    return h('div', { class: 'list-row' }, [
      h('button', {
        class: 'list-row__main',
        onClick: function () {
          view.openWords[w.id] = !view.openWords[w.id];   // 語彙は記録対象外（F6で扱う）
          drawControls(); drawLines();
        }
      }, [
        h('div', { class: 'row row--tight' }, [
          h('span', { class: primaryIsEn ? 'en' : '', text: primary || '（空）' }),
          h('span', { class: 'chip', text: w.type === 'phrase' ? '句' : '語' })
        ]),
        open ? h('div', { class: 'tiny muted', style: { marginTop: '.15rem', paddingLeft: '1.2rem' } }, [
          '→ ', h('span', { class: primaryIsEn ? '' : 'en', text: secondary || '（空）' })
        ]) : null
      ]),
      // 語彙は特定の話者の台詞ではないので、性別指定なしの既定ボイスで読む
      speakButton(w.en, '', null)
    ]);
  }

  // 1行ずつ開いたときだけ §5.5 の openedCount を増やす。閉じる操作や
  // 「全部開く」由来のものはここを通らない。
  function toggleLine(l) {
    var willOpen = !view.openLines[l.id];
    view.openLines[l.id] = willOpen;
    drawControls();
    drawLines();
    if (willOpen && view.settings && view.settings.recordOpens !== false) {
      EST.store.markLineOpened(view.topic.id, l.id).catch(function (e) {
        console.warn('[list] 開いた記録に失敗しました', e);
      });
    }
  }

  /* ---- 書き出し（§4.3。テキスト／Markdownのみ。Anki TSVはF6） ------------- */
  function exportAs(kind) {
    var U = ui();
    var t = view.topic;
    var lines = visibleLines();
    var name = (t.title || 'topic').replace(/[\\/:*?"<>|]/g, '_');

    var text;
    if (kind === 'md') {
      var mdParts = ['# ' + (t.title || '(無題)')];
      if (t.titleEn) mdParts.push('*' + t.titleEn + '*');
      lines.forEach(function (l) {
        mdParts.push('- ' + (l.ja || '(和訳なし)') + '\n  → **' + (l.en || '') + '**');
      });
      text = mdParts.join('\n\n');
      U.download(name + '.md', text, 'text/markdown');
    } else {
      var txtParts = [t.title || '(無題)'];
      if (t.titleEn) txtParts.push(t.titleEn);
      txtParts.push('');
      lines.forEach(function (l) {
        txtParts.push('・' + (l.ja || '(和訳なし)'));
        txtParts.push('    → ' + (l.en || ''));
      });
      text = txtParts.join('\n');
      U.download(name + '.txt', text, 'text/plain');
    }
    U.toast('書き出しました');
  }

  EST.uiList = { renderList: renderList };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 15-ui-search.js ---- */
/* =====================================================================
   15-ui-search.js — 横断検索（SPEC §4.2）
   全トピックを対象に日本語でも英語でも部分一致で引ける。検索は「これから
   見に行く」操作であって、思い出せなかった記録（§4.1）の対象ではない。
   練習画面（F5）がまだ無いので、ヒットからの遷移先はトピック詳細にする。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var h = null;
  function ui() { h = EST.ui.h; return EST.ui; }

  var resultsBox = null;
  var allTopics = [];

  function renderSearch(root) {
    var U = ui();
    EST.app.setBar('検索', []);

    var input = h('input', {
      type: 'text', placeholder: '日本語でも英語でも入力してください',
      onInput: function (e) { runSearch(e.target.value); }
    });

    resultsBox = h('div', { style: { marginTop: '.7rem' } });

    U.mount(root, [
      h('div', { class: 'card' }, [input]),
      resultsBox
    ]);

    EST.store.getAll('topics').then(function (topics) {
      // §5.9 検索対象は自分の部屋に属するトピックだけ
      allTopics = EST.profile.visible(topics);
      drawHint();
      try { input.focus(); } catch (e) {}
    });
  }

  function drawHint() {
    ui().mount(resultsBox, h('div', { class: 'empty', text: 'キーワードを入力してください。' }));
  }

  function runSearch(raw) {
    var U = ui();
    var q = String(raw || '').trim();
    if (!q) { drawHint(); return; }
    var nq = EST.schema.normalizeForSearch(q);

    var groups = [];
    allTopics.forEach(function (t) {
      var hits = (t.lines || []).filter(function (l) { return !l.skip; }).filter(function (l) {
        return EST.schema.normalizeForSearch(l.en).indexOf(nq) >= 0
            || EST.schema.normalizeForSearch(l.ja).indexOf(nq) >= 0;
      });
      if (hits.length) groups.push({ topic: t, hits: hits });
    });

    if (!groups.length) {
      U.mount(resultsBox, h('div', { class: 'empty', text: '見つかりませんでした。' }));
      return;
    }
    U.mount(resultsBox, groups.map(groupBox));
  }

  function groupBox(g) {
    var U = ui();
    return h('div', { class: 'card' }, [
      h('button', {
        class: 'card__title', style: { background: 'none', border: 'none', padding: 0, cursor: 'pointer', color: 'var(--ink)', textAlign: 'left' },
        onClick: function () { location.hash = '#/topic/' + encodeURIComponent(g.topic.id); }
      }, g.topic.title || '(無題)'),
      h('div', {}, g.hits.map(function (l) {
        return h('div', { class: 'line-view' }, [
          h('div', { class: 'grow' }, [
            h('div', { class: 'line-view__ja', text: l.ja || '(和訳なし)' }),
            h('div', { class: 'line-view__en en', text: l.en })
          ]),
          // §4.2 ヒットした行からその場で音声再生できる
          speakButton(g.topic, l)
        ]);
      }))
    ]);
  }

  function speakButton(topic, line) {
    if (!EST.speech.isAvailable() || !String(line.en || '').trim()) return null;
    var gender = '';
    (topic.speakers || []).forEach(function (s) { if (s.id === line.speakerId) gender = s.gender || ''; });
    return h('button', {
      class: 'speak-btn', title: '英文を聞く', 'aria-label': '英文を聞く',
      onClick: function () {
        EST.speech.speak(line.en, { gender: gender, topicId: topic.id, lineId: line.id });
      }
    }, '🔊');
  }

  EST.uiSearch = { renderSearch: renderSearch };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 99-main.js ---- */
/* =====================================================================
   99-main.js — 起動とハッシュルーティング
   ルートは location.hash だけで表す。サーバ設定が要らず、
   単一HTMLをどこに置いても壊れないため。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var viewEl = null, barEl = null;

  /* ---- テーマと文字サイズ ------------------------------------------------ */
  // styles.css の --bg（ライト/ダーク）と同じ値。iOSのステータスバー／
  // 起動画面の色に使う <meta name="theme-color"> をここから合わせる。
  var THEME_BG_LIGHT = '#faf9f7';
  var THEME_BG_DARK = '#17181a';

  function applyTheme(s) {
    var root = document.documentElement;
    var theme = s && s.theme ? s.theme : 'auto';
    root.setAttribute('data-theme', theme);
    root.style.setProperty('--fs', String((s && Number(s.fontScale)) || 1));
    syncThemeColor(theme);
  }

  // <meta name="theme-color"> は本来 prefers-color-scheme で自動追従するが、
  // 設定で明示的に light/dark を選んだときは両方のタグを同じ値に揃えて上書きする。
  // auto に戻したら、それぞれ本来のライト/ダーク値に戻す。
  function syncThemeColor(theme) {
    var light = document.querySelector('meta[name="theme-color"][media*="light"]');
    var dark = document.querySelector('meta[name="theme-color"][media*="dark"]');
    if (!light || !dark) return;
    if (theme === 'light') { light.setAttribute('content', THEME_BG_LIGHT); dark.setAttribute('content', THEME_BG_LIGHT); }
    else if (theme === 'dark') { light.setAttribute('content', THEME_BG_DARK); dark.setAttribute('content', THEME_BG_DARK); }
    else { light.setAttribute('content', THEME_BG_LIGHT); dark.setAttribute('content', THEME_BG_DARK); }
  }

  // DBを開く前に localStorage のミラーから当てる（起動時に一瞬白くならないように）
  function applyThemeEarly() {
    var m = EST.store.readMirror();
    applyTheme(m || { theme: 'auto', fontScale: 1 });
  }

  /* ---- アプリバー -------------------------------------------------------- */
  function setBar(title, actions) {
    var h = EST.ui.h;
    var isHome = (currentRoute().name === 'home');
    EST.ui.mount(barEl, [
      isHome ? null : h('button', {
        class: 'btn btn--ghost btn--sm', text: '←', title: '戻る',
        onClick: function () { history.length > 1 ? history.back() : (location.hash = '#/'); }
      }),
      h('div', { class: 'appbar__title', text: title || '' }),
      h('div', { class: 'appbar__actions' }, actions || [])
    ]);
  }

  /* ---- ルーティング ------------------------------------------------------ */
  function currentRoute() {
    var raw = String(location.hash || '').replace(/^#/, '');
    var parts = raw.split('/').filter(Boolean);
    if (!parts.length) return { name: 'home' };
    if (parts[0] === 'import') return { name: 'import' };
    if (parts[0] === 'settings') return { name: 'settings' };
    if (parts[0] === 'topic') return { name: 'topic', id: decodeURIComponent(parts[1] || '') };
    if (parts[0] === 'edit') return { name: 'edit', id: decodeURIComponent(parts[1] || '') };
    if (parts[0] === 'practice') return { name: 'practice', id: decodeURIComponent(parts[1] || '') };
    if (parts[0] === 'list') return { name: 'list', id: decodeURIComponent(parts[1] || '') };
    if (parts[0] === 'search') return { name: 'search' };
    return { name: 'home' };
  }

  function route() {
    var r = currentRoute();
    window.scrollTo(0, 0);
    // §7.2 画面遷移時に必ず止める。忘れると別画面で喋り続ける。
    // 通して再生はループなので、発話を止めるだけでは次の行へ進んでしまう。
    // ループごと止めてから cancel する。
    try { EST.uiHome.stopPlayback(); } catch (e) {}
    // 練習セッションはタイマーで自走するので、画面を離れるときに必ず止める。
    // 止めないと次の画面で行が進み続け、TTSもマイクも動いたままになる。
    try { EST.uiPractice.stopSession(); } catch (e) {}
    try { EST.speech.cancel(); } catch (e) {}
    // マイクも画面をまたいで開いたままにしない。stop()は聞いていなければ何もしない。
    try { EST.mic.stop(); } catch (e) {}
    try {
      if (r.name === 'home') EST.uiHome.renderHome(viewEl);
      else if (r.name === 'import') EST.uiImport.renderImport(viewEl);
      else if (r.name === 'edit') EST.uiImport.renderEditor(viewEl, r.id);
      else if (r.name === 'topic') EST.uiHome.renderTopic(viewEl, r.id);
      else if (r.name === 'practice') EST.uiPractice.renderPractice(viewEl, r.id);
      else if (r.name === 'list') EST.uiList.renderList(viewEl, r.id);
      else if (r.name === 'search') EST.uiSearch.renderSearch(viewEl);
      else if (r.name === 'settings') EST.uiSettings.render(viewEl);
    } catch (e) {
      console.error('[route]', e);
      EST.ui.mount(viewEl, EST.ui.h('div', { class: 'note-box note-box--err',
        text: '画面の表示に失敗しました: ' + (e && e.message || e) }));
    }
  }

  /* ---- サンプル台本の投入（付録B） --------------------------------------- */
  // 短い台本（12行）と長い台本（22行・4ブロック）の両方で確認できるようにする。
  // 台本は2人で共有するので、投入済みフラグも共有側（settings の "shared"）に置く。
  // §6.5 由来を後から入れたので、既にある古いレコードには origin が無い。
  // 同梱サンプルのIDと一致するものを seed、それ以外を local として補う。
  // これをやらないと、由来なしのサンプルが配信の削除対象から外れない。
  function backfillOrigins() {
    var sampleIds = {};
    (EST.SAMPLES || []).forEach(function (s) { if (s && s.id) sampleIds[s.id] = true; });
    return EST.store.getAll('topics').then(function (all) {
      var need = all.filter(function (t) { return EST.schema.ORIGINS.indexOf(t.origin) < 0; });
      if (!need.length) return 0;
      need.forEach(function (t) { t.origin = sampleIds[t.id] ? 'seed' : 'local'; });
      return EST.store.bulkPut('topics', need).then(function () { return need.length; });
    });
  }

  function seedSamples(force) {
    var list = EST.SAMPLES || [];
    if (!list.length) return Promise.resolve(0);
    return EST.store.loadShared().then(function (sh) {
      if (sh.samplesSeeded && !force) return 0;
      // 同梱サンプルは audience を持たない場合があるので §6.3 の救済を適用する。
      // §6.5 由来を seed として記録し、配信の削除判定から外す。
      var topics = list.map(function (raw) {
        return EST.schema.normalizeTopic(raw, { rescueAudience: true, origin: 'seed' });
      });
      return EST.store.bulkPut('topics', topics).then(function () {
        sh.samplesSeeded = true;
        return EST.store.saveShared(sh);
      }).then(function () { return topics.length; });
    });
  }

  /* ---- プロフィール選択（§5.9） ------------------------------------------
     起動時に一度だけ聞く。どちらの部屋かが決まらないと進捗のキーが作れないので、
     この画面を通すまで他の画面は出さない。
  --------------------------------------------------------------------- */
  function renderProfilePicker(onPick) {
    var h = EST.ui.h;
    EST.ui.mount(barEl, [h('div', { class: 'appbar__title', text: '英会話台本トレーナー' })]);
    EST.ui.mount(viewEl, h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: 'どちらの部屋で使いますか' }),
      h('div', { class: 'small muted', style: { marginBottom: '.6rem' },
        text: '台本も練習の記録も部屋ごとに分かれます。2人とも学習者で、課題は別です。あとから設定で変えられます。' }),
      h('div', {}, EST.profile.all().map(function (p) {
        return h('button', {
          class: 'home-item',
          onClick: function () { EST.profile.set(p.id); onPick(p.id); }
        }, [
          h('span', { class: 'home-item__icon', text: p.canEdit ? '🛠' : '🎧' }),
          h('span', { class: 'home-item__body' }, [
            h('div', { text: p.label }),
            h('div', { class: 'home-item__sub', text: p.sub })
          ])
        ]);
      }))
    ]));
  }

  /* ---- 起動 --------------------------------------------------------------- */
  function boot() {
    viewEl = document.getElementById('view');
    barEl = document.getElementById('appbar');
    applyThemeEarly();
    installSpeechUnlock();

    if (!EST.profile.restore()) {
      renderProfilePicker(function () { start(); });
      return;
    }
    start();
  }

  // §7.2 iOS Safari は最初の発話をユーザージェスチャの同期処理内で行う必要がある。
  // 起動後の最初のタップで解錠する。once なので以降は何もしない。
  function installSpeechUnlock() {
    function once() {
      document.removeEventListener('pointerdown', once, true);
      document.removeEventListener('touchend', once, true);
      try { EST.speech.unlock(); } catch (e) {}
    }
    document.addEventListener('pointerdown', once, true);
    document.addEventListener('touchend', once, true);
  }

  function start() {
    EST.store.loadSettings()
      .then(function (s) {
        applyTheme(s);
        EST.speech.applySettings(s);   // §7.5 速度と§7.2 ボイス指定を反映する
        EST.mic.applySettings(s);      // §2.1 較正値を反映する（countRatioはF5が使う）
        return seedSamples(false);
      })
      .then(function () {
        // 配信を取りに行く前に、由来の無い既存レコードを埋めておく
        return backfillOrigins();
      })
      .then(function () {
        // §6.5 配信の取得。失敗しても何もしないので待っても害はないが、
        // 起動を止めないよう画面を出してから結果を反映する。
        return EST.publish.sync().catch(function () { return null; });
      })
      .then(function () {
        window.addEventListener('hashchange', route);
        route();
      })
      .catch(function (e) {
        console.error('[boot]', e);
        EST.ui.mount(viewEl, EST.ui.h('div', { class: 'note-box note-box--err' }, [
          '起動に失敗しました: ' + (e && e.message || e),
          EST.ui.h('div', { class: 'tiny', style: { marginTop: '.3rem' },
            text: 'プライベートブラウジングだとIndexedDBが使えないことがあります。' })
        ]));
      });
  }

  EST.app = {
    setBar: setBar,
    applyTheme: applyTheme,
    seedSamples: seedSamples,
    route: route,
    currentRoute: currentRoute,
    renderProfilePicker: renderProfilePicker
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.EST = window.EST || {});

</script>
</body>
</html>
