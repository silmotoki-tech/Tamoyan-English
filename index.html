      input.click();
    });
  }

  /* ---- 表示用の小道具 --------------------------------------------------- */
  function fmtDate(ms) {
    if (!ms) return '—';
    var d = new Date(ms);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function fmtSeconds(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    if (sec < 60) return sec + '秒';
    return Math.floor(sec / 60) + '分' + ('0' + (sec % 60)).slice(-2) + '秒';
  }

  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  EST.ui = {
    h: h,
    clear: clear,
    mount: mount,
    append: append,
    toast: toast,
    dialog: dialog,
    confirm: confirm,
    alert: alertBox,
    choose: choose,
    download: download,
    pickFile: pickFile,
    fmtDate: fmtDate,
    fmtSeconds: fmtSeconds,
    fmtBytes: fmtBytes
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 09-publish.js ---- */
/* =====================================================================
   09-publish.js — 台本の配信と同期（SPEC §6.5）
   タモやんが作った台本を data/scripts.json に置き、
   2人の端末が起動時に取りに行って自動で反映する。

   取れなかったときは何もしない。前回取り込んだ台本が IndexedDB に残って
   いるので練習は続けられる（オフラインでも file:// でも止まらない）。
   ===================================================================== */
;(function (EST) {
  'use strict';

  /* ---- 調整用の定数 ---------------------------------------------------- */
  var FEED_PATH   = 'data/scripts.json';
  var FETCH_MS    = 8000;   // これを超えたら諦める（起動を待たせない）

  // 直近の同期結果。ホームが一度だけ知らせに使う。
  var lastResult = null;

  /* ---- 取得 ------------------------------------------------------------ */
  function fetchFeed() {
    if (typeof fetch !== 'function') return Promise.resolve(null);

    // ?t= を付けるのは GitHub Pages のキャッシュを避けるため（§6.5）
    var url = FEED_PATH + '?t=' + Date.now();
    var opts = { cache: 'no-store' };
    var timer = null;

    if (typeof AbortController === 'function') {
      var ctrl = new AbortController();
      opts.signal = ctrl.signal;
      timer = setTimeout(function () { ctrl.abort(); }, FETCH_MS);
    }

    return fetch(url, opts)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (json) { return json; })
      .catch(function (e) {
        // 失敗はユーザーに見せない。file:// や圏外では当たり前に起きるため。
        console.info('[publish] 配信を取得できませんでした（前回の台本のまま動きます）:',
                     (e && e.message) || e);
        return null;
      })
      .then(function (v) { if (timer) clearTimeout(timer); return v; });
  }

  /* ---- 同期 ------------------------------------------------------------
     戻り値: null（更新なし）または {added, updated, removed, publishedAt}
  --------------------------------------------------------------------- */
  function sync() {
    return fetchFeed().then(function (feed) {
      if (!feed || !Array.isArray(feed.topics)) return null;
      var publishedAt = Number(feed.publishedAt) || 0;

      return EST.store.loadShared().then(function (shared) {
        // publishedAt が進んでいなければ何もしない
        if (publishedAt && publishedAt <= (Number(shared.publishedAt) || 0)) return null;
        return apply(feed, shared, publishedAt);
      });
    }).then(function (r) {
      lastResult = r;
      return r;
    }).catch(function (e) {
      console.warn('[publish] 同期に失敗しました', e);
      return null;
    });
  }

  function apply(feed, shared, publishedAt) {
    // §6.3: 配信JSONは外部データなので、audience 未指定は "both" で救済する。
    // ここで止めてしまうと、値の抜けた1件のせいで配信全体が反映されなくなる。
    var incoming = feed.topics
      // §6.5 配信が持ち込んだものは feed 由来として記録する
      .map(function (t) { return EST.schema.normalizeTopic(t, { rescueAudience: true, origin: 'feed' }); })
      .filter(function (t) { return t.lines.length > 0; });

    return EST.store.getAll('topics').then(function (cur) {
      var curIds = {};
      cur.forEach(function (t) { curIds[t.id] = true; });

      var incomingIds = {};
      incoming.forEach(function (t) { incomingIds[t.id] = true; });

      // 件数は自分の部屋に見えるものだけ数える。相手用の台本が増えたことを
      // 知らされても、こちらの行動は何も変わらないため（§5.9）。
      var added = 0, updated = 0;
      incoming.forEach(function (t) {
        if (!EST.profile.canSee(t)) return;
        if (curIds[t.id]) updated++; else added++;
      });

      var curById = {};
      cur.forEach(function (t) { curById[t.id] = t; });

      // §6.5 配信から消えたトピックは一覧からも消す。ただし
      // **削除できるのは配信が持ち込んだトピック（origin: 'feed'）だけ**。
      // 同梱サンプル（seed）と端末内で作った台本（local）は、たとえ過去に
      // 配信へ混入していても対象外にする。由来が配信でないものを
      // 配信の都合で消さない。seed はさらに samplesSeeded が立っていて
      // 二度と復活しないので、消してはいけない。
      var wasFed = Array.isArray(shared.feedTopicIds) ? shared.feedTopicIds : [];
      var removeIds = wasFed.filter(function (id) {
        if (incomingIds[id] || !curIds[id]) return false;
        return (curById[id] && curById[id].origin) === 'feed';
      });

      // 削除の件数も、自分の部屋に見えていたものだけを数える
      var removedVisible = removeIds.filter(function (id) { return EST.profile.canSee(curById[id]); }).length;

      // 既に端末にあるトピックの由来は変えない。配信に混ざっていた
      // 同梱サンプルを feed に塗り替えると、次の配信で削除対象になってしまう。
      var toWrite = incoming.map(function (t) {
        var prev = curById[t.id];
        if (prev && EST.schema.ORIGINS.indexOf(prev.origin) >= 0 && prev.origin !== 'feed') {
          return Object.assign({}, t, { origin: prev.origin });
        }
        return t;
      });

      var chain = EST.store.bulkPut('topics', toWrite);
      removeIds.forEach(function (id) {
        // 進捗レコードは消さない。再配信で復活したときに引き継げるようにする（§6.5）
        chain = chain.then(function () { return EST.store.del('topics', id); });
      });

      return chain.then(function () {
        // publishedAt が 0（未公開）のときは同期済み時刻を進めない。
        // ここで Date.now() に繰り上げると、後から来る小さめの publishedAt を
        // 「古い」と誤判定して無視してしまう（sync() の比較が壊れる）。
        if (publishedAt) shared.publishedAt = publishedAt;
        shared.feedTopicIds = Object.keys(incomingIds);
        return EST.store.saveShared(shared);
      }).then(function () {
        return { added: added, updated: updated, removed: removedVisible, publishedAt: publishedAt };
      });
    });
  }

  /* ---- 書き出し（タモやんのみ。§6.5 の更新手順2） ----------------------- */
  function buildFeed() {
    return EST.store.getAll('topics').then(function (topics) {
      topics.sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      return { publishedAt: Date.now(), topics: topics };
    });
  }

  function exportFeedFile() {
    return buildFeed().then(function (feed) {
      EST.ui.download('scripts.json', JSON.stringify(feed, null, 2));
      return feed;
    });
  }

  /* ---- ホームへの通知 ---------------------------------------------------- */
  function takeResult() {
    var r = lastResult;
    lastResult = null;     // 一度だけ出す（毎回出ると邪魔になる）
    return r;
  }

  EST.publish = {
    FEED_PATH: FEED_PATH,
    fetchFeed: fetchFeed,
    sync: sync,
    buildFeed: buildFeed,
    exportFeedFile: exportFeedFile,
    takeResult: takeResult
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 10-ui-home.js ---- */
/* =====================================================================
   10-ui-home.js — ホームとトピック一覧・トピック詳細（SPEC §8）
   F1 の時点では練習・検索・語彙の中身がまだ無いので、
   該当する導線は枠だけ置いて押せない状態にしてある。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var h = null;   // 起動時に EST.ui.h を受け取る（読み込み順に依存しないため）

  function ui() { h = EST.ui.h; return EST.ui; }

  /* ---- ホーム ---------------------------------------------------------- */
  function renderHome(view) {
    var U = ui();
    EST.app.setBar('英会話台本トレーナー', [
      h('span', { class: 'chip', text: EST.profile.label() }),
      h('button', { class: 'btn btn--sm', text: '設定', onClick: function () { location.hash = '#/settings'; } })
    ]);

    var wrap = h('div', {});

    // §6.5 台本が更新されたことを一度だけ知らせる
    var fed = EST.publish.takeResult();
    if (fed && (fed.added || fed.updated || fed.removed)) {
      var parts = [];
      if (fed.added) parts.push('追加' + fed.added + '件');
      if (fed.updated) parts.push('更新' + fed.updated + '件');
      if (fed.removed) parts.push('削除' + fed.removed + '件');
      U.append(wrap, h('div', { class: 'note-box note-box--warn', style: { marginBottom: '.7rem' },
        text: '台本を更新しました（' + parts.join(' / ') + '）' }));
    }

    // まだ使えない導線。押せてしまうと壊れているように見えるので disabled にする。
    function pending(icon, label, phase) {
      return h('button', { class: 'home-item', disabled: true }, [
        h('span', { class: 'home-item__icon', text: icon }),
        h('span', { class: 'home-item__body' }, [
          h('div', { text: label }),
          h('div', { class: 'home-item__sub', text: 'まだ使えません（' + phase + 'で追加）' })
        ])
      ]);
    }

    U.append(wrap, [
      h('button', { class: 'home-item', onClick: function () { location.hash = '#/search'; } }, [
        h('span', { class: 'home-item__icon', text: '🔍' }),
        h('span', { class: 'home-item__body' }, [
          h('div', { text: '検索（全トピック横断）' }),
          h('div', { class: 'home-item__sub', text: '日本語でも英語でも引けます' })
        ])
      ]),
      pending('📅', '今日の練習', 'F5'),
      pending('🔁', '再確認', 'F7'),
      pending('📇', '語彙をまわす', 'F6')
    ]);

    U.append(wrap, h('div', { class: 'section-title', text: 'トピック' }));

    var chipBox = h('div', { class: 'row row--tight', style: { marginBottom: '.45rem' } });
    var listBox = h('div', {});
    U.append(wrap, [chipBox, listBox]);

    // §5.9 まりの部屋では編集系の導線をグレーアウトではなく「出さない」
    if (EST.profile.canEdit()) {
      U.append(wrap, [
        h('button', {
          class: 'btn btn--primary btn--block', text: '＋ 新規トピック',
          onClick: function () { location.hash = '#/import'; }
        })
      ]);
    }

    U.mount(view, wrap);

    EST.store.getAll('topics').then(function (topics) {
      topics.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
      drawList(chipBox, listBox, topics);
    }).catch(function (e) {
      U.mount(listBox, h('div', { class: 'note-box note-box--err', text: '読み込みに失敗しました: ' + e.message }));
    });
  }

  /* ---- 一覧の絞り込み（§5.9） ------------------------------------------
     一覧は自分の部屋の台本だけにする。ただしタモやんは相手用の台本も作るので、
     保存した瞬間に一覧から消えて編集できなくなると困る。逃げ道としてチップを出す。
  --------------------------------------------------------------------- */
  var homeFilter = 'mine';   // 'mine' | 'other' | 'all'

  function drawList(chipBox, listBox, topics) {
    var U = ui();
    var mine = topics.filter(function (t) { return EST.profile.canSee(t); });
    var others = topics.filter(function (t) { return !EST.profile.canSee(t); });

    // 相手用の台本が1件も無いうちはチップ自体を出さない。
    // ホームは練習に入るための画面なので、管理UIを常設しない（§8）。
    var showChips = EST.profile.canEdit() && others.length > 0;
    if (!showChips) homeFilter = 'mine';

    if (!showChips) {
      U.mount(chipBox, []);
    } else {
      var otherLabel = EST.profile.other().label + '用';
      U.mount(chipBox, [
        chip('自分用', 'mine', mine.length, chipBox, listBox, topics),
        chip(otherLabel, 'other', others.length, chipBox, listBox, topics),
        chip('両方', 'all', topics.length, chipBox, listBox, topics)
      ]);
    }

    var shown = homeFilter === 'mine' ? mine : (homeFilter === 'other' ? others : topics);

    if (!shown.length) {
      U.mount(listBox, h('div', { class: 'empty', text: emptyText(topics.length) }));
      return;
    }
    U.mount(listBox, shown.map(topicCard));
  }

  function chip(label, value, count, chipBox, listBox, topics) {
    return h('button', {
      class: 'btn btn--sm' + (homeFilter === value ? ' btn--primary' : ''),
      text: label + ' ' + count,
      onClick: function () {
        homeFilter = value;
        drawList(chipBox, listBox, topics);
      }
    });
  }

  function emptyText(total) {
    if (homeFilter === 'other') return '相手用の台本はありません。';
    if (total) return 'この部屋の台本はまだありません。';
    return EST.profile.canEdit()
      ? 'まだトピックがありません。「＋ 新規トピック」から台本を入れてください。'
      : 'まだ台本が届いていません。しばらくしてから開き直してください。';
  }

  function topicCard(t) {
    var U = ui();
    var sec = EST.schema.lapSeconds(t.lines);
    var meta = [
      t.lines.length + '行',
      (t.blocks && t.blocks.length ? t.blocks.length + 'ブロック' : 'ブロックなし'),
      '語彙' + (t.words ? t.words.length : 0) + '個',
      '1周 約' + U.fmtSeconds(sec)
    ].join(' ・ ');

    // §5.9 自分の部屋に属さない台本をタップしたら、練習ではなく編集を開く。
    // 練習画面に入ると相手用の台本に自分の進捗レコードが付いてしまうため。
    var mine = EST.profile.canSee(t);
    var to = mine ? ('#/topic/' + encodeURIComponent(t.id)) : ('#/edit/' + encodeURIComponent(t.id));

    return h('button', {
      class: 'topic-card',
      onClick: function () { location.hash = to; }
    }, [
      h('div', { class: 'topic-card__title' }, [
        t.title || '(無題)',
        // 誰の台本かは、両方を扱うタモやんの部屋でだけ出す
        EST.profile.canEdit()
          ? h('span', { class: 'chip', style: { marginLeft: '.4rem' }, text: EST.profile.audienceLabel(t.audience) })
          : null
      ]),
      t.titleEn ? h('div', { class: 'topic-card__meta en', text: t.titleEn }) : null,
      h('div', { class: 'topic-card__meta', text: meta }),
      h('div', { class: 'topic-card__meta', text: mine
        ? ('更新 ' + U.fmtDate(t.updatedAt))
        : ('更新 ' + U.fmtDate(t.updatedAt) + ' ・ タップで編集') })
    ]);
  }

  /* ---- トピック詳細 ----------------------------------------------------- */
  function renderTopic(view, id) {
    var U = ui();
    EST.store.get('topics', id).then(function (t) {
      if (!t) {
        EST.app.setBar('トピック', []);
        U.mount(view, h('div', { class: 'empty', text: 'このトピックは見つかりませんでした。' }));
        return;
      }
      // §5.9 自分の部屋の台本でなければ練習画面には入らせない。
      // 編集できる部屋なら編集へ、そうでなければホームへ戻す。
      if (!EST.profile.canSee(t)) {
        location.hash = EST.profile.canEdit() ? ('#/edit/' + encodeURIComponent(t.id)) : '#/';
        return;
      }
      EST.app.setBar(t.title || '(無題)', EST.profile.canEdit() ? [
        h('button', { class: 'btn btn--sm', text: '編集', onClick: function () { location.hash = '#/edit/' + encodeURIComponent(t.id); } })
      ] : []);
      U.mount(view, buildTopicDetail(t, view));
    });
  }

  // §5.9「audienceは後から変えられるようにする」。編集画面を開き直さず、
  // タモやんの部屋にだけこの場で切り替えられるようにする。
  function switchAudience(t, next, view) {
    if (next === t.audience) return;
    var U = ui();
    var updated = JSON.parse(JSON.stringify(t));
    updated.audience = next;
    updated.updatedAt = Date.now();

    EST.store.put('topics', updated)
      .then(function () { return EST.backup.snapshot('audience変更: ' + (updated.title || '')); })
      .then(function () {
        var me = EST.profile.get();
        var msg;
        if (next === 'both') msg = '両方にしました。';
        else if (next === me) msg = '自分用にしました。';
        else msg = EST.profile.audienceLabel(next) + 'にしました。自分の一覧には出ません。';
        U.toast(msg);

        // 変更した瞬間に自分の部屋から見えなくなることがある（§5.9）。
        // 見えなくなった詳細画面に留まっても仕方がないのでホームへ戻す。
        if (EST.profile.canSee(updated)) renderTopic(view, updated.id);
        else location.hash = '#/';
      });
  }

  function audienceSwitchRow(t, view) {
    var me = EST.profile.get();
    var other = EST.profile.other().id;
    return h('div', { class: 'row row--tight', style: { marginTop: '.5rem' } }, [
      h('span', { class: 'tiny muted', text: '誰の台本か' }),
      [me, other, 'both'].map(function (a) {
        return h('button', {
          class: 'btn btn--sm' + (t.audience === a ? ' btn--primary' : ''),
          text: EST.profile.audienceLabel(a),
          onClick: function () { switchAudience(t, a, view); }
        });
      })
    ]);
  }

  function buildTopicDetail(t, view) {
    var U = ui();
    var sec = EST.schema.lapSeconds(t.lines);
    var myLabel = '';
    (t.speakers || []).forEach(function (s) { if (s.id === t.myRole) myLabel = s.label; });

    var head = h('div', { class: 'card' }, [
      t.titleEn ? h('div', { class: 'en', text: t.titleEn }) : null,
      h('div', { class: 'small muted' }, [
        [t.level, (t.tags || []).join(' / ')].filter(Boolean).join(' ・ ')
      ]),
      h('div', { class: 'stat-bar', style: { position: 'static', marginTop: '.5rem', marginBottom: '0' } }, [
        h('span', {}, ['1周 約', h('b', { text: U.fmtSeconds(sec) })]),
        h('span', {}, [h('b', { text: String(t.lines.length) }), '行']),
        h('span', {}, [h('b', { text: String((t.blocks || []).length || 1) }), 'ブロック']),
        h('span', {}, ['語彙 ', h('b', { text: String((t.words || []).length) }), '個']),
        h('span', {}, ['自分の役 ', h('b', { text: myLabel || '未設定' })])
      ]),
      // §5.9 audienceは後から変えられる。タモやんの部屋にのみ表示する。
      EST.profile.canEdit() ? audienceSwitchRow(t, view) : null
    ]);

    // §5.9 まりの部屋には書き出し・削除を出さない
    var canEdit = EST.profile.canEdit();
    // 音声が使えない環境ではボタンごと出さない
    var playBtn = EST.speech.isAvailable() ? h('button', {
      class: 'btn', text: '通して再生',
      onClick: function () {
        if (playback) stopPlayback();
        else startPlayback(t, playBtn);
      }
    }) : null;

    var actions = h('div', { class: 'card' }, [
      h('div', { class: 'row row--tight' }, [
        h('button', {
          class: 'btn btn--primary', text: '続きから',
          onClick: function () { location.hash = '#/practice/' + encodeURIComponent(t.id); }
        }),
        playBtn,
        h('button', {
          class: 'btn', text: '一覧を見る',
          onClick: function () { location.hash = '#/list/' + encodeURIComponent(t.id); }
        }),
        canEdit ? h('button', {
          class: 'btn', text: 'JSON書き出し',
          onClick: function () { exportTopic(t); }
        }) : null,
        canEdit ? h('button', {
          class: 'btn btn--danger', text: '削除',
          onClick: function () { removeTopic(t); }
        }) : null
      ]),
      h('div', { class: 'tiny muted', style: { marginTop: '.35rem' },
        text: 'S5・S6 と積み上げドリルは F7 で追加します。' })
    ]);

    var body = h('div', { class: 'card' }, buildLineList(t));

    var words = null;
    if ((t.words || []).length) {
      words = h('div', { class: 'card' }, [
        h('h2', { class: 'card__title', text: '語彙 ' + t.words.length + '個' }),
        h('div', {}, t.words.map(function (w) {
          return h('div', { class: 'line-view' }, [
            h('div', { class: 'grow' }, [
              h('div', { class: 'en', text: w.en }),
              h('div', { class: 'line-view__ja', text: w.ja })
            ]),
            h('span', { class: 'chip', text: w.type === 'phrase' ? '句' : '語' })
          ]);
        }))
      ]);
    }

    return [head, actions, body, words];
  }

  // 行の要素を id で引けるようにしておく（通して再生のハイライト用）
  var lineEls = {};

  function buildLineList(t) {
    var out = [];
    lineEls = {};
    var startAt = {};
    (t.blocks || []).forEach(function (b, i) { startAt[b.from] = { no: i + 1, label: b.label }; });
    var spLabel = {};
    (t.speakers || []).forEach(function (s) { spLabel[s.id] = s.label; });

    t.lines.forEach(function (l, i) {
      var st = startAt[l.id];
      if (st) out.push(h('div', { class: 'block-head', text: 'ブロック' + st.no + '　' + (st.label || '') }));
      var row = h('div', { class: 'line-view' }, [
        h('div', { class: 'line-view__no' }, [
          h('div', { text: String(i + 1) }),
          h('div', { class: t.myRole === l.speakerId ? 'line-view__mine' : '', text: spLabel[l.speakerId] || l.speakerId })
        ]),
        h('div', { class: 'grow' }, [
          h('div', { class: 'line-view__en en', text: l.en }),
          l.ja ? h('div', { class: 'line-view__ja', text: l.ja }) : null,
          l.note ? h('div', { class: 'tiny muted', text: l.note }) : null
        ]),
        speakLineButton(t, l)
      ]);
      lineEls[l.id] = row;
      out.push(row);
    });
    return out;
  }

  function genderOf(t, speakerId) {
    var g = '';
    (t.speakers || []).forEach(function (s) { if (s.id === speakerId) g = s.gender || ''; });
    return g;
  }

  function speakLineButton(t, l) {
    if (!EST.speech.isAvailable() || !String(l.en || '').trim()) return null;
    return h('button', {
      class: 'speak-btn', title: '英文を聞く', 'aria-label': '英文を聞く',
      onClick: function () {
        stopPlayback();
        EST.speech.speak(l.en, { gender: genderOf(t, l.speakerId), topicId: t.id, lineId: l.id });
      }
    }, '🔊');
  }

  /* ---- 通して再生（§11 F3「台本を入れて聞き流す」） ----------------------
     全役を順に、英文だけ読む。skip の行は飛ばす。
     練習画面（F5）とは別物で、ここは聞き流すためだけの導線。
  --------------------------------------------------------------------- */
  var playback = null;   // { topicId, cancelled }

  function highlight(lineId) {
    Object.keys(lineEls).forEach(function (id) {
      if (lineEls[id]) lineEls[id].classList.toggle('is-playing', id === lineId);
    });
  }

  function stopPlayback() {
    if (playback) playback.cancelled = true;
    playback = null;
    EST.speech.cancel();
    highlight(null);
  }

  function startPlayback(t, button) {
    var lines = (t.lines || []).filter(function (l) { return !l.skip && String(l.en || '').trim(); });
    if (!lines.length) return;

    var session = { topicId: t.id, cancelled: false };
    playback = session;
    button.textContent = '停止';
    button.classList.add('btn--danger');

    function done() {
      if (playback === session) playback = null;
      highlight(null);
      button.textContent = '通して再生';
      button.classList.remove('btn--danger');
    }

    function next(i) {
      if (session.cancelled || i >= lines.length) { done(); return; }
      var l = lines[i];
      highlight(l.id);
      EST.speech.speak(l.en, { gender: genderOf(t, l.speakerId), topicId: t.id, lineId: l.id })
        .then(function () {
          if (session.cancelled) { done(); return; }
          next(i + 1);
        })
        .catch(function () { done(); });
    }
    next(0);
  }

  function exportTopic(t) {
    var copy = JSON.parse(JSON.stringify(t));
    var name = (t.title || 'topic').replace(/[\\/:*?"<>|]/g, '_');
    EST.ui.download(name + '.json', JSON.stringify(copy, null, 2));
    EST.ui.toast('JSONを書き出しました');
  }

  function removeTopic(t) {
    EST.ui.confirm('トピックを削除', '「' + (t.title || '無題') + '」を削除します。元に戻せません。', '削除する', 'danger')
      .then(function (ok) {
        if (!ok) return;
        return EST.store.del('topics', t.id)
          .then(function () { return EST.store.del('topicProgress', t.id); })
          .then(function () { return EST.backup.snapshot('削除: ' + (t.title || '')); })
          .then(function () {
            EST.ui.toast('削除しました');
            location.hash = '#/';
          });
      });
  }

  EST.uiHome = { renderHome: renderHome, renderTopic: renderTopic, stopPlayback: stopPlayback };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 11-ui-practice.js ---- */
/* =====================================================================
   11-ui-practice.js — 練習画面（SPEC §3 / §1.1 / §1.2 / §2.6 / §2.7）

   音読中の画面は極限まで削る。情報が多いと画面を見てしまい、
   音読がおろそかになる。進行は自動で、押すボタンは中断するときだけ。
   ===================================================================== */
;(function (EST) {
  'use strict';

  var h = null;
  function ui() { h = EST.ui.h; return EST.ui; }

  /* ---- 調整用の定数 ------------------------------------------------------- */
  var NEXT_LINE_DELAY_MS = 400;    // 1行終わってから次の行を出すまでの間
  // §7.2 行が進む最短間隔の下限。何が壊れても画面が流れ去らないようにする。
  // TTSが握り潰されて即endが返るような事態でも、これ以上速くは進まない。
  var MIN_LINE_INTERVAL_MS = 1200;

  var S = null;        // 進行中のセッション
  var wakeLock = null;

  /* =====================================================================
     セッション
     ===================================================================== */
  function renderPractice(view, topicId) {
    var U = ui();
    stopSession();

    EST.store.get('topics', topicId).then(function (topic) {
      if (!topic) {
        EST.app.setBar('練習', []);
        U.mount(view, h('div', { class: 'empty', text: 'このトピックは見つかりませんでした。' }));
        return;
      }
      // §5.9 自分の部屋の台本でなければ練習させない
      if (!EST.profile.canSee(topic)) {
        location.hash = EST.profile.canEdit() ? ('#/edit/' + encodeURIComponent(topic.id)) : '#/';
        return;
      }
      return EST.stage.loadTopicProgress(topic.id).then(function (tp) {
        return EST.store.loadSettings().then(function (settings) {
          startSession(view, topic, tp, settings);
        });
      });
    });
  }

  function startSession(view, topic, tp, settings) {
    var U = ui();

    // F7 未実装のステージに来ていたら、その旨だけ出して止める
    if (!EST.stage.IMPLEMENTED[tp.stage]) {
      EST.app.setBar(topic.title || '(無題)', []);
      U.mount(view, h('div', { class: 'card' }, [
        h('h2', { class: 'card__title', text: EST.stage.stageLabel(tp.stage) + ' はまだ使えません' }),
        h('div', { class: 'small muted', text: 'S5・S6 と積み上げドリルは F7 で追加します。' }),
        h('button', {
          class: 'btn', style: { marginTop: '.6rem' }, text: 'トピックへ戻る',
          onClick: function () { location.hash = '#/topic/' + encodeURIComponent(topic.id); }
        })
      ]));
      return;
    }

    S = {
      view: view,
      topic: topic,
      tp: tp,
      settings: settings,
      countRatio: (typeof settings.countRatio === 'number' && settings.countRatio > 0)
        ? settings.countRatio : EST.stage.COUNT_RATIO_DEFAULT,
      lines: EST.stage.linesOfBlock(topic, tp.blockIndex || 0),
      idx: 0,
      lastResult: null,     // 「今のはナシ」用
      lastLineId: null,
      micOn: false,
      tapMode: false,
      tapReason: '',
      closing: false,
      timers: [],
      barTimer: null,
      expectedMs: 0,
      cueAt: 0,
      finished: false
    };
    if (!S.lines.length) {
      U.mount(view, h('div', { class: 'empty', text: '練習できる行がありません。' }));
      return;
    }

    buildScreen();
    requestWakeLock();
    prepareMic().then(function () { runLine(); });
  }

  function stopSession() {
    if (!S) return;
    S.closing = true;
    clearTimers();
    try { EST.speech.cancel(); } catch (e) {}
    try { EST.mic.stop(); } catch (e) {}
    releaseWakeLock();
    S = null;
  }

  function clearTimers() {
    if (!S) return;
    S.timers.forEach(function (t) { clearTimeout(t); });
    S.timers = [];
    if (S.barTimer) { clearInterval(S.barTimer); S.barTimer = null; }
  }

  // 発火し終えたタイマーは配列から外す。放っておくと1周ごとに積み上がり、
  // 長い練習で clearTimers() の走査対象が際限なく増える。
  function later(fn, ms) {
    if (!S) return null;
    var t = setTimeout(function () {
      if (!S || S.closing) return;
      var i = S.timers.indexOf(t);
      if (i >= 0) S.timers.splice(i, 1);
      fn();
    }, ms);
    S.timers.push(t);
    return t;
  }

  /* ---- マイク（§2.7 使えなければ黙ってタップモード） ---------------------- */
  function prepareMic() {
    var mode = EST.stage.stageMode(S.tp.stage);
    // §1.2 S1は聞くだけ。マイクを使わないので権限も要求しない。
    if (!mode.mic) return Promise.resolve();

    return EST.mic.start().then(function () {
      if (!S) return;
      S.micOn = true;
      EST.mic.on('level', onLevel);
      EST.mic.on('rep', onRep);
      EST.mic.on('timeout', onTimeout);
    }).catch(function (err) {
      if (!S) return;
      // §2.7 エラーを出さず黙ってタップモードに切り替え、理由を1行添える
      S.tapMode = true;
      S.tapReason = err && err.reason === 'denied' ? 'マイクが使えないのでタップモードです'
        : err && err.reason === 'no-device' ? 'マイクが見つからないのでタップモードです'
        : 'マイクが使えないのでタップモードです';
      showTapReason();
    });
  }

  /* =====================================================================
     画面（§3）
     ===================================================================== */
  var el = {};

  function buildScreen() {
    var U = ui();
    var topic = S.topic;

    // §3 押すべきボタンは原則ゼロ。中断だけをアプリバーに置く。
    EST.app.setBar(topic.title || '(無題)', [
      h('button', {
        class: 'btn btn--sm', text: '中断',
        onClick: quitToHome
      })
    ]);

    el.stageName = h('span', { class: 'pr-head__stage', text: EST.stage.stageLabel(S.tp.stage) });
    el.stageCount = h('span', { class: 'pr-head__count' });
    el.main = h('div', { class: 'pr-main' });
    el.timeBar = h('div', { class: 'pr-bar__fill' });
    el.timeBarWrap = h('div', { class: 'pr-bar hidden' }, [el.timeBar]);
    el.levelBar = h('div', { class: 'pr-level__fill' });
    el.meter = h('div', { class: 'pr-meter' });
    el.notice = h('div', { class: 'pr-notice' });

    var undoBtn = h('button', {
      class: 'btn btn--sm', text: '今のはナシ',
      onClick: undoLast
    });
    var recalBtn = h('button', {
      class: 'btn btn--sm', text: '再較正',
      onClick: recalibrate
    });

    var body = h('div', { class: 'practice' }, [
      h('div', { class: 'pr-head' }, [el.stageName, el.stageCount]),
      el.main,
      el.timeBarWrap,
      h('div', { class: 'pr-level' }, [el.levelBar]),
      el.notice,
      el.meter,
      h('div', { class: 'row row--tight', style: { justifyContent: 'center' } }, [undoBtn, recalBtn])
    ]);

    // タップモードでは画面中央のタップで1回とする（§2.7）
    body.addEventListener('click', function (e) {
      if (!S || !S.tapMode) return;
      if (e.target.closest('button')) return;
      onTapRep();
    });

    U.mount(S.view, body);
    refreshMeter();
  }

  // §2.7 タップモードに切り替えた理由を1行添える。行が進むと notice は
  // 消されるので、タップモードの間は毎行出し直す。
  function tapHintText() {
    return S ? (S.tapReason + '（画面をタップで1回）') : '';
  }
  function showTapReason() {
    if (!S || !el.notice) return;
    el.notice.textContent = tapHintText();
  }

  // lineId を渡すとその行の回数を出す。省略時は現在の行。
  function refreshMeter(lineId) {
    if (!S) return;
    var reps = (S.tp.stageReps && S.tp.stageReps[S.tp.stage]) || 0;
    el.stageCount.textContent = reps + '回';

    var id = lineId || (S.lines[S.idx] && S.lines[S.idx].id);
    var key = id ? EST.store.progressKey(S.topic.id, id) : null;
    if (!key) return;
    EST.store.get('progress', key).then(function (p) {
      if (!S || !el.meter) return;
      var lineCount = (p && p.counts && p.counts.total) || 0;
      var laps = (S.tp.laps && S.tp.laps.total) || 0;
      var parts = ['この文 ' + lineCount + '回', 'この会話 ' + laps + '周'];
      if (EST.stage.usesBlocks(S.topic)) {
        parts.push('ブロック' + ((S.tp.blockIndex || 0) + 1) + '/' + (S.topic.blocks || []).length);
      }
      el.meter.textContent = parts.join(' / ');
    });
  }

  /* =====================================================================
     1行の進行
     ===================================================================== */
  function runLine() {
    if (!S || S.closing) return;
    var line = S.lines[S.idx];
    if (!line) return;

    var mode = EST.stage.stageMode(S.tp.stage);
    S.lastLineId = line.id;
    S.repDone = false;      // この行の確定はまだ
    S.timeLimitMs = 0;
    S.lineStartedAt = Date.now();   // §7.2 行送りの下限を測るため
    el.notice.textContent = S.tapMode ? tapHintText() : '';

    // 画面表示（§1.1 ステージに応じて手がかりを減らす）
    var U = ui();
    var parts = [];
    if (mode.showEn) parts.push(h('div', { class: 'pr-en en', text: line.en }));
    if (mode.showJa && line.ja) parts.push(h('div', { class: 'pr-ja', text: line.ja }));
    if (!mode.showEn) parts.push(h('div', { class: 'pr-hint', text: '音だけを追いかけてください' }));
    U.mount(el.main, parts);

    refreshMeter();

    // expectedMs は §2.3。実測があればそれ、無ければ語数から。
    EST.speech.expectedMsFor(S.topic.id, line.id, line.en, S.settings.ttsRate)
      .then(function (ms) {
        if (!S || S.closing) return;
        S.expectedMs = ms;
        if (mode.timeBar) startTimeBar(ms);
        beginLine(line, mode);
      });
  }

  function beginLine(line, mode) {
    if (!S || S.closing) return;
    S.cueAt = Date.now();
    if (S.micOn) EST.mic.markCue();

    if (mode.tts) {
      // §2.6 TTSが鳴るステージ。窓は開けたまま（S2・S4）。
      // S1はマイクを使わないのでそもそも開いていない。
      var gender = genderOf(line.speakerId);
      EST.speech.speak(line.en, {
        gender: gender, topicId: S.topic.id, lineId: line.id
      }).then(function (r) {
        if (!S || S.closing) return;

        // §7.2 鳴らなかった（想定より極端に短いendを鳴らし直しても駄目だった）
        // 場合は、行を進めずに止める。音が出ていないのに回数だけ積み上がると
        // 学習の記録そのものが信用できなくなる。
        if (r && r.spoken === false) {
          haltForSilentTts();
          return;
        }

        // §2.6 再生が終わったら短い猶予だけ置いて回を閉じる。
        // 2500msの自動確定に任せると1行ごとに待たされ、S4が成立しない。
        later(function () {
          if (!S || S.closing) return;
          if (S.micOn) EST.mic.closeRep();
          else onListenOnlyDone();   // S1は発話しないのでrepが来ない
        }, EST.stage.TTS_CLOSE_DELAY_MS);
      });
    }
    // TTSが鳴らないステージ（S3）は §2.2 の2500ms自動確定に任せる
  }

  /* §7.2 音が鳴らなかったときに行送りを止める。黙って進むと、聞こえて
     いないのに回数だけが積み上がる。自動で再試行し続けると同じことなので、
     ここで止めて本人に判断してもらう。 */
  function haltForSilentTts() {
    if (!S || S.closing) return;
    S.halted = true;
    clearTimers();
    el.notice.textContent = '音声が鳴りませんでした。';
    ui().dialog({
      title: '音声が鳴りませんでした',
      body: h('div', { class: 'small' }, [
        h('div', { text: '端末の音量とマナーモードを確認してください。' }),
        h('div', { style: { marginTop: '.4rem' },
          text: '記録が狂わないよう、ここで止めています。この行から再開できます。' })
      ]),
      buttons: [
        { label: '中断する', value: 'quit' },
        { label: 'この行からやり直す', value: 'retry', kind: 'primary' }
      ]
    }).then(function (v) {
      if (!S || S.closing) return;
      if (v === 'quit') { quitToHome(); return; }
      S.halted = false;
      runLine();
    });
  }

  function genderOf(speakerId) {
    var g = '';
    (S.topic.speakers || []).forEach(function (s) { if (s.id === speakerId) g = s.gender || ''; });
    return g;
  }

  /* ---- S3 の目標時間バー（§1.2） ------------------------------------------ */
  function startTimeBar(expectedMs) {
    if (!S) return;
    var factor = EST.stage.currentS3Factor(S.tp);
    var limit = expectedMs * factor;
    S.timeLimitMs = limit;
    S.timeStartedAt = Date.now();
    el.timeBarWrap.classList.remove('hidden');
    el.timeBar.style.width = '100%';
    if (S.barTimer) clearInterval(S.barTimer);
    S.barTimer = setInterval(function () {
      if (!S || S.closing) return;
      var left = Math.max(0, 1 - (Date.now() - S.timeStartedAt) / limit);
      el.timeBar.style.width = (left * 100) + '%';
      el.timeBar.classList.toggle('is-over', left <= 0);
    }, 50);
  }

  function stopTimeBar() {
    if (!S) return;
    if (S.barTimer) { clearInterval(S.barTimer); S.barTimer = null; }
    el.timeBarWrap.classList.add('hidden');
  }

  /* =====================================================================
     EST.mic からのイベント
     ===================================================================== */
  function onLevel(e) {
    if (!S || !el.levelBar) return;
    el.levelBar.style.width = Math.min(100, Math.round(e.rms * 300)) + '%';
  }

  function onRep(e) {
    if (!S || S.closing) return;
    // §2.3 カウント判定はここ（ステージ層）で行う
    var withinTime = true;
    if (S.timeLimitMs) withinTime = (Date.now() - S.timeStartedAt) <= S.timeLimitMs;

    var ok = EST.stage.judgeCount(e.spokenMs, S.expectedMs, S.countRatio);
    finishRep({
      ok: ok,
      spokenMs: e.spokenMs,
      latencyMs: e.latencyMs,
      stalls: e.stalls || [],
      withinTime: withinTime
    });
  }

  // §2.4 10秒待って発話が無かった。責める文言にしない。
  function onTimeout() {
    if (!S || S.closing) return;
    el.notice.textContent = 'もう一度どうぞ';
    finishRep({ ok: false, spokenMs: 0, latencyMs: null, stalls: [], withinTime: false, noSpeech: true });
  }

  // S1（聞くだけ）は発話しないので、再生完了をもって1回とする
  function onListenOnlyDone() {
    finishRep({ ok: true, spokenMs: 0, latencyMs: null, stalls: [], withinTime: true, listenOnly: true });
  }

  // §2.7 タップモード。spokenMsが取れないのでタップ＝成立として扱う。
  function onTapRep() {
    if (!S || S.closing) return;
    finishRep({ ok: true, spokenMs: 0, latencyMs: null, stalls: [], withinTime: true, tapped: true });
  }

  function finishRep(result) {
    if (!S || S.closing) return;
    // 1行につき1回だけ確定させる。TTS終了の closeRep と 2500ms の自動確定、
    // タップの連打などが重なると、同じ行が何度も数えられてしまう。
    if (S.repDone) return;
    S.repDone = true;
    stopTimeBar();

    var lineId = S.lastLineId;
    var stage = S.tp.stage;
    S.lastResult = { result: result, lineId: lineId, stage: stage };

    EST.stage.recordRep(S.tp, lineId, S.topic.id, result);
    EST.stage.saveTopicProgress(S.tp);
    // 保存が終わってからメーターを描き直す。先に描くと、いま数えた1回が
    // 反映される前の値（この文 0回）が出てしまう。
    EST.stage.recordLineProgress(S.topic.id, lineId, stage, result)
      .then(function () { refreshMeter(lineId); });
    if (result.ok && !result.listenOnly) flash();

    // §7.2 行が進む最短間隔に下限を置く。何かが壊れて即座に確定が返っても、
    // これ以上速くは流れない（画面が流れ去るのを防ぐ最後の砦）。
    var elapsed = Date.now() - (S.lineStartedAt || 0);
    later(nextLine, Math.max(NEXT_LINE_DELAY_MS, MIN_LINE_INTERVAL_MS - elapsed));
  }

  function flash() {
    if (!el.main) return;
    el.main.classList.add('is-ok');
    later(function () { if (el.main) el.main.classList.remove('is-ok'); }, 260);
  }

  /* ---- 次の行・次の周（§3 進行は自動） ------------------------------------- */
  function nextLine() {
    if (!S || S.closing) return;
    S.idx++;
    if (S.idx < S.lines.length) { runLine(); return; }

    // 最終行まで行った → 1周
    S.idx = 0;
    S.tp.laps = S.tp.laps || { total: 0, byStage: {} };
    S.tp.laps.total = (S.tp.laps.total || 0) + 1;
    S.tp.laps.byStage[S.tp.stage] = (S.tp.laps.byStage[S.tp.stage] || 0) + 1;
    EST.stage.saveTopicProgress(S.tp);

    // §1.2 条件を満たしたら控えめに知らせる。進級は強制しない。
    if (EST.stage.canAdvance(S.tp)) showAdvanceOffer();
    else runLine();
  }

  function showAdvanceOffer() {
    var U = ui();
    var nx = EST.stage.nextStage(S.tp.stage);
    if (!nx) { runLine(); return; }
    el.notice.textContent = '';

    U.dialog({
      title: EST.stage.stageLabel(nx) + ' に進めます',
      body: h('div', { class: 'small' }, [
        h('div', { text: '押さなければ ' + EST.stage.stageLabel(S.tp.stage) + ' を続けられます。回数は積み上がります。' })
      ]),
      buttons: [
        { label: '続ける', value: 'stay' },
        { label: '進む', value: 'go', kind: 'primary' }
      ]
    }).then(function (v) {
      if (!S || S.closing) return;
      if (v === 'go') {
        EST.stage.advance(S.tp);
        EST.stage.saveTopicProgress(S.tp);
        // ステージが変わるとTTS・マイクの扱いも変わるので入り直す
        var topicId = S.topic.id;
        stopSession();
        renderPractice(document.getElementById('view'), topicId);
        return;
      }
      runLine();
    });
  }

  /* ---- 「今のはナシ」（§2.4） --------------------------------------------- */
  function undoLast() {
    if (!S || !S.lastResult) { ui().toast('取り消せる記録がありません'); return; }
    var last = S.lastResult;
    S.lastResult = null;

    try { EST.mic.cancelLast(); } catch (e) {}
    // ステージ側の連続カウントも巻き戻す
    if (last.stage === 'S2' || last.stage === 'S4') S.tp.streak = 0;
    if (last.stage === 'S3') S.tp.s3Streak = 0;
    S.tp.stageReps[last.stage] = Math.max(0, (S.tp.stageReps[last.stage] || 0) - 1);

    EST.stage.undoLineProgress(S.topic.id, last.lineId, last.stage, last.result)
      .then(function () {
        EST.stage.saveTopicProgress(S.tp);
        refreshMeter();
        ui().toast('直前の1回を取り消しました');
      });
  }

  function recalibrate() {
    var U = ui();
    U.toast('1.5秒間、静かにしてください…');
    EST.mic.calibrate().then(function (r) {
      U.toast(r.tooNoisy ? '静かな場所で較正し直してください' : '較正しました');
    }).catch(function () {
      U.toast('マイクを使えませんでした');
    });
  }

  function quitToHome() {
    var topicId = S ? S.topic.id : null;
    stopSession();
    location.hash = topicId ? ('#/topic/' + encodeURIComponent(topicId)) : '#/';
  }

  /* ---- Screen Wake Lock（§3。非対応環境は諦める） -------------------------- */
  function requestWakeLock() {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    navigator.wakeLock.request('screen').then(function (w) {
      wakeLock = w;
    }).catch(function () { /* 非対応・拒否は諦める */ });
  }

  function releaseWakeLock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }

  EST.uiPractice = {
    renderPractice: renderPractice,
    stopSession: stopSession
  };
})(window.EST = window.EST || {});

</script>
<script>
/* ---- 12-ui-import.js ---- */
/* =====================================================================
   12-ui-import.js — 台本の取り込み3経路と編集プレビュー
   SPEC §6.1（経路1 貼り付け / 経路2 JSON / 経路3 空から作る）
        §6.2（全経路の合流点である編集プレビュー）
        §6.3（取り込み処理）
   ===================================================================== */
;(function (EST) {
  'use strict';

  var h = null;
  function ui() { h = EST.ui.h; return EST.ui; }

  // 編集中の下書き。画面を離れても保持し、#/edit/new で戻ってこられるようにする。
  var state = null;

  // 再描画で作り直す要素の参照
  var elStats = null, elLines = null, elWords = null, elSpeakers = null;
  var rowEls = [];

  var PASTE_SAMPLE =
    'Staff: How long are you staying?\n' +
    'ご滞在はどのくらいですか？\n' +
    'You: About ten days.\n' +
    '10日ほどです。';

  /* =====================================================================
     取り込み画面
     ===================================================================== */
  function renderImport(view) {
    var U = ui();
    // §5.9 編集できない部屋からURL直打ちで入ってきた場合はホームへ戻す
    if (!EST.profile.canEdit()) { location.hash = '#/'; return; }
    EST.app.setBar('新規トピック', [
      h('button', { class: 'btn btn--sm', text: 'ホーム', onClick: function () { location.hash = '#/'; } })
    ]);

    var ta = h('textarea', {
      class: 'paste-area',
      placeholder: '台本をそのまま貼り付けてください。JSONを貼っても構いません。'
    });

    var card = h('div', { class: 'card' }, [
      h('h2', { class: 'card__title', text: '台本を貼り付ける' }),
      ta,
      h('div', { class: 'row', style: { marginTop: '.5rem' } }, [
        h('button', { class: 'btn btn--primary', text: '解析する', onClick: function () { onAnalyze(ta.value); } }),
        h('button', { class: 'btn', text: 'JSONファイルを選ぶ', onClick: onPickFile }),
        h('button', { class: 'btn', text: '空から作る', onClick: onBlank })
      ])
    ]);

    var hint = h('div', { class: 'card card--flat' }, [
      h('h2', { class: 'card__title', text: '読み取れる形式' }),
      h('div', { class: 'small muted' }, [
        '話者ラベルあり／なし、英日交互、タブや「|」での列分け、',
        '英文をまとめて書いたあとに和文をまとめて書く形（間に空行2つか --- を入れる）、英文だけ。',
        'どの形でも解析後に編集画面で直せます。'
      ]),
      h('div', { class: 'sample-hint en', style: { marginTop: '.5rem' }, text: PASTE_SAMPLE })
    ]);

    U.mount(view, [card, hint]);
    try { ta.focus(); } catch (e) {}
  }

  function onAnalyze(text) {
    var U = ui();
    var trimmed = String(text || '').trim();
    if (!trimmed) { U.toast('台本を貼り付けてください'); return; }

    // JSONらしければ経路2、そうでなければ経路1に自動で振り分ける（§6.1）
    if (/^[\[{]/.test(trimmed)) {
      var r = EST.schema.parseJsonWithPosition(trimmed);
      if (r.ok) { fromJson(r.value); return; }
      U.alert('JSONとして読めませんでした', [
        r.error, r.where ? ('位置: ' + r.where) : '（位置を特定できませんでした）'
      ]);
      return;
    }
    fromText(trimmed);
  }

  function onPickFile() {
    var U = ui();
    U.pickFile('.json,application/json').then(function (f) {
      if (!f) return;
      var r = EST.schema.parseJsonWithPosition(f.text);
      if (!r.ok) {
        U.alert('JSONとして読めませんでした', [r.error, r.where ? ('位置: ' + r.where) : '']);
        return;
      }
      fromJson(r.value);
    });
  }

  function onBlank() {
    var t = EST.schema.normalizeTopic({
      title: '',
      audience: EST.profile.get(),   // §5.9 新規作成時の既定は「自分用」
      speakers: [{ id: 'S1', label: 'A' }, { id: 'S2', label: 'B' }],
      lines: [
        { speakerId: 'S1', en: '', ja: '' },
        { speakerId: 'S2', en: '', ja: '' }
      ]
    });
    openEditor(t, true, ['空のトピックです。英文と和訳を入れてください。']);
  }

  function fromText(text) {
    var U = ui();
    var parsed = EST.schema.parseScript(text);
    if (!parsed.lines.length) {
      U.alert('解析できませんでした', ['英文として読める行が見つかりませんでした。']);
      return;
    }
    var t = EST.schema.normalizeTopic({
      title: '',
      audience: EST.profile.get(),   // §5.9 新規作成時の既定は「自分用」
      speakers: parsed.speakers,
      lines: parsed.lines
    });
    openEditor(t, true, parsed.warnings);
  }

  function fromJson(value) {
    var U = ui();
    if (value && value.kind === EST.backup.BACKUP_KIND) {
      U.alert('これはバックアップです', ['全体バックアップのJSONは「設定 → バックアップ」から復元してください。']);
      return;
    }
    var warnings = [];
    if (Array.isArray(value)) {
      if (!value.length) { U.alert('取り込めません', ['配列が空です。']); return; }
      warnings.push('配列が渡されたので先頭の1件だけを取り込みました');
      value = value[0];
    }
    // §6.3: audience の「未指定なら both」は外部JSON専用の救済だが、
    // ここ（編集画面への入り口）では適用しない。黙って値が入ると、
    // 選んだつもりのないまま相手の一覧に流れ込みかねないため、
    // myRole と同じく「未指定のまま」で編集画面に通し、保存時に必須で止める。
    var check = EST.schema.validateTopic(value, { requireMyRole: false, requireAudience: false });
    var t = EST.schema.normalizeTopic(value);
    if (check.errors.length) {
      // エラーがあっても編集画面までは通す。直す場所が見えないと直せないため。
      warnings = warnings.concat(check.errors);
    }
    if (!t.myRole) warnings.push('自分の役が指定されていません。保存前に選んでください');
    if (!t.audience) warnings.push('誰の台本か（自分用・相手用・両方）が指定されていません。保存前に選んでください');
    openEditor(t, true, warnings);
  }

  /* =====================================================================
     編集プレビュー（§6.2）
     ===================================================================== */
  function openEditor(topic, isNew, warnings) {
    state = makeState(topic, isNew, warnings);
    location.hash = '#/edit/new';
  }

  function makeState(topic, isNew, warnings) {
    var t = EST.schema.normalizeTopic(topic);
    var starts = EST.schema.blocksToStarts(t.blocks, t.lines);
    return {
      topic: t,
      starts: starts,
      blockLabels: (t.blocks || []).map(function (b) { return b.label; }),
      isNew: !!isNew,
      warnings: warnings || [],
      open: {}     // 行ID -> 詳細（メモ・チャンク）を開いているか
    };
  }

  function renderEditor(view, id) {
    var U = ui();
    if (!EST.profile.canEdit()) { location.hash = '#/'; return; }
    if (id === 'new') {
      if (!state) { location.hash = '#/import'; return; }
      build(view);
      return;
    }
    if (state && !state.isNew && state.topic.id === id) { build(view); return; }
    EST.store.get('topics', id).then(function (t) {
      if (!t) {
        EST.app.setBar('編集', []);
        U.mount(view, h('div', { class: 'empty', text: 'このトピックは見つかりませんでした。' }));
        return;
      }
      state = makeState(t, false, []);
      build(view);
    });
  }

  function build(view) {
    var U = ui();
    EST.app.setBar(state.isNew ? '編集プレビュー' : '編集', [
      h('button', { class: 'btn btn--sm', text: '破棄', onClick: discard }),
      h('button', { class: 'btn btn--sm btn--primary', text: '保存', onClick: save })
    ]);

    elStats = h('div', { class: 'stat-bar' });
    elSpeakers = h('div', {});
    elLines = h('div', {});
    elWords = h('div', {});

    var warnBox = state.warnings && state.warnings.length
      ? h('div', { class: 'note-box note-box--warn', style: { marginBottom: '.7rem' } }, [
          h('div', { text: '解析結果の確認' }),
          h('ul', {}, state.warnings.map(function (w) { return h('li', { text: w }); }))
        ])
      : null;

    U.mount(view, [
      elStats,
      warnBox,
      metaCard(),
      h('div', { class: 'card' }, [
        h('div', { class: 'card__head' }, [
          h('h2', { class: 'card__title', text: '話者' }),
          h('button', { class: 'btn btn--sm', text: '＋ 話者', onClick: addSpeaker })
        ]),
        h('div', { class: 'tiny muted', style: { marginBottom: '.4rem' },
          text: 'ここで名前を変えると、全部の行の話者名がまとめて変わります。' }),
        elSpeakers
      ]),
      h('div', { class: 'card' }, [
        h('div', { class: 'card__head' }, [
          h('h2', { class: 'card__title', text: '行' }),
          h('button', { class: 'btn btn--sm', text: '＋ ブロック境界', onClick: addBoundary })
        ]),
        elLines,
        h('button', {
          class: 'btn btn--block', text: '＋ 行を追加', style: { marginTop: '.4rem' },
          onClick: function () { addLine(state.topic.lines.length - 1); }
        })
      ]),
      h('div', { class: 'card' }, [
        h('div', { class: 'card__head' }, [
          h('h2', { class: 'card__title', text: '語彙' }),
          h('button', { class: 'btn btn--sm', text: '＋ 語彙', onClick: addWord })
        ]),
        h('div', { class: 'tiny muted', style: { marginBottom: '.4rem' },
          text: '語彙の自動抽出は F6 で入ります。ここでは手で足し引きできます。' }),
        elWords
      ]),
      h('div', { class: 'row', style: { marginTop: '.8rem' } }, [
        h('button', { class: 'btn btn--primary grow', text: '保存する', onClick: save }),
        h('button', { class: 'btn', text: '破棄', onClick: discard })
      ])
    ]);

    renderSpeakers();
    renderLines();
    renderWords();
    updateStats();
  }

  /* ---- 上部の見出し（タイトル・自分の役） ------------------------------ */
  function metaCard() {
    var t = state.topic;
    return h('div', { class: 'card' }, [
      h('label', { class: 'field' }, [
        h('span', { class: 'field__label', text: 'タイトル（日本語）' }),
        h('input', { type: 'text', value: t.title, placeholder: '例: 空港のチェックインカウンター',
          onInput: function (e) { t.title = e.target.value; } })
      ]),
      h('label', { class: 'field', style: { marginTop: '.4rem' } }, [
        h('span', { class: 'field__label', text: 'タイトル（英語・任意）' }),
        h('input', { type: 'text', class: 'en', value: t.titleEn,
          onInput: function (e) { t.titleEn = e.target.value; } })
      ]),
      h('div', { class: 'row', style: { marginTop: '.4rem' } }, [
        h('label', { class: 'field grow' }, [
          h('span', { class: 'field__label', text: 'レベル' }),
          h('input', { type: 'text', value: t.level, placeholder: 'B1',

          h('span', { class: 'field__label', text: 'タグ（カンマ区切り）' }),
          h('input', { type: 'text', value: (t.tags || []).join(', '),
            onInput: function (e) {
              t.tags = e.target.value.split(/[,、]/).map(function (s) { return s.trim(); }).filter(Boolean);
            } })
        ])
      ]),
      h('div', { style: { marginTop: '.5rem' } }, [
        h('span', { class: 'field__label', text: '自分の役（S5・S6で使うので必須）' }),
        h('div', { class: 'row row--tight', id: 'myrole-box' }, myRoleButtons())
      ]),
      h('div', { style: { marginTop: '.5rem' } }, [
        h('span', { class: 'field__label', text: '誰の台本か（§5.9）' }),
        h('div', { class: 'row row--tight', id: 'audience-box' }, audienceButtons()),
        h('div', { class: 'tiny muted', text: '相手用にすると、この台本は自分のトピック一覧から外れます。' })
      ])
    ]);
