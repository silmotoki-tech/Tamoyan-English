<style>
/* =====================================================================
   英会話台本トレーナー スタイル
   - 英文と日本語でフォントを分ける（英文が日本語フォントだと読みにくく、
     音読の質に直接響くため。SPEC §12）
   - 色はすべて変数にしておき、テーマ切り替えは :root の属性だけで行う
   ===================================================================== */

:root {
  --fs: 1;

  --font-ja: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --font-en: -apple-system, "Segoe UI", Roboto, sans-serif;

  --bg:      #faf9f7;
  --panel:   #ffffff;
  --panel2:  #f4f2ee;
  --ink:     #1d1c1a;
  --muted:   #6f6a63;
  --line:    #e2ded7;
  --accent:  #2f6f4f;
  --accent-ink: #ffffff;
  --danger:  #a8352b;
  --warn-bg: #fdf3d6;
  --warn-ink:#6d5400;
  --err-bg:  #fbe9e7;
  --err-ink: #8f2a20;
  --chip:    #eeebe5;
  --shadow:  0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
}

/* 端末設定に追従（data-theme="auto" のとき） */
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg:      #17181a;
    --panel:   #212326;
    --panel2:  #2a2d31;
    --ink:     #e9e7e3;
    --muted:   #9a958d;
    --line:    #383c41;
    --accent:  #6fbf92;
    --accent-ink: #10231a;
    --danger:  #e0796d;
    --warn-bg: #3a3218;
    --warn-ink:#e6cf8a;
    --err-bg:  #3b2320;
    --err-ink: #f0a99f;
    --chip:    #32363b;
    --shadow:  0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg:      #17181a;
  --panel:   #212326;
  --panel2:  #2a2d31;
  --ink:     #e9e7e3;
  --muted:   #9a958d;
  --line:    #383c41;
  --accent:  #6fbf92;
  --accent-ink: #10231a;
  --danger:  #e0796d;
  --warn-bg: #3a3218;
  --warn-ink:#e6cf8a;
  --err-bg:  #3b2320;
  --err-ink: #f0a99f;
  --chip:    #32363b;
  --shadow:  0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }

html {
  /* 文字サイズ設定（fontScale）は :root の変数だけで効かせる */
  font-size: calc(16px * var(--fs));
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ja);
  line-height: 1.7;
  font-size: 1rem;
}

/* 英文はここで必ず英字フォントに切り替える */
.en, input.en, textarea.en { font-family: var(--font-en); }

.app { min-height: 100vh; }

/* ---- アプリバー --------------------------------------------------
   上端の safe-area を必ず見込む。ポータル（タモやんApps）から
   ホーム画面アプリとして開くと、ポータル側の
   apple-mobile-web-app-status-bar-style: black-translucent が効き、
   viewport-fit=cover と相まって内容がiOSのステータスバーの下に潜り込む。
   時計やバッテリーとタイトルが重なるのを防ぐ。
   ステータスバーが不透明なとき（単体でSafariから追加した場合）は
   inset が 0 になるので、この指定は何もしない。 */
.appbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: .5rem;
  min-height: 3rem;
  padding: calc(.45rem + env(safe-area-inset-top))
           max(.75rem, env(safe-area-inset-right))
           .45rem
           max(.75rem, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line);
}
.appbar__title { font-size: 1rem; font-weight: 700; flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appbar__actions { display: flex; gap: .35rem; flex: 0 0 auto; }

.view {
  max-width: 44rem; margin: 0 auto;
  padding: .85rem
           max(.75rem, env(safe-area-inset-right))
           calc(5rem + env(safe-area-inset-bottom))
           max(.75rem, env(safe-area-inset-left));
}

/* ---- 汎用パーツ ---------------------------------------------------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: .7rem;
  padding: .85rem;
  margin: 0 0 .75rem;
  box-shadow: var(--shadow);
}
.card--flat { box-shadow: none; }
.card__head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .5rem; }
.card__title { font-size: .95rem; font-weight: 700; margin: 0; flex: 1 1 auto; }

.section-title { font-size: .78rem; font-weight: 700; color: var(--muted);
  letter-spacing: .04em; margin: 1.2rem 0 .45rem; }

.muted { color: var(--muted); }
.small { font-size: .8rem; }
.tiny  { font-size: .72rem; }
.mono  { font-variant-numeric: tabular-nums; }
.right { margin-left: auto; }
.row   { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.row--tight { gap: .3rem; }
.stack > * + * { margin-top: .5rem; }
.grow  { flex: 1 1 auto; min-width: 0; }
.hidden { display: none !important; }

/* ボタン */
.btn {
  font: inherit; font-size: .85rem; font-family: var(--font-ja);
  padding: .42rem .8rem; border-radius: .5rem;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  cursor: pointer; line-height: 1.4; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover:not(:disabled) { background: var(--panel2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn--primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--sm { font-size: .75rem; padding: .25rem .5rem; }
.btn--icon { font-size: .8rem; padding: .25rem .45rem; min-width: 1.9rem; }
.btn--block { width: 100%; justify-content: center; }
.btn--wide { display: block; width: 100%; text-align: left; padding: .7rem .8rem; }

/* 入力 */
input[type="text"], input[type="number"], textarea, select {
  font: inherit; font-size: .9rem; font-family: var(--font-ja);
  width: 100%; padding: .45rem .55rem;
  border: 1px solid var(--line); border-radius: .45rem;
  background: var(--panel); color: var(--ink);
}
textarea { resize: vertical; line-height: 1.55; }
input:focus, textarea:focus, select:focus {
  outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px;
}
label.field { display: block; }
label.field > .field__label { display: block; font-size: .72rem; color: var(--muted); margin-bottom: .15rem; }

/* チップ */
.chip {
  display: inline-flex; align-items: center; gap: .25rem;
  font-size: .72rem; padding: .12rem .45rem; border-radius: 1rem;
  background: var(--chip); color: var(--muted); white-space: nowrap;
}
.chip--btn { cursor: pointer; border: none; font-family: var(--font-ja); }
.chip--btn:hover { filter: brightness(.96); }

/* 通知 */
.note-box { border-radius: .5rem; padding: .5rem .65rem; font-size: .8rem; }
.note-box--warn { background: var(--warn-bg); color: var(--warn-ink); }
.note-box--err  { background: var(--err-bg);  color: var(--err-ink); }
.note-box ul { margin: .3rem 0 0; padding-left: 1.1rem; }
.note-box li { margin: .1rem 0; }

/* トースト */
.toast-root { position: fixed; left: 0; right: 0; z-index: 60;
  bottom: calc(1.2rem + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: .4rem; pointer-events: none; }
.toast { background: #22262b; color: #f4f2ee; font-size: .82rem;
  padding: .5rem .9rem; border-radius: 1.2rem; box-shadow: 0 6px 20px rgba(0,0,0,.28);
  max-width: 90vw; }

/* ダイアログ */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.42);
  display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: var(--panel); border-radius: .8rem; padding: 1rem;
  width: min(28rem, 100%); max-height: 84vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.modal__title { font-size: .95rem; font-weight: 700; margin: 0 0 .5rem; }
.modal__body { font-size: .87rem; }
.modal__actions { display: flex; gap: .4rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .9rem; }

/* ---- ホーム -------------------------------------------------------- */
.home-item { display: flex; align-items: center; gap: .6rem; width: 100%;
  padding: .7rem .8rem; border: 1px solid var(--line); background: var(--panel);
  border-radius: .6rem; margin-bottom: .4rem; font: inherit; font-size: .9rem;
  color: var(--ink); text-align: left; cursor: pointer; }
.home-item:hover:not(:disabled) { background: var(--panel2); }
.home-item:disabled { opacity: .5; cursor: default; }
.home-item__icon { font-size: 1rem; flex: 0 0 auto; width: 1.4rem; text-align: center; }
.home-item__body { flex: 1 1 auto; min-width: 0; }
.home-item__sub { font-size: .72rem; color: var(--muted); }

.topic-card { display: block; width: 100%; text-align: left; cursor: pointer;
  font: inherit; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: .6rem;
  padding: .7rem .8rem; margin-bottom: .45rem; }
.topic-card:hover { background: var(--panel2); }
.topic-card__title { font-weight: 700; font-size: .92rem; }
.topic-card__meta { font-size: .74rem; color: var(--muted); margin-top: .15rem; }

.empty { text-align: center; color: var(--muted); font-size: .85rem; padding: 1.6rem .5rem; }

/* ---- トピック詳細 --------------------------------------------------- */
.line-view { display: flex; gap: .55rem; padding: .5rem 0; border-top: 1px solid var(--line); }
.line-view:first-child { border-top: none; }
.line-view__no { flex: 0 0 2.6rem; font-size: .7rem; color: var(--muted); padding-top: .2rem; }
.line-view__en { font-size: .95rem; }
.line-view__ja { font-size: .8rem; color: var(--muted); }
.line-view__mine { color: var(--accent); font-weight: 700; }

.block-head { font-size: .74rem; font-weight: 700; color: var(--muted);
  background: var(--panel2); border-radius: .35rem; padding: .18rem .5rem; margin: .6rem 0 .2rem; }

/* ---- 一覧モード（§4.1）・検索結果の行 -------------------------------
   行は div、中に「開くボタン」と「🔊」を並べる。行自体をbuttonにすると
   🔊が button の入れ子になり、HTMLとして不正になるため。 */
.list-row { display: flex; align-items: flex-start; gap: .25rem;
  border-top: 1px solid var(--line); }
.list-row:first-child { border-top: none; }
.list-row:hover { background: var(--panel2); }
.list-row__main { flex: 1 1 auto; min-width: 0; display: block; text-align: left;
  cursor: pointer; font: inherit; font-size: .9rem; color: var(--ink);
  background: transparent; border: none; border-radius: 0; padding: .55rem .15rem; }

/* 🔊 音声再生。使えない環境ではそもそも描画しない（02-speech.js 側で判定） */
.speak-btn { flex: 0 0 auto; align-self: center; cursor: pointer;
  background: transparent; border: none; border-radius: .4rem;
  font-size: .95rem; line-height: 1; padding: .4rem .45rem;
  -webkit-tap-highlight-color: transparent; }
.speak-btn:hover { background: var(--chip); }
.speak-btn:active { transform: scale(0.92); }

/* 通して再生（§11 F3「台本を入れて聞き流す」）で読み上げ中の行 */
.line-view.is-playing { background: color-mix(in srgb, var(--accent) 12%, transparent);
  border-radius: .35rem; }

/* ---- 編集プレビュー ------------------------------------------------- */
.stat-bar { position: sticky; top: 3rem; z-index: 15;
  background: var(--panel2); border: 1px solid var(--line); border-radius: .5rem;
  padding: .4rem .6rem; font-size: .76rem; color: var(--muted);
  margin-bottom: .7rem; display: flex; flex-wrap: wrap; gap: .1rem .8rem; }
.stat-bar b { color: var(--ink); font-variant-numeric: tabular-nums; }

.ed-line { border: 1px solid var(--line); border-radius: .55rem; background: var(--panel);
  padding: .5rem .55rem; margin-bottom: .35rem; }
.ed-line.is-drop { border-color: var(--accent); box-shadow: 0 -3px 0 -1px var(--accent) inset; }
.ed-line__top { display: flex; align-items: center; gap: .35rem; margin-bottom: .35rem; }
.ed-line__no { font-size: .7rem; color: var(--muted); min-width: 1.6rem; }
.ed-line__sp { width: auto; max-width: 9rem; font-size: .78rem; padding: .2rem .35rem; }
.ed-line__tools { display: flex; gap: .2rem; margin-left: auto; flex-wrap: wrap; }
.ed-line textarea { font-size: .88rem; }
.ed-line textarea.ja-in { font-size: .82rem; }
.ed-line__extra { margin-top: .35rem; padding-top: .35rem; border-top: 1px dashed var(--line); }

/* チャンク境界エディタ（§1.8。自動分割は必ず外すのでタップで直せるようにする） */
.chunks { font-family: var(--font-en); font-size: .82rem; line-height: 2.1; }
.chunks__w { padding: .05rem 0; }
.chunks__gap { display: inline-block; width: .85rem; text-align: center; color: var(--line);
  cursor: pointer; border-radius: .2rem; user-select: none; }
.chunks__gap:hover { background: var(--chip); color: var(--muted); }
.chunks__bar { display: inline-block; width: 1rem; text-align: center; color: var(--accent);
  cursor: pointer; font-weight: 700; border-radius: .2rem; user-select: none; }
.chunks__bar:hover { background: var(--chip); }

/* ブロック境界（ドラッグで動かす） */
.blk-div { display: flex; align-items: center; gap: .4rem; margin: .5rem 0 .35rem;
  padding: .25rem .35rem; border-radius: .4rem; background: var(--panel2);
  border: 1px dashed var(--line); }
.blk-div.is-dragging { border-style: solid; border-color: var(--accent); opacity: .85; }
.blk-div__grip { cursor: grab; touch-action: none; user-select: none;
  font-size: .8rem; color: var(--muted); padding: .1rem .35rem; border-radius: .3rem; }
.blk-div__grip:active { cursor: grabbing; }
.blk-div__label { font-size: .76rem; padding: .15rem .4rem; max-width: 12rem; }
.blk-div__no { font-size: .7rem; color: var(--muted); font-weight: 700; }

/* 語彙エディタ */
.word-row { border: 1px solid var(--line); border-radius: .5rem; padding: .45rem .5rem;
  margin-bottom: .35rem; background: var(--panel); }
.word-row__grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: .3rem; align-items: start; }
.word-row__ids { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .3rem; align-items: center; }
@media (max-width: 30rem) {
  .word-row__grid { grid-template-columns: 1fr; }
}

/* 貼り付け画面 */
.paste-area { min-height: 12rem; font-size: .85rem; }
.sample-hint { background: var(--panel2); border-radius: .45rem; padding: .5rem .6rem;
  font-size: .74rem; color: var(--muted); white-space: pre-wrap; }
.sample-hint .en { font-size: .76rem; }

/* 設定 */
.setting-row { display: flex; align-items: center; gap: .6rem; padding: .5rem 0;
  border-top: 1px solid var(--line); }
.setting-row:first-child { border-top: none; }
.setting-row__label { flex: 1 1 auto; font-size: .86rem; }
.setting-row__sub { font-size: .72rem; color: var(--muted); }
.setting-row select, .setting-row input { width: auto; min-width: 6rem; }

/* ---- 練習画面（§3）------------------------------------------------
   音読中の画面は極限まで削る。情報が多いと画面を見てしまう。 */
.practice { display: flex; flex-direction: column; min-height: 70vh; gap: .6rem; }
.pr-head { display: flex; justify-content: space-between; font-size: .78rem;
  color: var(--muted); }
.pr-main { flex: 1 1 auto; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 1.5rem .5rem; border-radius: .6rem; transition: background .2s; }
.pr-main.is-ok { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.pr-en { font-size: 1.35rem; line-height: 1.5; }
.pr-ja { font-size: .9rem; color: var(--muted); margin-top: .6rem; }
.pr-hint { font-size: .85rem; color: var(--muted); }

/* S3の目標時間バー（§1.2） */
.pr-bar { height: .4rem; background: var(--panel2); border-radius: .2rem; overflow: hidden; }
.pr-bar__fill { height: 100%; width: 100%; background: var(--accent);
  transition: width 50ms linear; }
.pr-bar__fill.is-over { background: var(--danger); }

/* 音量バー（§3 必須。検知されているのが見えないと手動タップに戻ってしまう） */
.pr-level { height: .3rem; background: var(--panel2); border-radius: .2rem; overflow: hidden; }
.pr-level__fill { height: 100%; width: 0%; background: var(--accent);
  transition: width 60ms linear; }

.pr-notice { min-height: 1.2rem; font-size: .82rem; color: var(--muted); text-align: center; }
.pr-meter { font-size: .72rem; color: var(--muted); text-align: center; }

/* マイク診断パネル（§2.1〜§2.5。設定画面のみ。練習画面の常時ボタンはF5） */
.mic-meter { height: .55rem; border-radius: .3rem; background: var(--panel2);
  overflow: hidden; }
.mic-meter__fill { height: 100%; width: 0%; background: var(--accent);
  transition: width 60ms linear; }
.mic-log { margin-top: .4rem; min-height: 1.2rem; font-family: ui-monospace, monospace; }

</style>

window.EST = window.EST || {};
window.EST.SAMPLES = [{"id":"tpc_sample_checkin","title":"空港のチェックインカウンター","titleEn":"At the Check-in Counter","level":"B1","tags":["旅行","空港"],"audience":"tamo","myRole":"S2","speakers":[{"id":"S1","label":"Agent","gender":"female"},{"id":"S2","label":"You","gender":"male"}],"blocks":[],"lines":[{"id":"ln_001","speakerId":"S1","en":"Good morning. May I see your passport, please?","ja":"おはようございます。パスポートを拝見してもよろしいですか？","note":"May I 〜 は Can I 〜 より丁寧。カウンター業務では定番。","skip":false},{"id":"ln_002","speakerId":"S2","en":"Sure, here you go.","ja":"はい、どうぞ。","note":"Here you go. は物を手渡すときの定型。","skip":false},{"id":"ln_003","speakerId":"S1","en":"Thank you. Are you checking any bags today?","ja":"ありがとうございます。本日、お預けの荷物はございますか？","note":"check a bag = 荷物を預ける。","skip":false},{"id":"ln_004","speakerId":"S2","en":"Yes, just this one suitcase.","ja":"はい、このスーツケース一つだけです。","note":"just = only。会話では just のほうが自然で柔らかい。","skip":false},{"id":"ln_005","speakerId":"S1","en":"Could you place it on the scale for me?","ja":"こちらの計りに載せていただけますか？","note":"place = put のフォーマル版。","skip":false},{"id":"ln_006","speakerId":"S2","en":"There you go. Is it under the weight limit?","ja":"はい、載せました。重量制限は超えていませんか？","note":"There you go. は動作を完了したときの「はい、どうぞ」。","skip":false},{"id":"ln_007","speakerId":"S1","en":"It's twenty-two kilos, so you're fine. The limit is twenty-three.","ja":"22キロですので大丈夫です。制限は23キロまでです。","note":"you're fine = 問題ありません。","skip":false},{"id":"ln_008","speakerId":"S2","en":"Great. Could I get an aisle seat if possible?","ja":"よかった。できれば通路側の席をお願いできますか？","note":"aisle seat = 通路側。if possible を添えると角が立たない。","skip":false},{"id":"ln_009","speakerId":"S1","en":"Let me check. I have one available near the front.","ja":"確認いたします。前方に一席空きがございます。","note":"Let me check. は「確認します」の最頻出フレーズ。","skip":false},{"id":"ln_010","speakerId":"S2","en":"That would be perfect. Thank you so much.","ja":"それで完璧です。本当にありがとうございます。","note":"提案を受け入れるときの丁寧な言い方。","skip":false},{"id":"ln_011","speakerId":"S1","en":"Here's your boarding pass. Your gate is B12 and boarding starts at ten forty.","ja":"こちらが搭乗券です。ゲートはB12、搭乗開始は10時40分です。","note":"時刻は ten forty のように読む。","skip":false},{"id":"ln_012","speakerId":"S2","en":"Got it. Thanks for your help. Have a good one.","ja":"承知しました。ご対応ありがとうございます。良い一日を。","note":"Have a good one. は Have a nice day. のカジュアル版。","skip":false}],"words":[{"id":"w_001","en":"Here you go.","ja":"はい、どうぞ","type":"phrase","lineIds":["ln_002"],"note":"物を手渡すとき"},{"id":"w_002","en":"check a bag","ja":"荷物を預ける","type":"phrase","lineIds":["ln_003"],"note":""},{"id":"w_003","en":"place it on the scale","ja":"計りに載せる","type":"phrase","lineIds":["ln_005"],"note":""},{"id":"w_004","en":"There you go.","ja":"はい、できました","type":"phrase","lineIds":["ln_006"],"note":"動作を完了したとき"},{"id":"w_005","en":"weight limit","ja":"重量制限","type":"phrase","lineIds":["ln_006"],"note":""},{"id":"w_006","en":"You're fine.","ja":"問題ありません","type":"phrase","lineIds":["ln_007"],"note":""},{"id":"w_007","en":"aisle seat","ja":"通路側の席","type":"phrase","lineIds":["ln_008"],"note":"窓側は window seat"},{"id":"w_008","en":"if possible","ja":"できれば","type":"phrase","lineIds":["ln_008"],"note":"後ろに添えると柔らかくなる"},{"id":"w_009","en":"Let me check.","ja":"確認しますね","type":"phrase","lineIds":["ln_009"],"note":""},{"id":"w_010","en":"available","ja":"空いている、利用できる","type":"word","lineIds":["ln_009"],"note":""},{"id":"w_011","en":"That would be perfect.","ja":"それで完璧です","type":"phrase","lineIds":["ln_010"],"note":"提案を受け入れる丁寧な言い方"},{"id":"w_012","en":"boarding pass","ja":"搭乗券","type":"phrase","lineIds":["ln_011"],"note":""},{"id":"w_013","en":"Have a good one.","ja":"良い一日を","type":"phrase","lineIds":["ln_012"],"note":"Have a nice day. のカジュアル版"}],"createdAt":1754179200000,"updatedAt":1754179200000,"schemaVersion":3},{"id":"tpc_sample_simcard","title":"空港でSIMカードを購入する","titleEn":"Buying a SIM Card at the Airport","level":"B1","tags":["旅行","買い物","空港"],"audience":"tamo","myRole":"S2","speakers":[{"id":"S1","label":"Staff","gender":"female"},{"id":"S2","label":"You","gender":"male"}],"blocks":[{"id":"b1","label":"用件を伝える","from":"ln_001","to":"ln_006"},{"id":"b2","label":"プランを確認する","from":"ln_007","to":"ln_012"},{"id":"b3","label":"開通してもらう","from":"ln_013","to":"ln_018"},{"id":"b4","label":"支払って締める","from":"ln_019","to":"ln_022"}],"lines":[{"id":"ln_001","speakerId":"S2","en":"Hi, I'd like to get a SIM card for my phone.","ja":"こんにちは、スマホ用のSIMカードが欲しいのですが。","note":"I'd like to 〜 は I want to 〜 より丁寧で、店頭ではこちらが基本。","skip":false},{"id":"ln_002","speakerId":"S1","en":"Sure. How long are you staying?","ja":"かしこまりました。ご滞在はどのくらいですか？","note":"How long are you staying? は滞在期間を聞く定番。現在進行形で未来を表す。","skip":false},{"id":"ln_003","speakerId":"S2","en":"About ten days, and I'll be traveling around a lot.","ja":"10日ほどです。あちこち移動する予定です。","note":"travel around = あちこち回る。理由を一言添えると会話が続きやすい。","skip":false},{"id":"ln_004","speakerId":"S1","en":"Got it. Do you need calls, or just data?","ja":"承知しました。通話も必要ですか、それともデータだけですか？","note":"Got it. は「承知しました」の口語。店員も客も使う。","skip":false},{"id":"ln_005","speakerId":"S2","en":"Mostly data, but I might need to make a few local calls.","ja":"ほとんどデータですが、現地で何回か電話するかもしれません。","note":"might need to 〜 で「〜するかもしれない」と含みを残す言い方。","skip":false},{"id":"ln_006","speakerId":"S1","en":"Then I'd recommend our ten-day plan. Twenty gigs for thirty dollars.","ja":"でしたら10日間プランがおすすめです。20ギガで30ドルです。","note":"gigs = gigabytes の口語。値段は for + 金額。","skip":false},{"id":"ln_007","speakerId":"S2","en":"What happens if I run out of data before I leave?","ja":"帰国前にデータを使い切ったらどうなりますか？","note":"run out of 〜 = 〜を使い切る。旅行英語の最頻出表現のひとつ。","skip":false},{"id":"ln_008","speakerId":"S1","en":"It slows down, but you can still use it. Or you can top up anytime.","ja":"速度が落ちますが、使い続けられます。いつでもチャージもできます。","note":"top up = チャージする、追加購入する。イギリス系英語圏で特によく使う。","skip":false},{"id":"ln_009","speakerId":"S2","en":"That sounds fine. Does it come with a local number?","ja":"それで問題なさそうです。現地の電話番号は付いてきますか？","note":"come with 〜 = 〜が付いてくる。商品説明で頻出。","skip":false},{"id":"ln_010","speakerId":"S1","en":"Yes, you'll get one as soon as we activate it.","ja":"はい、開通した時点ですぐ発番されます。","note":"activate = 開通する、有効化する。as soon as 〜 = 〜したらすぐ。","skip":false},{"id":"ln_011","speakerId":"S2","en":"One more thing. Will it work with my phone?","ja":"もう一つだけ。私のスマホで使えますか？","note":"One more thing. は追加で質問するときの前置き。丸暗記推奨。","skip":false},{"id":"ln_012","speakerId":"S1","en":"Let me check. Is your phone unlocked?","ja":"確認しますね。SIMロックは解除されていますか？","note":"unlocked = SIMロック解除済み。Let me check. は確認の定番。","skip":false},{"id":"ln_013","speakerId":"S2","en":"I think so. I bought it directly from the manufacturer.","ja":"たぶん大丈夫です。メーカーから直接買ったので。","note":"I think so. で断定を避ける。directly from 〜 = 〜から直接。","skip":false},{"id":"ln_014","speakerId":"S1","en":"Perfect. Could I borrow your phone for a second?","ja":"承知しました。少しスマホをお借りできますか？","note":"for a second = ちょっとの間。borrow は「借りる」で使用者が持ち帰らない場面。","skip":false},{"id":"ln_015","speakerId":"S2","en":"Sure, here you go. Should I keep the old SIM?","ja":"はい、どうぞ。元のSIMは取っておいたほうがいいですか？","note":"Here you go. は物を手渡すときの定型。Should I 〜? で助言を求める。","skip":false},{"id":"ln_016","speakerId":"S1","en":"Definitely. Put it somewhere safe so you don't lose it.","ja":"ぜひそうしてください。無くさないよう安全な場所に。","note":"Definitely. は強い肯定の相づち。so + 主語 + 動詞 で目的を表す。","skip":false},{"id":"ln_017","speakerId":"S2","en":"Will do. Do I need to change any settings myself?","ja":"そうします。設定は自分で変える必要がありますか？","note":"Will do. = そうします。I will do it. の省略で、口語では非常によく使う。","skip":false},{"id":"ln_018","speakerId":"S1","en":"No, it's automatic. Just restart your phone if it doesn't connect.","ja":"いいえ、自動です。繋がらなければ再起動だけしてください。","note":"Just 〜 で「〜するだけ」。トラブル対応の説明で頻出。","skip":false},{"id":"ln_019","speakerId":"S2","en":"Got it. Can I pay by card?","ja":"わかりました。カードで払えますか？","note":"pay by card / pay in cash。前置詞が by と in で違う点に注意。","skip":false},{"id":"ln_020","speakerId":"S1","en":"Of course. Just tap here whenever you're ready.","ja":"もちろんです。準備ができたらこちらにタッチしてください。","note":"whenever you're ready = ご準備ができ次第。急かさない丁寧な言い方。","skip":false},{"id":"ln_021","speakerId":"S2","en":"Thanks a lot. You've been really helpful.","ja":"ありがとうございます。とても助かりました。","note":"You've been really helpful. は現在完了で「今までのやりとり全体」への感謝。","skip":false},{"id":"ln_022","speakerId":"S1","en":"No problem at all. Enjoy your trip.","ja":"とんでもないです。良いご旅行を。","note":"No problem at all. は You're welcome. のカジュアルで温かい版。","skip":false}],"words":[{"id":"w_001","en":"travel around","ja":"あちこち回る、移動して回る","type":"phrase","lineIds":["ln_003"],"note":""},{"id":"w_002","en":"Got it.","ja":"わかりました、承知しました","type":"phrase","lineIds":["ln_004","ln_019"],"note":"客も店員も使える万能の相づち"},{"id":"w_003","en":"gigs","ja":"ギガ（ギガバイト）","type":"word","lineIds":["ln_006"],"note":"gigabytes の口語。複数形で使う"},{"id":"w_004","en":"run out of","ja":"使い切る、切らす","type":"phrase","lineIds":["ln_007"],"note":"旅行英語の最頻出表現のひとつ"},{"id":"w_005","en":"slow down","ja":"速度が落ちる、遅くなる","type":"phrase","lineIds":["ln_008"],"note":""},{"id":"w_006","en":"top up","ja":"チャージする、追加購入する","type":"phrase","lineIds":["ln_008"],"note":"イギリス系英語圏で特によく使う"},{"id":"w_007","en":"come with","ja":"〜が付いてくる、〜が含まれる","type":"phrase","lineIds":["ln_009"],"note":"商品説明で頻出"},{"id":"w_008","en":"activate","ja":"開通する、有効化する","type":"word","lineIds":["ln_010"],"note":""},{"id":"w_009","en":"as soon as","ja":"〜したらすぐに","type":"phrase","lineIds":["ln_010"],"note":""},{"id":"w_010","en":"One more thing.","ja":"もう一つだけ（質問が）","type":"phrase","lineIds":["ln_011"],"note":"追加質問の前置き。丸暗記推奨"},{"id":"w_011","en":"Let me check.","ja":"確認しますね","type":"phrase","lineIds":["ln_012"],"note":""},{"id":"w_012","en":"unlocked","ja":"SIMロックが解除された","type":"word","lineIds":["ln_012"],"note":"反対は locked"},{"id":"w_013","en":"manufacturer","ja":"メーカー、製造元","type":"word","lineIds":["ln_013"],"note":""},{"id":"w_014","en":"for a second","ja":"ちょっとの間","type":"phrase","lineIds":["ln_014"],"note":""},{"id":"w_015","en":"Here you go.","ja":"はい、どうぞ","type":"phrase","lineIds":["ln_015"],"note":"物を手渡すときの定型"},{"id":"w_016","en":"Definitely.","ja":"ぜひ、もちろん","type":"phrase","lineIds":["ln_016"],"note":"強い肯定の相づち"},{"id":"w_017","en":"Will do.","ja":"そうします","type":"phrase","lineIds":["ln_017"],"note":"I will do it. の省略。口語で頻出"},{"id":"w_018","en":"restart","ja":"再起動する","type":"word","lineIds":["ln_018"],"note":""},{"id":"w_019","en":"pay by card","ja":"カードで払う","type":"phrase","lineIds":["ln_019"],"note":"現金なら pay in cash。前置詞が違う"},{"id":"w_020","en":"whenever you're ready","ja":"ご準備ができ次第","type":"phrase","lineIds":["ln_020"],"note":"急かさない丁寧な言い方"}],"createdAt":1754179200000,"updatedAt":1754179200000,"schemaVersion":3}];
</script>

    { name: 'progress',      keyPath: 'key' },

    { name: 'settings',      keyPath: 'k' }
  ];

  // §5.9 設定はプロフィールごと（"app|tamo"）。台本に属する共有情報は
  // どちらの部屋のものでもないので、"shared" の1件に分けて置く。
  var SETTINGS_PREFIX = 'app';
  var SETTINGS_SHARED_KEY = 'shared';
  var LS_MIRROR_KEY = 'est.settings.mirror'; // 起動直後にテーマを当てるためのミラー

  // §5.7 の既定値
  var DEFAULT_SETTINGS = {
    engine: 'local',
    cloud: { endpoint: '', token: '', voiceMap: {}, model: 'tts-1-hd' },
    // §5.7 §7.5 の5段階に必ず含まれる値にする。段階外だと設定画面を開いた
    // だけで速度が黙って変わる。0.85 なのは使う2人が A1〜A2 の段階にいるため。

    localVoiceEn: null,                                // 性別指定のない話者に使う既定ボイス
    localVoiceByGender: { female: null, male: null },  // §7.2 話者ごとに声を変える
    mic: { noiseFloor: null, onsetThreshold: null, calibratedAt: null },
    countRatio: 0.55,
    masteryBase: 1200,
    masteryPerWord: 60,
    inputMode: 'voice',
    dailyGoalLaps: 10,
    theme: 'auto',
    fontScale: 1.0,
    recordOpens: true,         // §4.1 一覧モードで開いた行を復習キューに入れるか
    autoBackups: []            // §6.4 直近3世代（部屋ごとに持つ）
  };

  // 台本に属する共有情報（どちらの部屋からでも同じものを見る）
  var DEFAULT_SHARED = {
    samplesSeeded: false,      // サンプル台本を入れたか
    publishedAt: 0,            // §6.5 最後に取り込んだ配信の publishedAt
    feedTopicIds: []           // 配信由来のトピックid。手元で作った台本と区別するため
  };

  var dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!self.indexedDB) { reject(new Error('この環境では IndexedDB が使えません')); return; }
      var req = indexedDB.open(DB_NAME, DB_VERSION);

      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('別のタブが古いデータベースを開いています')); };

       wordProgress   "mari|tpc_xxx|w_003"

    // （起動直後に読む設定のためで、選択画面はこの後すぐ出る）
    return (EST.profile && EST.profile.get()) || 'tamo';
  }

  function progressKey(topicId, lineId) { return pid() + '|' + topicId + '|' + lineId; }
  function wordProgressKey(topicId, wordId) { return pid() + '|' + topicId + '|' + wordId; }
  function topicProgressKey(topicId) { return pid() + '|' + topicId; }
  function settingsKey(profileId) { return SETTINGS_PREFIX + '|' + (profileId || pid()); }

  // その行が今の部屋のものか（バックアップの絞り込みに使う）
  function belongsToProfile(key, profileId) {
    return String(key || '').indexOf((profileId || pid()) + '|') === 0;
  }

  /* ---- 一覧モードで開いた記録（§4.1・§5.5） ---------------------------
     Progress レコードが無ければ既定形で新規作成し、openedCount を1増やす。
     カウント・レイテンシ等は F4〜F7 が別途書き込むので、ここでは触らない。
  --------------------------------------------------------------------- */

    var key = progressKey(topicId, lineId);
    return get('progress', key).then(function (rec) {
      var next = rec || EST.schema.defaultProgress(pid(), topicId, lineId);
      next.openedCount = (next.openedCount || 0) + 1;
      next.lastOpenedAt = Date.now();
      next.updatedAt = Date.now();

  function isPlainObject(x) {

  // （cloud / mic / localVoiceByGender）は、保存側に一部しか無くても

    if (isPlainObject(v)) {

        if (isPlainObject(out[k]) && isPlainObject(v[k])) out[k] = withDefaults(out[k], v[k]);
        else out[k] = v[k];

    return get('settings', settingsKey(profileId)).then(function (rec) {
      var s = deepDefault(rec && rec.v);
      mirror(s);
      return s;
    });
  }

    var v = deepDefault(s);
    mirror(v);
    return put('settings', { k: settingsKey(profileId), v: v }).then(function () { return v; });
  }

  function loadShared() {
    return get('settings', SETTINGS_SHARED_KEY).then(function (rec) {
      return withDefaults(DEFAULT_SHARED, rec && rec.v);
    });
  }

  function saveShared(v) {
    var out = withDefaults(DEFAULT_SHARED, v);
    return put('settings', { k: SETTINGS_SHARED_KEY, v: out }).then(function () { return out; });
  }

  function mirror(s) {
    try {
      localStorage.setItem(LS_MIRROR_KEY, JSON.stringify({
        theme: s.theme, fontScale: s.fontScale
      }));
    } catch (e) { /* プライベートモード等。失敗しても致命的ではない */ }
  }

    try {
      var raw = localStorage.getItem(LS_MIRROR_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

    DB_NAME: DB_NAME,
    DB_VERSION: DB_VERSION,
    STORES: STORES.map(function (s) { return s.name; }),
    DEFAULT_SETTINGS: DEFAULT_SETTINGS,
    DEFAULT_SHARED: DEFAULT_SHARED,
    SETTINGS_SHARED_KEY: SETTINGS_SHARED_KEY,
    progressKey: progressKey,
    wordProgressKey: wordProgressKey,
    topicProgressKey: topicProgressKey,
    settingsKey: settingsKey,
    belongsToProfile: belongsToProfile,
    markLineOpened: markLineOpened,
    loadShared: loadShared,
    saveShared: saveShared,
    open: open,
    get: get,
    getAll: getAll,
    put: put,
    bulkPut: bulkPut,
    del: del,
    clear: clear,
    loadSettings: loadSettings,
    saveSettings: saveSettings,
    readMirror: readMirror
  };
})(window.EST = window.EST || {});

;(function (EST) {

  var AUDIENCES = ['tamo', 'mari', 'both'];

  var ORIGINS = ['seed', 'feed', 'local'];

    var ymd = '' + d.getFullYear() + pad3(d.getMonth() + 1).slice(-2) + pad3(d.getDate()).slice(-2);
    var rnd = Math.random().toString(36).slice(2, 6);

      } else {

      if (!label && sp && sp.rest) { label = sp.label; en = sp.rest; }

      return { label: label, en: en, ja: ja };

      if (line === SEP_MARK) return;
      var label = null, text = line;
      if (useLabels) {
        var sp = splitLabel(line);
        if (sp && sp.rest) { label = sp.label; text = sp.rest; }
      }
      var cls = classifyLine(text);
      if (cls === 'JA') {
        if (entries.length) {
          var last = entries[entries.length - 1];
          // JA行が2行続いたら結合する（§6.1 手順5）
          last.ja = last.ja ? (last.ja + text) : text;
        } else {
          pendingJa.push(text);
        }
      } else if (cls === 'EN') {
        // EN行が2行続いたら、前の行は訳なしで確定（新しい entry を積むだけでよい）
        entries.push({ label: label, en: text, ja: pendingJa.join('') });
        pendingJa = [];
      }
    });
    return entries;
  }

  function resolveSpeakers(entries, adopt) {
    var speakers = [], map = {};
    if (adopt) {
      entries.forEach(function (e) {
        if (e.label && !map[e.label]) {
          var id = 'S' + (speakers.length + 1);
          map[e.label] = id;
          speakers.push({ id: id, label: e.label, gender: '' });
        }
      });
      var last = speakers.length ? speakers[0].id : 'S1';
      entries.forEach(function (e) {
        e.speakerId = e.label ? map[e.label] : last;   // ラベルのない行は直前の話者を引き継ぐ
        last = e.speakerId;
      });
    } else {
      speakers = [{ id: 'S1', label: 'A', gender: '' }, { id: 'S2', label: 'B', gender: '' }];
      entries.forEach(function (e, i) { e.speakerId = (i % 2 === 0) ? 'S1' : 'S2'; });
    }
    if (!speakers.length) speakers = [{ id: 'S1', label: 'A', gender: '' }];
    return speakers;
  }

  /* ---- チャンク自動分割（§1.8） -------------------------------------- */
  function bareWord(w) {
    return String(w).replace(/^[^A-Za-z0-9']+/, '').replace(/[^A-Za-z0-9']+$/, '').toLowerCase();
  }

  // tokens[i] の直前で切るべきかの点数。0 なら切らない。
  function breakScore(tokens, i) {
    if (i <= 0 || i >= tokens.length) return 0;
    var prev = tokens[i - 1];
    var cur = bareWord(tokens[i]);
    var s = 0;
    if (/[,;:]$/.test(prev)) s = Math.max(s, 5);                 // カンマの直後がいちばん強い
    if (CONJ[cur] || REL[cur]) s = Math.max(s, 4);               // 接続詞・関係詞の直前
    if (cur === 'to' && i + 1 < tokens.length) s = Math.max(s, 3); // to不定詞の直前
    if (PREP[cur]) s = Math.max(s, 3);                           // 前置詞の直前
    return s;
  }

  function splitChunks(en) {
    var tokens = String(en == null ? '' : en).trim().split(/\s+/).filter(Boolean);
    if (tokens.length <= 1) return tokens.length ? [tokens.join(' ')] : [];

    var cuts = [];
    for (var i = 1; i < tokens.length; i++) {
      if (breakScore(tokens, i) >= CHUNK_BREAK_MIN) cuts.push(i);
    }
    var groups = cutsToGroups(tokens.length, cuts);
    groups = splitLongGroups(tokens, groups);
    groups = absorbSingles(groups);

    return groups.map(function (g) { return tokens.slice(g[0], g[1]).join(' '); });
  }

  function cutsToGroups(len, cuts) {
    var groups = [], start = 0;
    cuts.forEach(function (c) { if (c > start) { groups.push([start, c]); start = c; } });
    groups.push([start, len]);
    return groups;
  }

  // 5語を超えたら、その中の最も強い切れ目でもう一度割る（§1.8）
  function splitLongGroups(tokens, groups) {
    var out = [], guard = 0;
    var queue = groups.slice();
    while (queue.length && guard++ < 200) {
      var g = queue.shift();
      var len = g[1] - g[0];
      if (len <= CHUNK_MAX_WORDS) { out.push(g); continue; }
      var bestAt = -1, bestScore = -1;
      for (var i = g[0] + 1; i < g[1]; i++) {
        var sc = breakScore(tokens, i);
        // 中央に近いほうを優先すると、極端に偏った分割になりにくい
        var center = 1 - Math.abs((i - g[0]) / len - 0.5);
        var total = sc * 10 + center;
        if (sc > 0 && total > bestScore) { bestScore = total; bestAt = i; }
      }
      if (bestAt < 0) bestAt = g[0] + Math.ceil(len / 2);   // 切れ目が無ければ中央で割る
      queue.unshift([bestAt, g[1]]);
      queue.unshift([g[0], bestAt]);
    }
    return out.sort(function (a, b) { return a[0] - b[0]; });
  }

  // 1語だけになったら前のチャンクに吸収する（§1.8）
  function absorbSingles(groups) {
    var out = [];
    groups.forEach(function (g) {
      var len = g[1] - g[0];
      if (len === 1 && out.length) { out[out.length - 1][1] = g[1]; return; }
      out.push([g[0], g[1]]);
    });
    // 先頭が1語のまま残ったら次に吸収させる
    if (out.length >= 2 && out[0][1] - out[0][0] === 1) {
      out[1][0] = out[0][0];
      out.shift();
    }
    return out;
  }

  /* ---- ブロック（§1.5） ---------------------------------------------- */
  // ブロックは「何行目から始まるか」の配列（starts）として扱うほうが編集しやすい。
  function autoBlockStarts(lineCount) {
    if (lineCount < BLOCK_AUTO_MIN) return [];       // 12行以下はブロックを作らない
    var starts = [];
    for (var i = 0; i < lineCount; i += BLOCK_AUTO_SIZE) starts.push(i);
    return starts;
  }

  function blocksToStarts(blocks, lines) {
    if (!blocks || !blocks.length) return [];
    var index = {};
    lines.forEach(function (l, i) { index[l.id] = i; });
    var starts = [];
    blocks.forEach(function (b) {
      var i = index[b && b.from];
      if (typeof i === 'number' && starts.indexOf(i) < 0) starts.push(i);
    });
    starts.sort(function (a, b) { return a - b; });
    if (!starts.length) return [];
    if (starts[0] !== 0) starts.unshift(0);
    return starts;
  }

  function startsToBlocks(starts, lines, labels) {
    if (!starts || starts.length <= 1) return [];
    var out = [];
    starts.forEach(function (s, i) {
      var end = (i + 1 < starts.length ? starts[i + 1] : lines.length) - 1;
      if (s > end) return;
      out.push({
        id: 'b' + (out.length + 1),
        label: (labels && labels[i]) || ('パート' + (out.length + 1)),
        from: lines[s].id,
        to: lines[end].id
      });
    });
    return out;
  }

  /* ---- 検証（§6.3） --------------------------------------------------- */
  // エラーは1個ずつ返さず、全部まとめて返す（直す側が何往復もしないで済むように）
  function validateTopic(t, opts) {
    opts = opts || {};
    var errors = [], warnings = [];
    if (!t || typeof t !== 'object') return { errors: ['台本オブジェクトとして読めません'], warnings: [] };

    if (!String(t.title || '').trim()) errors.push('タイトルを入れてください');

    if (!Array.isArray(t.lines) || !t.lines.length) {
      errors.push('行が1件もありません');
    } else {
      t.lines.forEach(function (l, i) {
        var no = '（' + (i + 1) + '行目）';
        if (!l || !String(l.en || '').trim()) errors.push(no + '英文が空です');
        else if (!/[A-Za-z]/.test(l.en)) errors.push(no + '英文に英字が含まれていません');
        if (l && !String(l.ja || '').trim()) warnings.push(no + '和訳がありません');
      });
      var ids = {};
      t.lines.forEach(function (l, i) {
        if (!l || !l.id) return;
        if (ids[l.id]) errors.push('行IDが重複しています: ' + l.id);
        ids[l.id] = true;
      });
    }

    var sids = {};
    (t.speakers || []).forEach(function (s) {
      if (!s || !s.id) { errors.push('話者IDのない話者があります'); return; }
      if (sids[s.id]) errors.push('話者IDが重複しています: ' + s.id);
      sids[s.id] = true;
    });
    if (!(t.speakers || []).length) errors.push('話者が1人もいません');

    (t.lines || []).forEach(function (l, i) {
      if (l && l.speakerId && !sids[l.speakerId]) {
        errors.push('（' + (i + 1) + '行目）存在しない話者が指定されています: ' + l.speakerId);
      }
    });

    if (!t.myRole) {
      // S5/S6 に必須なので、保存時は通さない（§6.3 手順5）
      (opts.requireMyRole === false ? warnings : errors).push('自分の役（myRole）を選んでください');
    } else if (!sids[t.myRole]) {
      errors.push('自分の役に存在しない話者が指定されています: ' + t.myRole);
    }

    if (!t.audience) {
      // §6.3: 値が入っていなければ myRole と同じように保存を止める。
      // 黙って both になると相手の一覧に流れ込むので、ここは既定値で救わない。
      (opts.requireAudience === false ? warnings : errors).push('誰の台本か（自分用・相手用・両方）を選んでください');
    } else if (AUDIENCES.indexOf(String(t.audience)) < 0) {
      errors.push('誰の台本か（audience）の値が不正です: ' + t.audience);
    }

    (t.words || []).forEach(function (w, i) {
      if (!w || !String(w.en || '').trim()) errors.push('語彙 ' + (i + 1) + ' 件目の英語が空です');
    });

    return { errors: errors, warnings: warnings };
  }

  /* ---- 正規化（§6.3 手順4・6・7） ------------------------------------- */
  function normalizeTopic(input, opts) {
    opts = opts || {};
    var src = input || {};
    var now = Date.now();

    var speakers = (Array.isArray(src.speakers) ? src.speakers : [])
      .filter(function (s) { return s && s.id; })
      .map(function (s) {
        return { id: String(s.id), label: String(s.label || s.id), gender: s.gender || '' };
      });
    if (!speakers.length) speakers = [{ id: 'S1', label: 'A', gender: '' }];

    var speakerIds = speakers.map(function (s) { return s.id; });

    var lines = (Array.isArray(src.lines) ? src.lines : []).map(function (l, i) {
      l = l || {};
      var en = String(l.en == null ? '' : l.en).trim();
      var chunks = Array.isArray(l.chunks) && l.chunks.length ? l.chunks.map(String) : splitChunks(en);
      return {
        id: l.id ? String(l.id) : 'ln_' + pad3(i + 1),         // 手順4: 無ければ自動採番
        speakerId: (l.speakerId && speakerIds.indexOf(String(l.speakerId)) >= 0)
                     ? String(l.speakerId) : speakerIds[i % speakerIds.length],
        en: en,
        ja: String(l.ja == null ? '' : l.ja).trim(),
        note: String(l.note == null ? '' : l.note),
        alt: Array.isArray(l.alt) ? l.alt.map(String) : [],
        chunks: chunks,
        skip: !!l.skip
      };
    });

    // 手順6: blocks 未指定かつ13行以上なら5行ずつ自動分割
    var starts = blocksToStarts(src.blocks, lines);
    var labels = (Array.isArray(src.blocks) ? src.blocks : []).map(function (b) { return b && b.label; });
    if (!starts.length) { starts = autoBlockStarts(lines.length); labels = []; }
    var blocks = startsToBlocks(starts, lines, labels);

    // 手順7: words の自動抽出は F6 の担当。F1 では与えられたものを保持するだけ。
    var lineIdSet = {};
    lines.forEach(function (l) { lineIdSet[l.id] = true; });
    var words = (Array.isArray(src.words) ? src.words : []).map(function (w, i) {
      w = w || {};
      return {
        id: w.id ? String(w.id) : 'w_' + pad3(i + 1),
        en: String(w.en == null ? '' : w.en).trim(),
        ja: String(w.ja == null ? '' : w.ja).trim(),
        type: (w.type === 'word' || w.type === 'phrase') ? w.type
              : (countWords(w.en) > 1 ? 'phrase' : 'word'),
        lineIds: (Array.isArray(w.lineIds) ? w.lineIds : [])
                   .map(String).filter(function (id) { return lineIdSet[id]; }),
        note: String(w.note == null ? '' : w.note)
      };
    });

    var myRole = src.myRole && speakerIds.indexOf(String(src.myRole)) >= 0 ? String(src.myRole) : '';

    return {
      id: src.id ? String(src.id) : (opts.id || newTopicId()),
      title: String(src.title == null ? '' : src.title).trim(),
      titleEn: String(src.titleEn == null ? '' : src.titleEn).trim(),
      level: String(src.level == null ? '' : src.level).trim(),
      tags: (Array.isArray(src.tags) ? src.tags : []).map(String).filter(Boolean),
      // §6.3: "both" への救済は外部JSON（配信・同梱サンプル）専用。
      // opts.rescueAudience を渡した呼び出し元でだけ適用する。
      // 編集画面はこれを渡さないので、未指定・不正な値はそのまま空にして
      // 保存時に myRole と同じくエラーで止める（黙って both になるのを防ぐ）。
      audience: AUDIENCES.indexOf(String(src.audience)) >= 0 ? String(src.audience)
                : (opts.rescueAudience ? AUDIENCE_DEFAULT : ''),
      // §6.5 どこから来た台本か。配信が削除できるのは feed 由来だけで、
      // seed（同梱サンプル）と local（端末内で作ったもの）は対象外にする。
      // 既存レコードの由来は保つ（再取り込みで上書きしない）。
      origin: ORIGINS.indexOf(String(opts.origin)) >= 0 ? String(opts.origin)
              : (ORIGINS.indexOf(String(src.origin)) >= 0 ? String(src.origin) : 'local'),
      myRole: myRole,
      speakers: speakers,
      blocks: blocks,
      lines: lines,
      words: words,
      createdAt: Number(src.createdAt) || now,
      updatedAt: now,
      schemaVersion: SCHEMA_VERSION
    };
  }

  /* ---- Progress の既定形（§5.5） -------------------------------------
     一覧モード（§4.1）で行を開いた記録だけを先に持たせる。
     counts/latency/mastered 等の実データは F4〜F7 が書き込む。
  --------------------------------------------------------------------- */
  function defaultProgress(profileId, topicId, lineId) {
    return {
      key: profileId + '|' + topicId + '|' + lineId,
      profileId: profileId,
      topicId: topicId,
      lineId: lineId,
      counts: { total: 0, byStage: {} },
      latency: { history: [], median5: null, best: null },
      stalls: 0,
      openedCount: 0,
      lastOpenedAt: null,
      mastered: false,
      masteredAt: null,
      updatedAt: 0
    };
  }

  /* ---- 見積り（§6.2 の「1周 約◯秒」） -------------------------------- */
  function lapSeconds(lines, rate) {
    rate = Number(rate) || DEFAULT_RATE;
    var ms = 0;
    (lines || []).forEach(function (l) {
      if (!l || l.skip) return;
      ms += countWords(l.en) * WORD_MS / rate + LINE_GAP_MS;
    });
    return Math.round(ms / 1000);
  }

  /* ---- JSON のエラー位置（§6.3 手順1「不正なJSON」だけ出さない） ------ */
  function parseJsonWithPosition(text) {
    try {
      return { ok: true, value: JSON.parse(text) };
    } catch (e) {
      var msg = String(e && e.message || e);
      var m = /position\s+(\d+)/i.exec(msg);
      var where = '';
      if (m) {
        var pos = Number(m[1]);
        var before = text.slice(0, pos);
        var line = before.split('\n').length;
        var col = pos - before.lastIndexOf('\n');
        where = line + '行目 ' + col + '文字目';
      } else {
        var lm = /line\s+(\d+)\s+column\s+(\d+)/i.exec(msg);
        if (lm) where = lm[1] + '行目 ' + lm[2] + '文字目';
      }
      return { ok: false, error: msg, where: where };
    }
  }

  EST.schema = {
    SCHEMA_VERSION: SCHEMA_VERSION,
    AUDIENCES: AUDIENCES,
    AUDIENCE_DEFAULT: AUDIENCE_DEFAULT,
    ORIGINS: ORIGINS,
    BLOCK_AUTO_MIN: BLOCK_AUTO_MIN,
    BLOCK_AUTO_SIZE: BLOCK_AUTO_SIZE,
    DEFAULT_RATE: DEFAULT_RATE,

    countWords: countWords,
    jaRatio: jaRatio,
    toHiragana: toHiragana,
    normalizeForSearch: normalizeForSearch,
    classifyLine: classifyLine,
    normalizeRaw: normalizeRaw,
    parseScript: parseScript,

    splitChunks: splitChunks,
    autoBlockStarts: autoBlockStarts,
    blocksToStarts: blocksToStarts,
    startsToBlocks: startsToBlocks,

    validateTopic: validateTopic,
    normalizeTopic: normalizeTopic,
    defaultProgress: defaultProgress,
    lapSeconds: lapSeconds,
    newTopicId: newTopicId,
    pad3: pad3,
    parseJsonWithPosition: parseJsonWithPosition
  };
})(window.EST = window.EST || {});
